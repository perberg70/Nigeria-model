name: Publish prototypes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-pages.yml
      - site/**
      - prototype/africa-prototype.html
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public site
        run: |
          mkdir -p _site/nigeria
          cp site/index.html _site/index.html
          cp prototype/africa-prototype.html _site/nigeria/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
