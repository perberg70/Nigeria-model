  },
  /* Every country reference is resolved at render time from DATA.country / COUNTRY.profile(),
     so this reads correctly for whichever country is selected. Nothing here is
     hardcoded to a specific country. */
  emissionsChart:{
    title:"How the emissions chart is built",
    /* {country} is substituted by T() at render time. A template literal here would
       be evaluated once when MODALS is built and would freeze whichever country was
       selected at page load. */
    lede:"The chart shows {country}'s 2005–2024 profile, one selected SSP baseline, and where your "
      +"2050 target puts it. The shaded area between the baseline "
      +"and your target is what your target avoids, or adds.",
    body:()=>{
      const b=COUNTRY.baseline(), i50=b?b.years.indexOf(2050):-1;
      const prof=COUNTRY.profile(), name=DATA.country.name;
      const national=COUNTRY.hasColombiaSspBaseline();
      const nationalRec=national?COL_DATA.colombiaEmissions[COUNTRY.pathway()]:null;
      const tgtPct=state.drivers.mitigation;
      const anchor=COUNTRY.mitigationAnchor();
      const target=anchor*(1+tgtPct/100), cum=COUNTRY.cumulativeDifference();
      const obs=COUNTRY.observedSeries();
      const annual=obs.years.length>1 && obs.years.every((y,i)=>i===0||y-obs.years[i-1]===1);
      return `
      <ul class="chain">
        <li><div class="ico">1</div><div><b>The dark dotted line is ${obs.kind==="observed"?name+"'s recorded history":"an illustrative profile bridge"}</b>
          ${obs.kind==="observed"?`<span>Global Carbon Budget via Our World in Data, ${obs.years[0]}&ndash;${obs.years[obs.years.length-1]}${annual
            ? ` &mdash; ${obs.years.length} annual observations, so the line joins measured points throughout
               and interpolates nothing`
            : ` &mdash; ${obs.years.length} observations, not one for every year, so the line bridges the
               years between them rather than measuring them`}.
          It is the only line on this chart that is not a model output.</span>`:
          `<span>The five plotted points between 2005 and 2024 are interpolated from this prototype's
          rounded country-profile endpoints. They are illustrative values, not observed annual
          emissions and not a Global Carbon Budget extract for ${name}.</span>`}</div></li>
        <li><div class="ico">2</div><div><b>The grey line is a ${national?"Colombian SSP baseline scaled from paired R5 runs":"global scenario scaled to "+name}</b>
          ${national?`<span>The ${COUNTRY.label()} pathway does not publish a Colombian emissions
          series. The prototype starts from the observed 2024 <b>${fmtN(COL_DATA.observed[2024],1)} Mt</b>
          and scales it with Colombia's SSP population and GDP per capita through the integrated
          Burke &amp; Csereklyei aggregate-energy relation. With
          <code>L = ln(GDPpc<sub>t</sub>/GDPpc<sub>2024</sub>)</code>, the formula is
          <code>CO₂<sub>t</sub> = CO₂<sub>2024</sub> × (P<sub>t</sub>/P<sub>2024</sub>) × exp(0.48L + 0.065L²) × T<sub>R5,t</sub> × K<sub>R5,t</sub></code>,
          where each model has its own
          <code>T<sub>R5,t</sub> = (FE<sub>t</sub>/FE<sub>2024</sub>) /
          [(P<sub>t</sub>/P<sub>2024</sub>) exp(0.48L<sub>R5</sub> + 0.065L<sub>R5</sub>²)]</code>,
          with <code>L<sub>R5</sub> = ln(GDPpc<sub>R5,t</sub>/GDPpc<sub>R5,2024</sub>)</code>.
          <code>K<sub>R5,t</sub> = [(CO₂<sub>fossil+industry</sub> + CCS<sub>biomass</sub>)/FE]<sub>R5,t</sub>
          / [(CO₂<sub>fossil+industry</sub> + CCS<sub>biomass</sub>)/FE]<sub>R5,2024</sub></code>
          adds back each model's reported biomass CCS before indexing. It still contains
          R5 fuel, policy and fossil-capture assumptions. The median is taken after multiplying
          each paired model's demand and carbon factors.
          The dashed curve is the equal-weight,
          year-by-year median of <b>${nationalRec.models.length} model runs</b>:
          ${nationalRec.models.join(", ")}. The pale grey band spans their full minimum to maximum,
          not a probability interval. Together the paired R5 factors give
          <b>${fmtN(b.mt[i50],1)} Mt</b> in 2050;
          the model range is <b>${fmtN(nationalRec.mtMin[i50],1)}&ndash;${fmtN(nationalRec.mtMax[i50],1)} Mt</b>.
          The 0.48 starting response and 0.13 income interaction come from Burke &amp;
          Csereklyei's Table 5 ten-year within-country total-primary-energy model at
          its sample mean income. They are transferred to final energy and integrated
          across decades as a prototype assumption; neither is estimated for Colombia.
          The regional residual is an efficiency and structure proxy, not a Colombian measurement.
          The carbon factor is an R5 scenario transfer, not a measured Colombian pathway.
          Two AIM/CGE baseline rows lack biomass-CCS data and are excluded from the corrected
          ensemble. Some GCAM4 low-forcing values remain negative after the biomass-CCS
          add-back; other accounting or removals are unresolved, so this is not a gross
          atmospheric-emissions estimate. Mixed national and regional data vintages mean this is not a
          forcing-consistent Colombian projection. Model spread omits uncertainty in national
          drivers, elasticities, and the regional transfer.</span>`:`<span>The ${COUNTRY.label()} pathway does not publish a ${name} series. ${name}'s ${obs.kind==="observed"?"observed":"illustrative profile"}
          <b>${fmtN(prof.em2024,1)} Mt</b> for 2024 is carried forward on the <i>shape</i> of the global
          pathway's change, giving <b>${b?fmtN(b.mt[i50],1):"&mdash;"} Mt</b> in 2050. It is the
          scenario's direction applied to ${name}'s own starting point, not a ${name} projection anyone
          has published. Its first point is the 2024 profile value, so it leaves the dotted profile line
          exactly where that line ends.</span>`}</div></li>
        <li><div class="ico">3</div><div><b>Your target is set against the 2024 benchmark</b>
          <span>The slider's 0% mark is <b>${fmtN(anchor,1)} Mt</b> &mdash; ${name}'s ${obs.kind==="observed"?"observed emissions":"rounded prototype profile"}
          in 2024. Your
          ${tgtPct>0?"+":""}${tgtPct}% gives a 2050 target of <b>${fmtN(Math.max(0,target),1)} Mt</b>.
          The benchmark is fixed: it does not move when you change
          scenario.</span></div></li>
        <li><div class="ico">4</div><div><b>The green line runs from the baseline to that target, then keeps moving</b>
          <span>It follows the scenario baseline to 2025, then changes at a constant proportional
          rate to reach your 2050 target. That same rate continues to 2100. For a net-zero slider
          setting, the calculation uses a 0.01 Mt floor in 2050 so the logarithm is defined;
          the line approaches zero rather than reaching exactly zero.</span></div></li>
        <li><div class="ico">5</div><div><b>The shaded area is the running total</b>
          <span>The gap between the two lines is summed year by year from 2025 to 2100, which is the
          <b>${cum==null?"&mdash;":fmtN(Math.abs(cum)>=1000?Math.abs(cum)/1000:Math.abs(cum),2)}
          ${cum!=null&&Math.abs(cum)>=1000?"billion":"million"} tonnes</b> reported beneath the chart.
          Green marks years your pathway sits below the baseline, red years it sits above; where the
          lines cross, the interval is split at the crossing so a change of sign is never hidden inside
          one colour.</span></div></li>
        <li><div class="ico">6</div><div><b>This chart does not respond to the energy sliders</b>
          <span>The SSP choice changes the grey line, and the mitigation target changes the green line.
          Electrification and the generation mix drive the electricity panel lower down. The
          mitigation target here is set directly, so moving those energy sliders leaves the
          economy-wide lines where they are.</span></div></li>
      </ul>
      ${obs.kind==="observed"?`<div class="paperrow"><span aria-hidden="true">🗄️</span> <span class="lbl2">Observed emissions:</span>
        Global Carbon Budget, via Our World in Data, "Annual CO₂ emissions" for ${name}.
        <a class="paper" href="https://ourworldindata.org/grapher/annual-co2-emissions-per-country" target="_blank"
           rel="noopener noreferrer" title="Opens Our World in Data in a new tab">ourworldindata.org ↗</a></div>`:
       `<div class="paperrow"><span aria-hidden="true">🗄️</span> <span class="lbl2">Illustrative profile:</span>
        Rounded 2005 and 2024 country-profile endpoints; intervening chart points are interpolated.</div>`}
      ${national?`<div class="paperrow"><span aria-hidden="true">🗄️</span> <span class="lbl2">Socioeconomic paths:</span>
        IIASA-WiC POP 2025 and OECD ENV-Growth 2025, Colombia; and IIASA SSP 2018
        multi-model Final Energy, GDP|PPP, fossil/industrial CO₂ and reported biomass CCS,
        Latin America (R5).
        <a class="paper" href="https://ssp.apps.ece.iiasa.ac.at/" target="_blank"
           rel="noopener noreferrer" title="Opens the IIASA SSP explorer in a new tab">IIASA SSP explorer ↗</a></div>`:
       `<div class="paperrow"><span aria-hidden="true">🗄️</span> <span class="lbl2">Scenario trajectory:</span>
        RCMIP v5.1.0, <code>Emissions|CO2|MAGICC Fossil and Industrial</code>, World &mdash; the same
        scenario database the climate model itself reads.
        <a class="paper" href="https://www.rcmip.org/" target="_blank"
           rel="noopener noreferrer" title="Opens RCMIP in a new tab">rcmip.org ↗</a></div>`}`;
    },
    note:()=>COUNTRY.hasColombiaSspBaseline()
      ? "<b>The national SSP baseline is a prototype construction, not a country model run.</b> It is the median across available regional model runs combined with Colombia's national socioeconomic paths; the full model range is shown."
      : "<b>The scaling is a prototype construction, not a country model run.</b> {country}'s line follows a global pathway's relative change from its 2024 profile anchor; no institution has published it as a national projection."
  },

  journey:{
    title:"How it works",
    lede:"The left-side menu shows six steps in order: three choices followed by three sets of results. Within each step, you can open more detail, from the short answer to the underlying data and published sources.",
    body:`
      <p>Follow the numbered steps in the left-side menu. You can return to an earlier step and change a
      choice at any time; later results update from the choice you changed.</p>
      <h3>Your three choices</h3>
      <p><b>1. Choose country.</b> Select the South American country you want to explore.<br>
         <b>2. Shape your country's future.</b> Set the national mitigation target, economic growth, electrification and electricity-generation mix.<br>
         <b>3. Global scenario (SSP).</b> Choose the preferred global pathway for population, economies, energy use and international co-operation.</p>
      <h3>Your three result screens</h3>
      <p><b>4. Climate and cost.</b> Emissions over time, and what a tonne of CO&#8322; costs society.<br>
         <b>5. Air pollution.</b> Health effects of the pollutants that come with the energy mix.<br>
         <b>6. Local climate.</b> Temperature and rainfall change where you live.</p>
      <h3>How much detail you see — the six layers under every step</h3>
      <p>The steps above run from top to bottom in the left-side menu. Within each step, the same
      content is stacked in layers, shallowest first. Layer 1 is a short answer; layer 6 is the raw numbers
      and the papers behind them. Nothing below the surface is hidden from you — it is folded away until
      you ask for it, so that a screen never opens with everything at once.</p>
      <ul class="chain">
        <li><div class="ico">1</div><div><b>The answer</b>
          <span>The headline figure, the chart, or the map. Enough to take away at a glance.</span></div></li>
        <li><div class="ico">2</div><div><b>What it means, in plain words</b>
          <span>The caption beside every figure and the label on every slider: the unit, the year, and
          what is being compared with what.</span></div></li>
        <li><div class="ico">3</div><div><b>A term explained where you meet it</b>
          <span>Words with a dotted underline, the scenario cards and the pollutant names each give a
          one-sentence definition on hover or keyboard focus. Nothing navigates away.</span></div></li>
        <li><div class="ico">4</div><div><b>What could make this higher or lower</b>
          <span>The ◈ cue on every results screen. This is the one layer put in front of you rather than
          waiting to be asked for, because a single number shown with no visible uncertainty is the thing
          most easily trusted too far.</span></div></li>
        <li><div class="ico">5</div><div><b>The full explanation</b>
          <span>The four information panels on the opening screen and the ⓘ links beside the results — how to
          navigate, what runs the calculations, why the results rest on research, and what moves them.
          This panel is layer 5.</span></div></li>
        <li><div class="ico">6</div><div><b>The numbers, and the sources</b>
          <span>"Show data table" under each chart lists every plotted value. The methodology panel gives
          the settings used and links out to the published papers behind each main assumption. Below this
          layer there is only the model code itself.</span></div></li>
      </ul>
      <p>Not every step carries all six — a data table only exists where there is a chart — but the order
      never changes, and you can stop at any layer. Going deeper is always your choice, never a
      prerequisite for using the step you are on.</p>`,
    note:`<b>Nothing here is a forecast.</b> Each result answers "if the world went this way, and your
      country made these choices, what would follow?" — not "this is what will happen."`
  },

  /* ---- v2, 2026-08-24. Layer 5, reached from the mitigation slider's own box.
     Revised the same day: this modal now carries the target figures themselves,
     not only the explanation of why they are kept off the slider — the screen-2
     panel that used to state them was removed for the space it took (see
     ndcLink). So the first thing here must be the answer to the question the
     link asks; the basis argument follows it rather than leading. ---- */
  ndc:{
    title:"What {country} has already committed to",
    lede:"{country}'s targets under the Paris Agreement, as submitted to the United Nations — and why they are shown here rather than marked on the slider.",
    body:()=>{
      const n=NDC_TARGETS[DATA.country.iso]; if(!n) return "";
      return `
      <h3>The committed targets</h3>
      <ul class="chain ndc-chain">
        <li><div class="ico">2030</div><div><b>At most ${n.year2030} Mt CO₂e</b>
          <span>Ratified in the 2025 submission, unchanged from the 2020 one.</span></div></li>
        <li><div class="ico">2035</div><div><b>At most ${n.year2035} Mt CO₂e</b>
          <span>New in the 2025 submission, and the more ambitious of the two.</span></div></li>
      </ul>
      <p>Both are absolute ceilings on emissions in a single year — not reductions measured against a
      baseline year or a business-as-usual projection.</p>
      <div class="paperrow"><span aria-hidden="true">📄</span> <span class="lbl2">Source:</span>
        ${n.src} — <a class="paper" href="${n.href}" target="_blank" rel="noopener">UNFCCC NDC registry ↗</a></div>
      <h3>What the slider measures</h3>
      <p>A 2050 target for <b>fossil-fuel and industrial carbon dioxide</b>, expressed as a percentage change
      from {country}'s 2024 level of that same quantity. One gas, two sectors, one target year.</p>
      <h3>What the national targets measure</h3>
      <p>A ceiling on <b>net national emissions of all six greenhouse gases</b> — carbon dioxide, methane,
      nitrous oxide, HFCs, PFCs and sulphur hexafluoride — counted across energy, industrial processes,
      agriculture and land use, and waste. Land use is included, and it is a <i>net</i> figure, so removals
      count against emissions. The target years are 2030 and 2035.</p>
      <h3>Why that gap cannot be closed by eye</h3>
      <p>Three things differ at once: which gases are counted, which sectors are counted, and which year is
      being targeted. A number that is larger on one basis is not therefore weaker on the other — the two
      simply do not describe the same quantity. {country}'s 2024 fossil-and-industrial carbon dioxide figure
      used elsewhere in this tool is about ${fmtN(COUNTRY.profile().em2024,0)} Mt; the 2030 national target is
      ${n.year2030} Mt of a much broader total. Reading the second as "less ambitious" than a slider position
      would be a mistake this interface declines to invite.</p>
      <h3>What it would take to put them on one axis</h3>
      <p>{country}'s national greenhouse-gas inventory, to separate the gases and sectors the slider covers
      from the ones it does not, and an explicit assumption carrying the 2035 target through to 2050. Both
      are possible. Neither has been done here, and the prototype states that rather than presenting an
      estimate as if it were the published target.</p>`;
    },
    note:`<b>This panel describes something deliberately left undone.</b> The national targets are shown
      exactly as submitted, in their own units, and the conversion that would make them comparable is named
      rather than performed.`
  },

  engine:{
    title:"The IAM and data behind the results",
    lede:"The integrated assessment model (IAM) is the calculation engine. It combines scenario data, climate modelling and economic relationships to work out the consequences of the choices you made.",
    body:`
      <ul class="chain">
        <li><div class="ico">🌍</div><div>
          <b>SSPs — the scenarios you pick from</b>
          <span>Shared Socioeconomic Pathways. Five standard storylines about how the world develops,
          published by the IPCC research community and used by climate researchers worldwide so that
          different studies can be compared. They are the starting assumption, not a result — and they
          are not part of any one model.</span>
          <div class="paperrow"><span aria-hidden="true">📄</span> <span class="lbl2">On the SSPs:</span>
            Riahi et al. (2017),
            "The Shared Socioeconomic Pathways and their energy, land use, and greenhouse gas emissions
            implications: an overview", <i>Global Environmental Change</i> 42, 153–168.
            <a class="paper" href="https://doi.org/10.1016/j.gloenvcha.2016.05.009" target="_blank"
               rel="noopener noreferrer" title="Opens doi.org in a new tab">doi.org/10.1016/j.gloenvcha.2016.05.009 ↗</a></div></div></li>
        <li><div class="ico">🌡️</div><div>
          <b>FaIR — the climate model</b>
          <span>Takes emissions and works out temperature. It is a fast, simplified version of the large
          climate models, calibrated against them, so it can run in seconds instead of weeks. This is what
          produces the temperature and concentration numbers.</span>
          <div class="paperrow"><span aria-hidden="true">📄</span> <span class="lbl2">On FaIR:</span>
            Leach et al. (2021),
            "FaIRv2.0.0: a generalized impulse response model for climate uncertainty and future scenario
            exploration", <i>Geoscientific Model Development</i> 14(5), 3007–3036.
            <a class="paper" href="https://doi.org/10.5194/gmd-14-3007-2021" target="_blank"
               rel="noopener noreferrer" title="Opens doi.org in a new tab">doi.org/10.5194/gmd-14-3007-2021 ↗</a></div></div></li>
        <li><div class="ico">📈</div><div>
          <b>DICE — the economy</b>
          <span>Projects population, productivity and capital forward for each scenario, using the approach
          from the DICE integrated assessment model. This is what says how large the economy is that the
          climate damage lands on.</span>
          <div class="paperrow"><span aria-hidden="true">📄</span> <span class="lbl2">On DICE:</span>
            Barrage &amp; Nordhaus (2024),
            "Policies, projections, and the social cost of carbon: results from the DICE-2023 model",
            <i>PNAS</i> 121(13), e2312030121.
            <a class="paper" href="https://doi.org/10.1073/pnas.2312030121" target="_blank"
               rel="noopener noreferrer" title="Opens doi.org in a new tab">doi.org/10.1073/pnas.2312030121 ↗</a></div></div></li>
        <li><div class="ico">⚖️</div><div>
          <b>A damage function — warming into cost</b>
          <span>Converts degrees of warming into a share of economic output lost. This step is the most
          contested part of the whole chain: reasonable researchers disagree about the shape of this curve,
          and the answer moves a lot depending on which one is used.</span>
          <div class="paperrow"><span aria-hidden="true">📄</span> <span class="lbl2">On damage functions:</span>
            Howard &amp; Sterner (2025),
            "Methodology matters: a careful meta-analysis of climate damages",
            <i>Environmental and Resource Economics</i> 88(12), 3289–3327.
            <a class="paper" href="https://doi.org/10.1007/s10640-025-01016-7" target="_blank"
               rel="noopener noreferrer" title="Opens doi.org in a new tab">doi.org/10.1007/s10640-025-01016-7 ↗</a></div></div></li>
      </ul>`,
    note:`<b>What the four links are, and are not.</b> Each one is the published description of that
      component, or of the research literature it belongs to — background reading, so you can check the
      idea against its source. None of them documents the exact model version or the settings used in this
      tool. Those are in the "Why the results are based on research and data" panel.`
  },

  ssp:{
    title:"About these scenarios",
    lede:"These five climate pathways combine a Shared Socioeconomic Pathway (SSP) with a level of climate forcing reached by 2100.",
    body:`
      <p>They are not predictions and none of them is the expected outcome. They are common "what if"
      pathways used to compare climate-model results. The part before the hyphen describes the broad
      socioeconomic storyline; the number after it describes the pathway's approximate radiative forcing
      in 2100, measured in watts per square metre. A larger number generally means more warming.</p>
      <ul class="chain">
        <li><div class="ico">🌱</div><div><b>SSP1-1.9 · Very low emissions</b>
          <span>A sustainability storyline with very rapid emissions reductions; a pathway around 1.5°C.</span></div></li>
        <li><div class="ico">🍃</div><div><b>SSP1-2.6 · Low emissions</b>
          <span>The same sustainability storyline with strong, sustained reductions; well below 2°C.</span></div></li>
        <li><div class="ico">🛣️</div><div><b>SSP2-4.5 · Intermediate emissions</b>
          <span>A middle-of-the-road storyline in which emissions remain around current levels before declining.</span></div></li>
        <li><div class="ico">🧩</div><div><b>SSP3-7.0 · High emissions</b>
          <span>A regional-rivalry storyline in which emissions continue rising through much of the century.</span></div></li>
        <li><div class="ico">📈</div><div><b>SSP5-8.5 · Very high emissions</b>
          <span>A fossil-fuelled development storyline used as a high-end stress-test pathway.</span></div></li>
      </ul>
      <h3>Why SSP1 appears twice</h3>
      <p>SSP1-1.9 and SSP1-2.6 share the same broad sustainability storyline but make different assumptions
      about how strongly and how quickly global emissions fall. Treat them as two climate pathways, not as
      two different socioeconomic worlds.</p>`,
    note:`<b>Your choice here sets the world, not your country.</b> It fixes the global backdrop —
      emissions, temperature, the size of the world economy. What your country does is the separate
      choice you make in step 2.`
  },


  /* ---- v2, 2026-08-24, at Per's request. Screen 5's decomposition showed three
     bars and a net "index points" figure with nothing explaining what a point
     was or how the three relate. Everything below is derived live from the same
     functions the bars use, so the explanation cannot drift from the figure.
     The emissions section is the important one: it states a DISCONNECTION that
     a reader would otherwise assume away. ---- */
  /* Added 2026-09-02 with the elasticity itself. Screen 2 had no panel explaining
     what the growth slider DOES - the existing ref_gdp panel documents the slider's
     reference mark, not the demand model behind it. */
  energyDemand:{
    title:"How economic growth becomes energy demand",
    lede:"The growth you set on this slider does not raise energy use one-for-one. What sits between them is a measured number, and it carries a wide uncertainty.",
    body:()=>{
      const D=COL_DEMAND, g=state.drivers.gdp;
      const b=COUNTRY.energyScaleBand(2050);
      const pop2050=COUNTRY.populationAt(2050), pop0=COUNTRY.populationAt(D.baseYear);
      const pc=(x)=>fmtN(100*(Math.pow(x,1/25)-1),2)+"% per year";
      return `
      <ul class="chain">
        <li><div class="ico">1</div><div><b>Your slider sets total economic growth</b>
          <span>You chose <b>${g.toFixed(1)}% a year</b> to 2050. Over 25 years that makes the
          economy <b>${fmtN(Math.pow(1+g/100,25),2)}×</b> its 2025 size.</span></div></li>
        <li><div class="ico">2</div><div><b>People are separated from prosperity</b>
          <span>Colombia's population also changes, and it does so differently in every storyline.
          Under <b>${COUNTRY.narrative()}</b> it goes from <b>${fmtN(pop0,1)}m</b> in ${D.baseYear} to
          <b>${fmtN(pop2050,1)}m</b> in 2050 — <b>${fmtN(b.popRatio,3)}×</b>. Dividing that out
          leaves income per person rising <b>${fmtN(b.income,2)}×</b>. The two are separated because
          they act differently: an extra person needs energy roughly one-for-one, an extra dollar of
          income does not.</span></div></li>
        <li><div class="ico">3</div><div><b>Income is converted at Colombia's own elasticity</b>
          <span>A 1% rise in income per head raises energy use per head by <b>${D.elasticityTotal}%</b>,
          not 1%. This is the long-run figure estimated <i>for Colombia</i>, on Colombian data from
          ${D.period} — not borrowed from another country and not a world average.</span>
          <div class="paperrow"><span aria-hidden="true">📄</span> <span class="lbl2">The elasticity:</span>
            Patiño, Padilla, Alcántara &amp; Raymond (2020), "The Relationship of Energy and
            CO&#8322; Emissions with GDP per Capita in Colombia", <i>Atmosphere</i> 11(8), 778,
            Table 3 — <b>0.64</b>, standard error 0.14.
            <a class="paper" href="https://doi.org/${D.doi}" target="_blank"
               rel="noopener noreferrer" title="Opens doi.org in a new tab">doi.org/${D.doi} ↗</a></div></div></li>
        <li><div class="ico">4</div><div><b>The two are multiplied back together</b>
          <span>${fmtN(b.popRatio,3)} × ${fmtN(b.income,2)}<sup>${D.elasticityTotal}</sup> =
          <b>${fmtN(b.mid,2)}×</b> the energy Colombia used in ${D.baseYear}, or
          <b>${pc(b.mid)}</b>. Everything on the next two screens — emissions, air quality, deaths,
          money — is built on that one number.</span></div></li>
      </ul>
      <h3>How much of this is uncertain</h3>
      <p>The elasticity is an estimate with a standard error, so it comes with a range:
      <b>${D.ciLow} to ${D.ciHigh}</b>. Carried through the same arithmetic, 2050 energy demand is
      between <b>${fmtN(b.low,2)}×</b> and <b>${fmtN(b.high,2)}×</b> today's — a spread of
      <b>${fmtN(100*(b.high-b.low)/b.mid,0)}%</b> around the central figure. That is wider than the
      effect of several of the choices you are being asked to make, and it comes from the measurement,
      not from the policy.</p>
      <p><b>This is a parameter range, not a confidence interval on the forecast.</b> It says how
      precisely the relationship was measured on past data. It says nothing about whether that
      relationship holds to 2050.</p>
      <h3>The one place this estimate does not quite fit</h3>
      <p>Patiño and colleagues measured <b>primary</b> energy — everything Colombia takes in
      before conversion. This tool tracks <b>final</b> energy — what reaches the vehicle, factory and
      home. They are not the same quantity, and the elasticity was not estimated on the one being used
      here.</p>
      <p>Screen 4 uses <b>${D.altElasticity}</b>, Burke and Csereklyei's ten-year
      within-country estimate at their historical sample's mean income, with an
      income interaction and a regional scenario residual. It also measures
      <b>primary</b> energy. This screen continues to use Patiño's Colombian
      long-run 0.64 for final energy; the two estimates have different horizons,
      samples and model forms. The possible 2012–2013 IEA series break remains
      a limitation of the Patiño estimate.</p>
      <div class="paperrow"><span aria-hidden="true">📄</span> <span class="lbl2">The alternative:</span>
        ${D.altSource}.
        <a class="paper" href="https://doi.org/10.1016/j.eneco.2016.07.004" target="_blank"
           rel="noopener noreferrer" title="Opens doi.org in a new tab">doi.org/10.1016/j.eneco.2016.07.004 ↗</a></div>`;
    },
    note:`<b>What changed, and what it replaced.</b> Until 2026-09-02 this step used no elasticity and
      no population at all: energy simply grew at your slider rate minus a flat 1.3% a year for
      efficiency — a figure with no source behind it. The 1.3% is gone, because an elasticity below 1
      already contains the decoupling it was standing in for; keeping both would count it twice.`
  },

  /* Added 2026-09-02 at Per's request: the chart showed one number with no account
     of what would move it. Ranked by how much each driver ACTUALLY moves the figure,
     computed live - which is how bioenergy came to lead it. */
  ambientDrivers:{
    title:"What could make this number higher or lower",
    lede:"This is one result, from one set of choices and one set of measured parameters. Five things move it — and they do not move it by anything like the same amount.",
    body:()=>{
      const D=COUNTRY.ambientDrivers(2050); if(!D) return "";
      const A=COL_HEALTH.ambient, a=COUNTRY.healthData().air;
      const mixPM=COUNTRY.pollutantMixAnchor("PM25").filter(r=>r.share>0.05);
      const bio=COUNTRY.pollutantMixAnchor("PM25").find(r=>r.name==="Bioenergy");
      /* "avoided" is signed: negative means the pathway ADDS deaths. Never print a
         bare negative as though it were a benefit. */
      const d=v=>`<b>${fmtN(Math.abs(Math.round(v)))}</b> ${v>=0?"avoided":"<b>added</b>"}`;
      /* The WORD carries the sign, never a minus sign as well - "-64 added" says it twice
         and reads as a negative number of added deaths. */
      const sd=v=>fmtN(Math.abs(Math.round(v)))+(v>=0?" avoided":" added");
      const rows=mixPM.map(r=>[r.name, fmtN(r.gen,2)+"%", fmtN(r.share,1)+"%",
        fmtN(r.ef,r.ef<10?2:0)+" mg"]);
      return `
      <p>Your pathway currently shows ${d(D.central)} premature deaths a year in 2050,
      against the reference pathway.</p>

      <h3>1. Which low-emission sources grow — much the largest, and the least obvious</h3>
      <p><b>"Low-emission" is a carbon category. It is not a health category.</b> Sorted by
      how much of the power sector's fine particulates each source is responsible for, at
      ${COL_POWER.anchorYear}:</p>
      ${dataTable(["Source","Share of generation","Share of the power sector's PM₂.₅","PM₂.₅ per kWh"], rows)}
      <p><b>${bio.name} is ${fmtN(bio.gen,1)}% of ${DATA.country.name}'s generation and
      ${fmtN(bio.share,0)}% of its power-sector fine particulates.</b> Hydro, solar and wind
      emit none at the point of generation, so within the low-emission group the entire
      particulate burden sits on the one source that burns something.</p>
      <p>This model holds each source's share <i>within</i> its group at the observed split
      unless you change it. So raising the low-emission target raises bioenergy along with
      hydro and solar — and on those settings the generation-mix slider works
      <b>against</b> this screen:</p>
      ${dataTable(["Low-emission generation in 2050","Deaths a year against the reference"],[
        ["50%", sd(D.bioenergy.mixAt50)],
        [String(state.drivers.mix)+"% — your setting", sd(D.central)],
        ["100%", sd(D.bioenergy.mixAt100)]
      ])}
      <p><b>Hold bioenergy down and the picture reverses entirely.</b> Keeping it at 0.5% of
      low-emission generation while the rest of the group grows gives ${d(D.bioenergy.pinnedLow)}
      at your current settings — a swing of <b>${fmtN(Math.abs(Math.round(D.bioenergy.delta)))}
      deaths a year</b> from a decision about <i>which</i> clean source grows, not how much.
      That single choice moves this figure further than every other item on this list
      combined.</p>
      <p><span class="info-link" data-modal="sourceMixEditor" role="button" tabindex="0"
        >⚙ Choose which sources grow, and which are phased out</span></p>

      <h3>2. Which lever you pull — direct fuels carry ${fmtN(D.levers.weightRatio,1)}× the grid</h3>
      <p>Of ${DATA.country.name}'s energy-related fine particulates, <b>${fmtN(100*A.sDirect,1)}%</b>
      comes from fuel burned where it is used — vehicles, industry, cooking, heating — and only
      <b>${fmtN(100*A.sEnergy,1)}%</b> from generating electricity. Electrification therefore
      reaches far more of the problem than the generation mix does:</p>
      ${dataTable(["Slider","At its minimum","At its maximum"],[
        ["Electrification of final energy (10% to 100%)",
         sd(D.levers.elecLow), sd(D.levers.elecHigh)],
        ["Low-emission generation (50% to 100%)",
         sd(D.bioenergy.mixAt50), sd(D.bioenergy.mixAt100)]
      ])}

      <h3>3. How large the burden is to begin with</h3>
      <p>Every figure here rescales the World Health Organization's estimate of
      <b>${fmtN(a.whoDeaths,0)}</b> ambient-attributable deaths. That estimate is itself
      published as a range, <b>${fmtN(a.whoLow,0)}–${fmtN(a.whoHigh,0)}</b>, and the result
      moves with it in proportion: <b>${fmtN(Math.abs(Math.round(D.burden.low)))}</b> to
      <b>${fmtN(Math.abs(Math.round(D.burden.high)))}</b>. This uncertainty is inherited, not
      introduced here, and nothing on screen 2 can reduce it.</p>

      <h3>4. Where clean air is defined</h3>
      <p>Deaths are only attributed above a counterfactual concentration — the level below
      which no further benefit is counted. It is published as a range rather than a value,
      <b>${A.tmrelLow}–${A.tmrelHigh} µg/m³</b>, and taking each end gives
      <b>${fmtN(Math.abs(Math.round(Math.min(D.counterfactual.low,D.counterfactual.high))))}</b>
      to <b>${fmtN(Math.abs(Math.round(Math.max(D.counterfactual.low,D.counterfactual.high))))}</b>
      deaths. A <i>lower</i> counterfactual attributes more of the burden at every
      concentration, which makes a given reduction a smaller share of it.</p>
      <div class="paperrow"><span aria-hidden="true">📄</span> <span class="lbl2">Counterfactual and apportionment:</span>
        McDuffie et al. (2021), "Source sector and fuel contributions to ambient PM<sub>2.5</sub>
        and attributable mortality across multiple spatial scales", <i>Nature Communications</i> 12, 3594.
        <a class="paper" href="https://doi.org/10.1038/s41467-021-23853-y" target="_blank"
           rel="noopener noreferrer" title="Opens doi.org in a new tab">doi.org/10.1038/s41467-021-23853-y ↗</a></div>

      <h3>5. How many people breathe it, and how much energy they use</h3>
      <p>Deaths are a count of people, so the figure scales with the population exposed —
      <b>${fmtN(COUNTRY.populationAt(2050),1)} million</b> under <b>${COUNTRY.narrative()}</b>,
      <b>${COUNTRY.popFactor(2050).toFixed(2)}×</b> the 2021 population these estimates count.
      Energy demand scales with income at ${DATA.country.name}'s own measured elasticity of
      <b>${COL_DEMAND.elasticityTotal}</b>, itself a range of
      ${COL_DEMAND.ciLow}–${COL_DEMAND.ciHigh}. Both are set on earlier steps, and both move
      this number without any air-quality choice being made.</p>

      ${D.valid===false?`<h3>And at your current settings, a warning</h3>
      <p>The concentration change these choices imply is larger than ${DATA.country.name}'s
      entire measured concentration. The figures above are still computed, but the method
      behind them assumes particulate formation is proportional to emissions, which holds for
      moderate change and breaks for large change. Read them as a direction, not a
      magnitude.</p>`:""}`;
    },
    /* A FUNCTION, not a template literal. MODALS is built in the first script block,
       where DATA.country is still undefined - it is assigned in the second. An eager
       ${DATA.country.name} here throws while the object literal is being constructed,
       which kills the whole block and leaves MODALS unbound: every panel in the file
       stops opening. renderModal already calls a function note, same as a function
       body, so deferring costs nothing. */
    note:()=>`<b>Three of these five are not uncertainties you can act on.</b> The size of the
      burden, the counterfactual and the population path are inherited from the published
      evidence and the scenario — they set how precisely this can be known at all. The other
      two are choices, and the first of them is the one most easily missed: decarbonising the
      grid and cleaning the air are not the same instruction, and on ${DATA.country.name}'s
      observed generation split they can point in opposite directions.`
  },

  decomp:{
    title:"What these bars mean, and what a point is",
    lede:"The three bars split one number — the change in {country}'s energy-pollution index — into the three things driving it.",
    body:()=>{
      const h=COUNTRY.healthData(), e=h.energy, a=h.air;
      const d=COUNTRY.healthDecomposition(2050);
      const perPoint=a.whoDeaths*a.energyResponsiveShare*0.01;
      const net=d.net*100;
      /* The tile's own number, taken from the same call the tile makes, so this panel
         cannot state a second estimate of it. */
      const tileDeaths=COUNTRY.healthAt(2050).avoided;
      return `
      <h3>The index, and what one point is</h3>
      <p>Every figure on this screen rests on a single index of how polluting the energy system is.
      It is set to <b>1.00 for ${DATA.country.name}'s energy system as it stands today</b> —
      ${fmtN(e.currentElectrification,1)}% of final energy delivered as electricity, and
      ${fmtN(e.currentCleanShare,1)}% of that electricity from low-emission sources. Within it,
      <b>${fmtN(d.wD*100,1)}%</b> of the weight sits on fuels burned where they are used — vehicles,
      industry, cooking, heating — and <b>${fmtN(d.wP*100,1)}%</b> on generating electricity.
      ${COUNTRY.isColombia()?`Those two weights are ${DATA.country.name}'s own, derived sector by
      sector from the source apportionment — <b>${fmtN(100*COL_HEALTH.ambient.sDirect,1)}%</b> of
      energy-related fine particulates from fuel burned at the point of use against
      <b>${fmtN(100*COL_HEALTH.ambient.sEnergy,1)}%</b> from generation — not a round split.`:""}</p>
      <p><b>One point is one hundredth of that index.</b> Converting points to lives is
      ${COUNTRY.isColombia()?"<b>not</b> a fixed rate":"a fixed rate"} here.
      ${COUNTRY.isColombia()?`The index change passes through the concentration–response function,
      which is exponential in concentration, so a point is worth slightly more at one end of the
      range than the other. The conversion is therefore applied <b>once, to the total</b>, and the
      three bars share it in proportion.`:`Each point is worth
      ${fmtN(a.whoDeaths*a.energyResponsiveShare*0.01,0)} deaths a year.`}</p>
      <p>The three bars sum to the net index change exactly —
      <b>${signed(net,1)} points</b> — and that change converts to
      <b>${fmtN(Math.abs(tileDeaths),0)} deaths a year ${tileDeaths>=0?"avoided":"added"}</b>
      against the reference pathway. That is the number in the tile above, and it is the same
      calculation the tile runs, not a second estimate of it.</p>
      <h3>What each bar is</h3>
      <ul class="chain">
        <li><div class="ico">1</div><div><b>Direct fuels</b>
          <span>${fmtN(d.wD*100,1)}% × the change in fuel burned at the point of use. Electrifying moves energy off
          petrol, diesel, gas and wood, so this pollution stops being emitted in streets and buildings.
          Positive when your pathway burns less than the reference.</span></div></li>
        <li><div class="ico">2</div><div><b>Electricity mix</b>
          <span>${fmtN(d.wP*100,1)}% × your electricity × the fall in pollution per unit generated. Cleaning generation
          cuts the pollution attached to every kilowatt-hour. Positive when your mix is cleaner than the
          reference mix.</span></div></li>
        <li><div class="ico">3</div><div><b>Electricity demand</b>
          <span>${fmtN(d.wP*100,1)}% × the extra electricity your pathway needs × the reference pollution intensity.
          Electrifying raises power demand, and at the reference mix that additional electricity carries
          pollution of its own. It is plotted against the other two because it works against them.</span></div></li>
      </ul>
      <p>None of the three is fixed in sign. At low electrification with a dirty mix, direct fuels and
      the mix both turn negative while demand turns positive — the labels flip with them, which is why
      the label rather than the colour is what to read.</p>
      <h3>The reference these are measured against</h3>
      <p><b>Today's system, held still.</b> ${DATA.country.name}'s energy mix as measured now —
      <b>${fmtN(e.referenceElectrification2050,1)}%</b> of final energy delivered as electricity and
      <b>${fmtN(e.referenceCleanShare2050,1)}%</b> of that electricity from low-emission sources — carried
      to 2050 unchanged. Every bar is your choice minus that, so a bar of zero means "no different from
      today's mix", not "no effect".</p>
      <p>The baseline is <b>not frozen in size</b>. It grows with the population of the storyline you
      chose and with the income path, exactly as your own pathway does; what is held fixed is only the
      two things you control on step 2. That is what makes the difference between the two lines
      attributable to your choices rather than to Colombia getting larger.</p>
      <p><b>It is not a forecast.</b> Nobody projects that ${DATA.country.name} holds its ${COL_POWER.anchorYear}
      generation mix for twenty-five years. It is the "what if nothing changed" line, and it was chosen
      because both of its numbers are measured and checkable — the reference it replaced on 2026-09-02
      was built from six constants with no source behind them.</p>
      <h3>Why emissions and deaths move together</h3>
      <p>Burning fuel does two things at once. It releases <b>carbon dioxide</b>, which warms the
      planet over decades and everywhere at once. And it releases <b>fine particulates and nitrogen
      oxides</b>, which stay near where they were emitted and are breathed by the people living there.
      The same tailpipe, furnace and boiler produces both. That is the link:</p>
      <ul class="chain">
        <li><div class="ico">1</div><div><b>More combustion</b>
          <span>Fuel burned in vehicles, industry, homes and power stations — the same activity that
          drives a country's carbon dioxide emissions.</span></div></li>
        <li><div class="ico">2</div><div><b>Worse air quality</b>
          <span>That combustion emits fine particulates (PM<sub>2.5</sub>) and nitrogen oxides
          alongside the carbon dioxide. Unlike carbon dioxide these do not disperse globally; they
          raise pollutant concentrations in the air people are breathing nearby.</span></div></li>
        <li><div class="ico">3</div><div><b>Disease</b>
          <span>Sustained exposure to fine particulates raises the incidence of heart disease, stroke,
          chronic lung disease, respiratory infection and lung cancer. Particles small enough to reach
          the bloodstream drive inflammation and arterial damage, which is why the burden is mostly
          <i>cardiovascular</i> rather than respiratory.</span></div></li>
        <li><div class="ico">4</div><div><b>Deaths</b>
          <span>For ${DATA.country.name} the World Health Organization attributes
          <b>${fmtN(a.whoDeaths)} deaths in 2021</b> to ambient air pollution
          (uncertainty interval ${fmtN(a.whoLow)}–${fmtN(a.whoHigh)}). Of that total,
          <b>10,653 are ischaemic heart disease</b> and 1,896 are stroke — about four fifths
          cardiovascular. Respiratory infection (1,591), chronic obstructive pulmonary disease (1,338)
          and lung cancer (264) make up the rest.</span></div></li>
      </ul>
      <p>So a pathway that burns less fuel, or burns it further from where people live and more
      cleanly, cuts carbon dioxide and saves lives through the same action. This is usually the
      strongest argument a climate policy has locally: the warming avoided is shared with the world
      and arrives in decades, while the avoided deaths are entirely domestic and begin at once.</p>
      <p class="cap" style="font-size:13.5px">Globally the World Health Organization attributes
      <b>4.2 million premature deaths a year</b> to ambient air pollution (2019), rising to
      <b>6.7 million</b> once household air pollution is counted alongside it. It reports the same
      cardiovascular dominance: <b>68% ischaemic heart disease and stroke</b>, 14% chronic obstructive
      pulmonary disease, 14% acute lower respiratory infection, 4% lung cancers — and notes that
      "the latest burden estimates reflect the significant role air pollution plays in cardiovascular
      illness and death". ${DATA.country.name}'s split above is more cardiovascular still, at about four
      fifths. In 2019, <b>99% of the world's population</b> lived where WHO's air quality guideline levels
      were not met, and <b>89%</b> of the premature deaths fell in low- and middle-income countries.</p>
      <div class="paperrow"><span aria-hidden="true">📄</span> <span class="lbl2">Pollutants, disease mix and global burden:</span>
        World Health Organization (2024), <i>Ambient (outdoor) air quality and health</i>, sections
        "Key facts", "Overview" and "Pollutants". The page names the combustion sources directly —
        nitrogen dioxide "commonly released from the combustion of fuels in the transportation and
        industrial sectors", sulphur dioxide "from the burning of fossil fuels (coal and oil)", carbon
        monoxide from "incomplete combustion of carbonaceous fuels such as wood, petrol, charcoal,
        natural gas and kerosene".
        <a class="paper" href="https://www.who.int/news-room/fact-sheets/detail/ambient-(outdoor)-air-quality-and-health"
           target="_blank" rel="noopener noreferrer">who.int ↗</a></div>
      <div class="paperrow"><span aria-hidden="true">🗄️</span> <span class="lbl2">The ${DATA.country.name} figure and its cause split:</span>
        WHO Global Health Observatory, indicator AIR_41, ambient air pollution attributable deaths by
        cause, 2021. Retrieved 2026-08-24 — see the data README in this repository. The fact sheet
        carries no country figures; these come from the indicator, not from it.</div>
      <div class="note"><span aria-hidden="true">⚠</span><span><b>One step in the chain above is not from
        that source.</b> The fact sheet names the pollutants and the combustion that produces them, and it
        reports the disease mix — but it does not develop the point that the same combustion emits carbon
        dioxide. That connection is this thesis's framing of two separately documented facts, not a claim
        lifted from WHO. The exposure–response relationships underlying the attribution are also not cited
        in the fact sheet itself; WHO's air quality guidelines are the deeper source for those.</span></div>
      <h3>What this tool does NOT do with that link</h3>
      <p>The chain above is real. <b>This prototype does not compute it.</b> Step 4's carbon-dioxide
      path is set by the mitigation-target slider alone; electrification and generation mix — the two
      controls driving everything on this screen — do not enter that calculation at all. Move them and
      the deaths here change while step 4 does not.</p>
      <p>So the two halves of the argument are shown side by side but calculated separately, and a
      carbon figure should not be inferred from these bars, nor a death figure from step 4. Joining
      them means driving the emissions path from the energy system rather than from a target slider —
      a data-engine change, not a presentational one.</p>`;
    },
    note:`<b>The split is arithmetic, not a measurement.</b> Dividing one index change into three named
      causes is a decomposition this prototype performs; the underlying response of health to energy is a
      prototype assumption, not a {country} epidemiological study. See "How these health figures are worked
      out" for that chain and its limits.`
  },

  health:{
    title:"How these health figures are worked out",
    lede:"Electrification changes which fuels {country} uses; the electricity mix changes the pollution associated with the additional power demand. This prototype keeps those effects separate.",
    /* A function since 2026-10-17, so steps 3 and 4 print the live response share and
       value per statistical life. As static text they still said 35% and US$3.0m, both
       retired on 2026-09-01 (see COL_HEALTH). */
    body:()=>{
      const h=COUNTRY.healthData(), a=h.air, v=h.valuation, col=COUNTRY.isColombia();
      const A=COL_HEALTH.ambient, V=COL_HEALTH.valuation, m=x=>fmtN(x/1e6,2);
      return `
      <ul class="chain">
        <li><div class="ico">1</div><div><b>Start from {country}'s energy profile</b>
          <span>The profile supplies final-energy demand, the share served by electricity and the
          low-emission share of electricity generation as three separate inputs.</span></div></li>
        <li><div class="ico">2</div><div><b>Separate electrification from electricity generation</b>
          <span>More electrification displaces fuels used directly in transport, buildings and industry,
          but it also increases electricity demand. The generation-mix control determines how polluting
          that additional electricity is.</span></div></li>
        <li><div class="ico">3</div><div><b>Translate the energy change into a health response</b>
          ${col?`<span><b>${fmtN(100*a.energyResponsiveShare,1)}%</b> of {country}'s ambient PM₂.₅ comes from the
          sources the two controls move: ${fmtN(100*A.sEnergy,1)}% from electricity generation and
          ${fmtN(100*A.sDirect,1)}% from fuel burned where it is used (McDuffie et al. 2021, base year
          ${A.concYear}). The energy figure also covers heat production, fuel transformation and flaring,
          so it is an upper bound for what the generation mix touches. Industrial non-coal sources

          9.1 percentage points. Only the included part
          of the concentration changes, and the ambient-air-pollution health-burden anchor is rescaled
          through a log-linear concentration–response using the relative risk TRA420 uses; "How these figures are worked out,

          The estimate represents modelled attribution, not a count of death certificates.</span>`
          :`<span>The reference and selected pathways are compared using an illustrative pollution index.

          million in 2015 dollars from a US base of US$9.631 million at an income elasticity of 1.0,
          uprated with the US consumer price index. <b>The basis is not settled.</b> OECD (2025, Table 6.1,
          p. 105) gives group starting values of US$1.1 million for low- and middle-income countries

          purchasing-power-parity dollars; uprated the same way they are US$${m(V.vslLow)} million and
          US$${m(V.vslHigh)} million. Colombia has been an OECD member since 2020, so which group applies is

          default is to scale the group value to the country's GDP per head, which this prototype has not
          done. The bases also differ: the transfer uses exchange-rate-based income (World Bank Atlas GNI
          per head), the OECD values are purchasing-power-parity dollars, and price uprating does not
          reconcile the two. It is shown so stakeholders can assess whether monetised health benefits
          belong in the interface.</span>`
          :`<span>The prototype applies <b>US$${m(v.vsl)} million per statistical life</b> in ${v.priceYear} prices:
          Colombia's US$${m(V.vsl)} million scaled by this country profile's rounded design factor
          (×${fmtN(v.vsl/V.vsl,2)}), not a valuation for {country}. It is shown so stakeholders can assess
          whether monetised health benefits belong in the interface.</span>`}</div></li>
      </ul>
      ${col?`<div class="paperrow"><span aria-hidden="true">📄</span> <span class="lbl2">On the OECD group values:</span>
        OECD (2025), "Mortality Risk Valuation in Policy Assessment: A Global Meta-Analysis of Value of
        Statistical Life Studies", Table 6.1, p. 105, and section 6.3.1.
        <a class="paper" href="https://doi.org/10.1787/76ca89a2-en" target="_blank"
           rel="noopener noreferrer" title="Opens doi.org in a new tab">doi.org/10.1787/76ca89a2-en ↗</a></div>`:""}
      <h3>The number people argue about</h3>
      <p>A value of a statistical life is not the price of a person and is not a medical-cost estimate. It
      represents how policy analysis aggregates many small changes in mortality risk. The displayed dollar

    },

  method:{
    title:"Methodology",
    lede:"The detail behind the cost figure, for anyone who wants to check it.",
    body:`
      <h3>How the cost of carbon is worked out</h3>
      <p>One extra tonne of CO&#8322; is added in a given year, the climate model is run again, and the
      difference in damage over the following centuries is added up. That total is the social cost of
      carbon for that year. It is calculated separately for every year rather than estimated once.</p>
      <div class="paperrow"><span aria-hidden="true">🎬</span> <span class="lbl2">Video explainer:</span>
        Burkhardt, "Video 6: Climate Change and Integrated Assessment Models 1" (YouTube).
        The link opens partway in, at 16:05.
        <a class="paper" href="https://youtu.be/8ewc-zhC00g?t=965" target="_blank"
           rel="noopener noreferrer" title="Opens YouTube in a new tab">youtu.be/8ewc-zhC00g?t=965 ↗</a></div>
      <h3>Settings used</h3>
      <p>Base year 2025 · pulse size 1 tonne CO&#8322; · damages accumulated over 450 years ·
      discounting by the Ramsey rule with a pure time-preference rate of 0.5% and an elasticity of 1.</p>
      <h3>What those settings produce</h3>
      <p>In PPP US dollars of 2025 per tonne of CO&#8322;, discounted to the emission year:</p>
      <table class="dt"><thead><tr><th>Pathway</th><th>2025</th><th>2030</th><th>2050</th></tr></thead>
        <tbody>
          <tr><td>SSP1-2.6</td><td class="n">429</td><td class="n">454</td><td class="n">562</td></tr>
          <tr><td>SSP2-4.5</td><td class="n">718</td><td class="n">776</td><td class="n">1,021</td></tr>
          <tr><td>SSP3-7.0</td><td class="n">1,056</td><td class="n">1,117</td><td class="n">1,336</td></tr>
          <tr><td>SSP5-8.5</td><td class="n">751</td><td class="n">834</td><td class="n">1,227</td></tr>
        </tbody></table>
      <p>Two things in that table are worth a second look. These values are <b>high</b> against the range
      most often quoted in policy — the damage curve used here is far steeper than the classic quadratic
      one, and 0.5% is a low pure time-preference rate; both push the figure up, and both are stated
      choices rather than accidents. And <b>SSP5-8.5 comes out lower than SSP3-7.0</b> despite being the
      hotter world. That is the discounting: SSP5 is also the much richer world, so under the Ramsey rule
      its future damages are discounted harder. It is a real property of the method, not an error.</p>
      <h3>Why discounting matters</h3>
      <p>Damage far in the future has to be compared with money today. The rate chosen for that comparison
      changes the answer more than almost any other assumption. The values above follow the average view
      among economists surveyed by Nesje and colleagues (2023); a different defensible choice would give a
      different cost.</p>
      <div class="paperrow"><span aria-hidden="true">🎬</span> <span class="lbl2">Video explainer:</span>
        Environmental Economics, "Explaining Ramsey bonus to clip 10" (YouTube).
        <a class="paper" href="https://youtu.be/93WKJ4Utr6k" target="_blank"
           rel="noopener noreferrer" title="Opens YouTube in a new tab">youtu.be/93WKJ4Utr6k ↗</a></div>
      <h3>Sources for the main assumptions</h3>
      <p>Both open at the publisher via their DOI, in a new tab.</p>
      <div class="paperrow"><span aria-hidden="true">📄</span> <span class="lbl2">Economic projection:</span>
        Rickels, Meier &amp; Quaas (2023),
        "The historical social cost of fossil and industrial CO&#8322; emissions",
        <i>Nature Climate Change</i> 13(7), 742–747.
            <a class="paper" href="https://doi.org/10.1038/s41558-023-01709-1" target="_blank"
               rel="noopener noreferrer" title="Opens doi.org in a new tab">doi.org/10.1038/s41558-023-01709-1 ↗</a></div>
      <div class="paperrow"><span aria-hidden="true">📄</span> <span class="lbl2">Discounting parameters:</span>
        Nesje, Drupp, Freeman &amp; Groom (2023),
        "Philosophers and economists agree on climate policy paths but for different reasons",
        <i>Nature Climate Change</i> 13(6), 515–522.
            <a class="paper" href="https://doi.org/10.1038/s41558-023-01681-w" target="_blank"
               rel="noopener noreferrer" title="Opens doi.org in a new tab">doi.org/10.1038/s41558-023-01681-w ↗</a></div>`,
    note:`<b>The two 🎬 links explain, the 📄 links evidence.</b> The videos teach the idea behind a step
      and are not peer-reviewed; nothing here is calculated from them. The numbers come from the papers
      and from the settings listed above.`
  },

/* ---- Real boundary geometry ----

<script>
/* ==========================================================================
   Rendering. You normally don't need to edit below this line.
   ========================================================================== */
const $ = s => document.querySelector(s);
DATA.country = DATA.countries.find(c=>c.iso==="COL") || DATA.countries[0]; // Colombia default
const selectCountry = iso => { DATA.country = DATA.countries.find(c=>c.iso===iso) || DATA.country; };
const state = { step:1, ssp:DATA.ssp.selected, drivers:{}, q:"" };
DATA.drivers.items.forEach(d => state.drivers[d.id] = d.value);

/* ==========================================================================
   NGA — turns NGA_DATA plus the step-1 and step-3 choices into the numbers
   steps 4, 5 and 6 display. Everything here is arithmetic on values that were
   already computed; no new modelling happens in the browser.
   ========================================================================== */
const NGA = {
  D:NGA_DATA,
  /* NGA_DATA is retained for the verified IAM SCC values and common pathway
     labels. Screens 5 and 6 use COL_HEALTH and COL_CLIMATE respectively. */
  isCountry(){ return DATA.country.iso === "NG"; },
  pathway(){ return NGA_DATA.sspPathway[state.ssp]; },
  label(){ return NGA_DATA.pathwayLabel[this.pathway()] || state.ssp; },
  baseline(){ const p=this.pathway(); return p ? NGA_DATA.emissions[p] : null; },

  /* Linear interpolation on the decadal grid, so the integrals below match the
     line the chart actually draws. */
  interp(y, xs, ys){
    if(y<=xs[0]) return ys[0];
    if(y>=xs[xs.length-1]) return ys[ys.length-1];
    for(let i=0;i<xs.length-1;i++)
      if(y<=xs[i+1]) return ys[i] + (ys[i+1]-ys[i])*(y-xs[i])/(xs[i+1]-xs[i]);
    return ys[ys.length-1];
  },
  baselineAt(y){ const b=this.baseline(); return b ? this.interp(y, NGA_DATA.emissions.years, b.mt) : null; },

  /* Where the chosen SSP baseline sits on the step-3 mitigation slider's own
     scale: 2050 emissions as a percentage change from Nigeria's 2005 level. */
  /* RETIRED 2026-09-01: this needed Nigeria's observed 2005 emissions, which are
     no longer in this file. Nothing calls it — the screens use
     COUNTRY.mitigationReference(). Kept as a stub rather than deleted so the
     object's shape is unchanged, and returning 0 rather than reading a missing
     field means a revived caller fails visibly instead of silently producing NaN. */
  mitigationReference(){ return 0; },

  /* RETIRED 2026-09-01, same reason as mitigationReference() above: it anchored the
     slider target on Nigeria's observed 2005 emissions. The live implementation is
     COUNTRY.pathAt(), which carries the same interface arithmetic — follow the
     baseline to 2025, run linearly to the 2050 target, then hold that level to
     2100 — against this country's own anchor. */
  pathAt(){ return null; },
  userPath(){
    const b=this.baseline(); if(!b) return null;
    return NGA_DATA.emissions.years.map(y=>Math.round(this.pathAt(y)));
  },

  /* Cumulative difference over 2025-2100, integrated on an ANNUAL grid.
     The previous decadal trapezoid dropped the whole 2020-2030 interval on the
     `year < 2025` test and so omitted the 2025-2030 portion entirely — about
     120 Mt under the default settings. Fixed 2026-08-07. */
  cumulativeAvoided(){
    if(!this.baseline()) return null;
    let mt=0;
    for(let y=2025;y<2100;y++)
      mt += ((this.baselineAt(y)-this.pathAt(y)) + (this.baselineAt(y+1)-this.pathAt(y+1)))/2;
    return Math.round(mt);
  },

  sccNow(){ const p=this.pathway(); return p ? NGA_DATA.scc[p][2025] : null; },
  scc2050(){ const p=this.pathway(); return p ? NGA_DATA.scc[p][2050] : null; },

  /* Present value in 2025 of a tonne emitted in year y: SCC(y) x beta(y).
     Both are IAM outputs, exact at 2025, 2030 and 2050; linear between. */
  pvPerTonne(y){
    const p=this.pathway(); if(!p) return null;
    const xs=Object.keys(NGA_DATA.scc[p]).map(Number).sort((a,b)=>a-b);
    const m=xs.map(k=>NGA_DATA.scc[p][k]*NGA_DATA.beta[p][k]);
    return this.interp(y, xs, m);
  },
  /* Avoided damage over 2025-2100 — the same window as the cumulative emissions
     figure beside it. Each avoided tonne is valued at the Social Cost of Carbon
     for the year it would have been emitted, then discounted back to 2025. The
     model was pulsed across the whole grid, so no year is extrapolated. */
  avoidedDamageBn(){
    if(!this.baseline()) return null;
    let usd=0;
    for(let y=2025;y<2100;y++){
      const d0=(this.baselineAt(y)-this.pathAt(y))*1e6*this.pvPerTonne(y);
      const d1=(this.baselineAt(y+1)-this.pathAt(y+1))*1e6*this.pvPerTonne(y+1);
      usd += (d0+d1)/2;
    }
    return usd/1e9;
  },

  /* --- household air pollution, legacy IAM indoor formula ---------------- */
  deaths(e){ const h=NGA_DATA.health;
    return h.D0 * (1 - Math.min(Math.max(e,0),1)) / (1 - h.e0); },
  refAccess(year){ const h=NGA_DATA.health;
    return Math.min(h.e2024 + h.trendPP*(year-2024), 1); },
  policyAccess(year){ const h=NGA_DATA.health, tgt=state.drivers.elec/100;
    if(year<=2024) return h.e2024;
    return Math.min(h.e2024 + ((tgt-h.e2024)/26)*(year-2024), 1); },
  healthAt(year){
    const ref=this.deaths(this.refAccess(year)), pol=this.deaths(this.policyAccess(year));
    return {refDeaths:ref, polDeaths:pol, avoided:ref-pol,
            valueBn:((ref-pol)*NGA_DATA.health.vsl)/1e9,
            refAccess:this.refAccess(year), polAccess:this.policyAccess(year)};
  },

  local(){ const p=this.pathway(); return p ? NGA_DATA.localClimate[p] : null; }
};

/* Shared country calculation route. Colombia reads its precomputed SSP pressure
   ensemble median. Other countries index each RCMIP pathway change to their
   2024 profile anchor. The RCMIP arrays are rounded for display, so divide by
   the source's OWN 2024 point before scaling; otherwise the first baseline
   point misses the selected country's anchor. */
const COUNTRY = {
  profile(){ return COUNTRY_PROFILES[DATA.country.iso] || COUNTRY_PROFILES.COL; },
  isColombia(){ return DATA.country.iso === "COL"; },
  pathway(){ return NGA_DATA.sspPathway[state.ssp]; },
  label(){ return NGA_DATA.pathwayLabel[this.pathway()] || state.ssp; },
  hasColombiaSspBaseline(){ return this.isColombia() && COL_DATA.colombiaEmissions!==null; },
  baselineFor(p){
    const data=this.hasColombiaSspBaseline() ? COL_DATA.colombiaEmissions : COL_DATA.emissions;
    const source=p&&data[p]; if(!source) return null;
    if(this.hasColombiaSspBaseline()) return {years:data.years,mt:source.mt};
    const anchor=this.isColombia() ? COL_DATA.observed[2024] : this.profile().em2024;
    return {years:data.years,mt:source.mt.map(v=>v/source.mt[0]*anchor)};
  },
  baseline(){ return this.baselineFor(this.pathway()); },
  interp(y,xs,ys){ return NGA.interp(y,xs,ys); },
  baselineAt(y){ const b=this.baseline(); return b ? this.interp(y,b.years,b.mt) : null; },
  mitigationAnchor(){ return this.isColombia()?COL_DATA.observed[2024]:this.profile().em2024; },
  mitigationReference(){ return 0; },
  pathAt(y){
    const b=this.baseline(); if(!b) return null;
    if(y<=2025) return this.baselineAt(y);
    /* Africa's policy method: follow the scenario through 2025, hit the
       slider's 2050 target at a constant proportional rate, then continue
       that rate to 2100. The slider is relative to the 2024 national observation
       or illustrative country-profile level. A zero target uses
       Africa's 0.01 Mt floor so the logarithm is defined; it approaches zero
       but is not mathematically zero in 2050. */
    const start=this.baselineAt(2025);
    const target=Math.max(0,this.mitigationAnchor()*(1+state.drivers.mitigation/100));
    const floor=0.01, s0=Math.max(start,floor), t0=Math.max(target,floor);
    const rate=Math.log(t0/s0)/25;
    return Math.max(0,s0*Math.exp(rate*(y-2025)));

  plotYears(){

  userPath(){ return this.baseline() ? this.plotYears().map(y=>this.pathAt(y)) : null; },

  sccPath(){ return COL_DATA.sccProxy[this.pathway()]; },
  usesSccProxy(){ return this.pathway()==="ssp119"; },

    const values=xs.map(k=>NGA_DATA.scc[p][k]*NGA_DATA.beta[p][k]);

  healthData(){

           counterfactual for any of the twelve South American countries, not a

           WHAT THE BASELINE NOW IS: p.elec and p.clean, this country's own observed

           IT STILL MOVES, through population and income. Both trajectories share the

  energyShareAt(year,target){
    const e=this.healthData().energy;
    if(year<=2025) return e.currentElectrification/100;
    return (e.currentElectrification+(target-e.currentElectrification)*(Math.min(year,2050)-2025)/25)/100;
  },
  cleanShareAt(year,target){
    const e=this.healthData().energy;

  /* --- power sector. COLOMBIA ONLY: every caller must check isColombia() first.

  /* --- layer 2 ---------------------------------------------------------------

     left in the proportions they hold today, so "leave the others alone" means

  /* usePins=false gives the untouched mix, which is what the REFERENCE pathway on

  resolveGroupFor(g,usePins){
    const cur=COL_POWER.within[g], pins=(usePins&&state.sourceMix&&state.sourceMix[g])||{};
    const names=COL_POWER.groups[g];
    const pinned=names.filter(n=>pins[n]!=null), free=names.filter(n=>pins[n]==null);
    let sum=pinned.reduce((a,n)=>a+pins[n],0);

  withinAt(year,g){ return this.withinAtFor(year,g,true); },
  withinAtFor(year,g,usePins){
    const a=COL_POWER.anchorYear, cur=COL_POWER.within[g], tgt=this.resolveGroupFor(g,usePins);

  /* Share of TOTAL generation, per source: layer 1 times layer 2. */
  sourceShareAt(year){ return this.sourceShareAtFor(year,state.drivers.mix,true); },
  sourceShareAtFor(year,tgtPct,usePins){
    const L=this.gridMixAtFor(year,tgtPct),

  /* Grams of a pollutant per kWh generated, for one source. */
  /* g per kWh = g/GJ x (GJ of fuel per kWh). One kWh is 3.6 MJ = 0.0036 GJ, divided

  pollutantIntensity(year,pol,tgtPct,usePins){

  pollutantIntensityAnchor(pol){ const P=COL_POWER; let v=0;

  layer2Active(){ return ["low","fossil"].some(g=>

  /* Screen-4 power-policy shares reach the 2050 target in log odds and

  powerSigmoid(z){ return 1/(1+Math.exp(-z)); },
  powerSharePath(year,anchor,targetPct){
    if(year<=COL_POWER.anchorYear) return anchor;
    const z0=this.powerLogit(anchor), z1=this.powerLogit(targetPct/100);
    return this.powerSigmoid(z0+(z1-z0)*(year-COL_POWER.anchorYear)/(2050-COL_POWER.anchorYear)); },
  gridMixAt(year){ return this.gridMixAtFor(year,state.drivers.mix); },
  gridMixAtFor(year,tgtPct){ const a=COL_POWER.anchorYear, m0=COL_POWER.mix2024,

    if(year<=a) return m0;
    if(year>=2050) return tgt;
    return m0 + ((tgt-m0)/(2050-a))*(year-a); },
  finalEnergyTJAt(year){ return this.healthData().energy.finalTJ*this.energyScaleAt(year); },
  electricityFinalTJAt(year){
    return this.finalEnergyTJAt(year)*this.energyShareAt(year,state.drivers.elec); },
  /* Screen-4 policy volume: Burke & Csereklyei's Table 5 ten-year response,
     national SSP population, the GDP slider's annual total-GDP rate, and a
     UPME final-electricity-share index. The paired regional residual is the
     same one used in the independent SSP baseline. The volume is indexed to Ember gross

     primary-energy transfer, not a Colombian final-energy estimate. The slider

  powerRegionalResidualAt(year){
    const baseline=COL_DATA.colombiaEmissions[this.pathway()];
    return this.interp(year,COL_DATA.colombiaEmissions.years,baseline.r5EfficiencyResidualFactor); },
  powerDemandFactorAt(year){
    const n=Math.max(0,year-COL_POWER.anchorYear);
    const pop=this.populationAt(year)/this.populationAt(COL_POWER.anchorYear);
    const income=Math.pow(1+state.drivers.gdp/100,n)/pop;
    const L=Math.log(income);
    return pop*Math.exp(0.48*L+0.065*L*L)*this.powerRegionalResidualAt(year); },
  powerElectrificationAt(year){

  generationGWhAt(year){

  powerNow(year){ return year<=COL_POWER.anchorYear ? COL_DATA.colombiaPower.anchorMt :

  powerBaseline(){ return COL_DATA.colombiaPower[this.pathway()]; },
  powerBaselineAt(year){

  /* --- ENERGY DEMAND. Rebuilt 2026-09-02 on Colombia's own sourced elasticity.
     COLOMBIA:      index = (Pop_t/Pop_0) x (y_t/y_0)^B,  y = income per head
     EVERY OTHER:   index = (1 + (g - efficiencyGrowth))^n   [unchanged]
     See COL_DEMAND.

     THE SLIDER IS TOTAL GROSS DOMESTIC PRODUCT GROWTH, not per-head growth, so the
     population path is DIVIDED OUT to get income per head and then multiplied back
     in as the number of people. Those are two different jobs: more people use more
     energy one-for-one, while richer people use more at the elasticity. That is why
     the population term appears twice and does not cancel.

     STILL CLAMPED AT 2050, deliberately. Demand is held flat after 2050 exactly as
     the previous form did, so nothing downstream of this - including the social cost
     of carbon integral, which runs to 2100 - changes its horizon behaviour because
     of an elasticity substitution.

     GUARDED FOR COLOMBIA. COL_POP and COL_DEMAND are Colombian; populationAt()
     interpolates COL_POP unconditionally, so without this branch every other country
     would silently inherit Colombia's demography and Colombia's elasticity.

     [GAP: finalTJ is a UPME 2023 observation but is treated as the 2025 level, here
     and in energyShareAt(). That two-year mismatch PRE-DATES this change and is left
     alone rather than folded into it - fixing it moves every figure on screens 4 and
     5 for a reason that has nothing to do with the elasticity.] */
  energyScaleAt(year,gdp=state.drivers.gdp){
    const yr=Math.max(2025,Math.min(year,2050)), n=yr-2025;
    if(!this.isColombia()){
      const net=(gdp-this.healthData().energy.efficiencyGrowth)/100;
      return Math.pow(1+net,n);
    }
    const popRatio=this.populationAt(yr)/this.populationAt(COL_DEMAND.baseYear);
    const income=Math.pow(1+gdp/100,n)/popRatio;

  /* The same index at the two ends of the elasticity's 95% interval. This is a
     SOURCED PARAMETER RANGE, not a confidence interval on the projection, and the
     panel says so in those words. Null for every other country. */

    if(!this.isColombia()) return null;
    const yr=Math.max(2025,Math.min(year,2050)), n=yr-2025;
    const popRatio=this.populationAt(yr)/this.populationAt(COL_DEMAND.baseYear);
    const income=Math.pow(1+gdp/100,n)/popRatio;
    return {low:popRatio*Math.pow(income,COL_DEMAND.ciLow),
            mid:popRatio*Math.pow(income,COL_DEMAND.elasticityTotal),
            high:popRatio*Math.pow(income,COL_DEMAND.ciHigh),

  /* usePins says whether this is the user's own pathway (true) or the reference it

    const e=this.healthData().energy, e0=e.currentElectrification/100, c0=e.currentCleanShare/100;
    const es=this.energyShareAt(year,electrificationTarget), cs=this.cleanShareAt(year,cleanTarget);
    const total=this.energyScaleAt(year);
    const direct=total*(1-es)/(1-e0);
    const electricity=total*es/e0;
    /* COLOMBIA: fine-particulate intensity of generation relative to the anchor year,
       built from the same per-source shares step 4 uses, so the two screens now
       answer to one mix. NOTE this re-anchors the electricity term on Ember's 2024
       observed share rather than the 76.4% clean share of UPME 2023 that the old
       proxy started from, so Colombian health figures move.
       EVERY OTHER COUNTRY keeps the original proxy unchanged — it has no pollutant
       factors of its own and must not borrow Colombia's. */
    /* CLAMP REMOVED 2026-09-01, when the reformulation it stood in for was done.
       Colombia's value now flows into ambientResponse's exponential form, which is
       bounded by the arithmetic rather than by a guard. It is left unclamped here so
       the ratio reaching that form is the true one. */
    const intensity = this.isColombia()
      ? this.pollutantIntensity(year,"PM25",cleanTarget,!!usePins)
          / this.pollutantIntensityAnchor("PM25")

       combustion 11.4, road transport 9.1, industrial coal 7.9, commercial and other

       Power is therefore 4.6/33.8 = 13.6% of the response, NOT the 35% this model used
       until today. That old split told the reader cleaning the grid was Colombia's main
       health lever; it is roughly one part in seven, and household fuel is more than
       twice the whole power sector.

       calcination, which electrification cannot displace, and the source publishes no

    const wPower = this.isColombia() ? 0.136 : 0.35, wDirect = 1 - wPower;

     behavior, not on whether the electricity comes from a grid. An on-site

  gdpAt(year){ return this.interp(year, COL_GDP.years, COL_GDP[this.narrative()]); },

  populationAt(year){ return this.interp(year, COL_POP.years, COL_POP[this.narrative()]); },

  popFactor(year){
    if(!this.isColombia()) return 1;

  /* --- HOUSEHOLD PATHWAY, REBUILT 2026-09-02 on Per's instruction ------------------

  /* Residential firewood energy, indexed to 1 in the base year. This is what the
