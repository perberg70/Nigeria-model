             >ⓘ What moves this number, ranked</span></span></div>`;})():""}
       <p class="cap" style="margin-top:10px">The ${DATA.country.name} profile starts at <b>${fmtN(health.air.whoDeaths)} ambient air-pollution-attributable deaths</b> in 2021 (${fmtN(health.air.whoLow)}–${fmtN(health.air.whoHigh)}), with population-weighted PM₂.₅ exposure of <b>${fmtN(health.air.pm25,1)} µg/m³</b>.</p>
       ${dataTable(["Year","Electrification, yours","Low-emission generation, yours","Deaths, reference","Deaths, yours","Reference minus yours"],
         rows.map(r=>[r.year,fmtN(r.policy.es*100,1)+"%",fmtN(r.policy.cs*100,1)+"%",fmtN(Math.round(r.refDeaths)),fmtN(Math.round(r.policyDeaths)),fmtN(Math.round(r.avoided))]))}</div>
     <div class="actions">${backBtn(5)}<button class="btn" data-go="6">Next: Local climate impacts &nbsp;→</button></div></div>`;
  },

  /* SCREEN 6 REWRITTEN 2026-08-24 onto CCKP. Every figure here is now that
     country's own CCKP value with its model range; nothing is scaled from

  local(){ const d=DATA.local, L=COUNTRY.climate();
    if(!L) return head(6,d.title,`<p class="sub">${T(d.sub)}</p>`)+
      `<div class="body"><div class="panel"><h3 style="margin-top:0">No climate figures for ${DATA.country.name}</h3>
       <p class="cap" style="font-size:14.5px">This pathway has no CCKP entry for this country.</p></div></div>`;
    const R=COUNTRY.regionClimate();
    const regions=COUNTRY.regions();
    const hottest=R?[...R].sort((a,b)=>b.temp-a.temp):null;

    return head(6,d.title,`<p class="sub">${T(d.sub)} Pathway: <b>${COUNTRY.label()}</b>.</p>`)+
    `<div class="body">${tiles([
       {lbl:"National temperature", sub:`${DATA.country.name}, CCKP ensemble median`,
        val:signed(L.temp,1)+"°C", unit:"2080–2099 against 1995–2014",
        tip:`10th–90th percentile across climate models: ${signed(L.tempP10,2)}°C to ${signed(L.tempP90,2)}°C. Median ${signed(L.temp,2)}°C.`},
       {lbl:"National rainfall", sub:`${DATA.country.name}, CCKP ensemble median`,
        val:signed(L.rain,0)+" mm", unit:"per year, 2080–2099 against 1995–2014",
        tip:(rainfallAgreement()||{}).tile||""},
       R ? {lbl:"Strongest warming region", sub:COUNTRY.pathway()!=="ssp119"?"median across climate models":REGION_IDENTITY.has(DATA.country.iso)?"CCKP ensemble median for the unit":"median of its units' ensemble medians",
            val:hottest[0].name, unit:`${signed(hottest[0].temp,2)}°C, against ${signed(hottest[hottest.length-1].temp,2)}°C in ${hottest[hottest.length-1].name}`}
         : {lbl:"Regional breakdown", sub:"not available for this country", cls:"nodata",
            val:"—", unit:"Colombia only — see the panel below"}
     ])}
     <div class="help-row"><span class="info-link" data-modal="ref_regional" role="button" tabindex="0"
       >ⓘ Where these figures come from</span>${uncCue()}</div>
     <div class="note"><span>◆</span><span><b>One climate product, one uncertainty convention.</b>
       National tiles and regional maps both show the 10th–90th percentile across climate models, from the
       World Bank CCKP CMIP6 ensemble at 0.25°. ${COUNTRY.pathway()==="ssp119"?"<b>For SSP1-1.9 the regional model range is unavailable</b>, because CCKP publishes no individual model runs for that pathway — the regional values below are medians of their units' ensemble medians, shown without a range.":"Regional ranges are computed across the individual model runs CCKP publishes."}
       ${(()=>{const g=regionsWithAgreedRainfall();

       ${DATA.country.iso==="COL"?"Departments are grouped into five natural regions. Colour shows the region estimate, not a department estimate; select a region for department data."
         :REGION_IDENTITY.has(DATA.country.iso)?"Each map territory is schematic; this country's official regions are its administrative units."
         :`The ${R?R.length:0} map territories are schematic shapes, not administrative boundaries.`}</span></div>
     ${R?`<div class="maprow">${regionalClimatePanel("temp",regions)}${regionalClimatePanel("rain",regions)}</div>
     <div class="panel"><h3 style="margin-top:0">${REGION_SCHEME_NAME[DATA.country.iso]} — selected pathway</h3>

/* Shared navigation and export pattern from the Africa prototype. Export the
   current Colombia views, so no parallel calculation or Nigeria assumption is introduced. */
function backBtn(n){
  const previous=DATA.steps[n-2];
  return `<button class="btn back" data-go="${previous.n}">← &nbsp;Back: ${T(previous.nav)}</button>`;
}
function exportText(node){
  return (node?.textContent||"").replace(/\s+/g," ").trim();
}
function exportSections(){
  return ["climate","air","local"].map(key=>{
    const node=document.createElement("div"); node.innerHTML=VIEWS[key]();
    return {key,title:exportText(node.querySelector("h1")),node};
  });
}
function outcomeRows(sections=exportSections()){
  const rows=[],add=(sec,lbl,val,unit="")=>rows.push({sec,lbl,val:String(val),unit});
  add("Your settings","Country",DATA.country.name);
  DATA.drivers.items.forEach(d=>add("Your settings",d.name,d.fmt(state.drivers[d.id]),d.unit));
  add("Your settings","Global scenario",COUNTRY.label());
  if(COUNTRY.isColombia()){
    ["low","fossil"].forEach(group=>{
      const resolved=COUNTRY.resolveGroup(group);
      Object.entries(resolved).forEach(([name,share])=>add("Your settings",
        `${name} — ${group} group`,fmtN(share,2)+"%",
        (state.sourceMix?.[group]?.[name]!=null?"User-pinned; ":"Unpinned; ")+"resolved share within group in 2050"));
    });
  }
  for(const {title,node} of sections){
    node.querySelectorAll(".tile").forEach(tile=>{
      const label=tile.querySelector(".lbl")?.cloneNode(true);
      const detail=exportText(label?.querySelector("small"));
      label?.querySelectorAll("small").forEach(n=>n.remove());
      add(title,exportText(label),exportText(tile.querySelector(".val")),
        [detail,exportText(tile.querySelector(".unit"))].filter(Boolean).join("; "));
    });
    node.querySelectorAll("table").forEach((table,index)=>{
      const headers=[...table.querySelectorAll("thead th")].map(exportText);
      table.querySelectorAll("tbody tr").forEach(tr=>{
        const cells=[...tr.querySelectorAll("td")].map(exportText);
        if(cells.length) add(title+" — data table "+(index+1),cells[0],cells[1]||"",
          cells.slice(2).map((v,i)=>(headers[i+2]||"Column "+(i+3))+": "+v).join("; "));
      });
    });
    node.querySelectorAll(".note").forEach(note=>add(title,"Caveat",exportText(note)));
  }
  const h=COUNTRY.healthData();
  add("Fixed assumptions","Value per statistical life","US$"+fmtN(h.valuation.vsl),
    h.valuation.priceYear+" USD; transferred value, valuation basis unresolved");
  add("Fixed assumptions","Health reference electrification",h.energy.referenceElectrification2050+"%",
    "Held fixed; differs from the revised BECO context marker");
  add("Fixed assumptions","Health reference low-emission share",h.energy.referenceCleanShare2050+"%",
    "Held fixed; differs from the revised BECO context marker");
  add("Fixed assumptions","SCC pathway",NGA_DATA.pathwayLabel[COUNTRY.sccPath()]||COUNTRY.sccPath(),
    COUNTRY.sccPath()!==COUNTRY.pathway()?"Declared proxy for selected SSP":"Selected SSP");
  const assumption=document.createElement("div");
  const m=MODALS.uncertainty;
  assumption.innerHTML=T(typeof m.body==="function"?m.body():m.body);
  assumption.querySelectorAll("li").forEach((li,i)=>add("Fixed assumptions","Uncertainty "+(i+1),exportText(li)));
  add("Provenance","Interpretation","Conditional prototype results, not forecasts",
    COUNTRY.isColombia()?"Ambient and household burdens overlap: do not add them. Regional ranges are model percentiles, not confidence intervals.":"Includes illustrative/transferred country profiles; not a calibrated national model.");
  add("Provenance","Model source","MSc-thesis e25546bbd08e5b3ed527fc42c0f6a3b66317cb5e",
    "05_ui_design/prototypes/colombia-prototype-v2.html");
  add("Provenance","Department map","© OpenStreetMap contributors via geoBoundaries; ODbL 1.0",
    "https://opendatacommons.org/licenses/odbl/1-0/ ; complete adapted data: https://github.com/perberg70/Nigeria-model/blob/claude/epic-dirac-itqmpi/prototype/colombia/department-boundaries.json");
  return rows;
}
const REPORT_CSS=`@page{size:A4;margin:16mm 14mm}
#report{color:#0B3B54;font:10pt/1.45 "Segoe UI",system-ui,sans-serif}
#report h1{font-size:20pt}#report h2{font-size:16pt;color:#0E5C3F}
#report h3{font-size:12pt}#report .meta{font-size:9pt;color:#40525E}
#report .body{margin:0}#report .title-row{display:none}
#report table{width:100%;border-collapse:collapse;font-size:8.5pt;table-layout:fixed}
#report td,#report th{padding:4pt;border-bottom:1px solid #E3E8EB;overflow-wrap:anywhere}
#report .report-section{break-before:page}
#report .tile,#report .mapbox,#report svg,#report tr{break-inside:avoid}
#report h2,#report h3{break-after:avoid}
#report .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
#report .maprow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
#report .tile .val{font-size:23pt}#report .tile .lbl,#report .tile .unit{font-size:9pt}
#report .fold-body,#report .panel,#report details{overflow:visible}
#report .mapbox svg{height:260px!important}
#report .metric-tip::after{display:none}
#report *{-webkit-print-color-adjust:exact;print-color-adjust:exact}`;
document.head.insertAdjacentHTML("beforeend",`<style media="print">
body:has(#report:not(:empty))>*:not(#report){display:none!important}
#report:not(:empty){display:block!important}
${REPORT_CSS}</style>`);
function reportSection({key,title,node}){
  node.querySelectorAll(".actions,.save-box,.help-row,.info-link,button,input,select").forEach(n=>n.remove());
  node.querySelectorAll("details").forEach(n=>n.open=true);
  node.querySelectorAll("*").forEach(n=>[...n.attributes].forEach(a=>{
    if(/^on/.test(a.name)||a.name==="tabindex"||a.name.startsWith("data-")) n.removeAttribute(a.name);
  }));
  const ids=new Map();
  node.querySelectorAll("[id]").forEach(n=>{const old=n.id;n.id="report-"+key+"-"+old;ids.set(old,n.id);});
  node.querySelectorAll("*").forEach(n=>[...n.attributes].forEach(a=>{
    if(a.value.includes("url(#")) n.setAttribute(a.name,a.value.replace(/url\(#([^)]*)\)/g,(all,id)=>ids.has(id)?`url(#${ids.get(id)})`:all));
  }));
  node.querySelectorAll('a[href="department-boundaries.json"],a[href="MAP-LICENSE.txt"]').forEach(a=>{
    a.href="https://github.com/perberg70/Nigeria-model/blob/claude/epic-dirac-itqmpi/prototype/colombia/"+a.getAttribute("href");
    a.removeAttribute("download");
  });
  return `<section class="report-section"><h2>${reportEscape(title)}</h2>${node.innerHTML}</section>`;
}
function reportEscape(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function outcomeReport(){
  const sections=exportSections(),rows=outcomeRows(sections);
  const table=sec=>`<table><tbody>${rows.filter(r=>r.sec===sec).map(r=>`<tr><td>${reportEscape(r.lbl)}</td><td>${reportEscape(r.val)}</td><td>${reportEscape(r.unit)}</td></tr>`).join("")}</tbody></table>`;
  return `<h1>Saved outcome — ${reportEscape(DATA.country.name)}</h1>
    <p class="meta">EfD climate-economic policy design tool (prototype) · ${new Date().toISOString()}</p>
    <h2>Your settings</h2>${table("Your settings")}
    ${sections.map(reportSection).join("")}
    <section class="report-section"><h2>Fixed assumptions and uncertainty</h2>${table("Fixed assumptions")}
    <h2>Provenance and limitations</h2>${table("Provenance")}</section>`;
}
function saveOutcome(kind){
  const name=`EfD-${DATA.country.name}-outcome-${new Date().toISOString().slice(0,10)}`;
  if(kind==="csv"){
    const q=v=>`"${String(v).replace(/"/g,'""')}"`;
    const csv=["Section,Item,Value,Detail",...outcomeRows().map(r=>[r.sec,r.lbl,r.val,r.unit].map(q).join(","))].join("\r\n");
    const a=document.createElement("a"),url=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));
    a.href=url;a.download=name+".csv";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);return;
  }
  const report=outcomeReport();
  const doc=`<!doctype html><html lang="en"><head><meta charset="utf-8"><title>${reportEscape(name)}</title>
    <style>${document.querySelector("head style:not([media])").textContent}</style>
    <style>body{background:#fff}#report{display:block;max-width:1000px;margin:20px auto;padding:24px}
    .printbar{padding:16px;text-align:center}@media print{.printbar{display:none}#report{margin:0;padding:0;max-width:none}}
    ${REPORT_CSS}</style></head><body>
    <div class="printbar"><button onclick="print()">Print / Save as PDF</button></div><div id="report">${report}</div></body></html>`;
  const w=window.open("","_blank");
  if(w){w.document.open();w.document.write(doc);w.document.close();w.opener=null;w.focus();setTimeout(()=>w.print(),400);return;}
  document.getElementById("report").innerHTML=report;
  const title=document.title;document.title=name;
  window.addEventListener("afterprint",()=>{document.title=title;document.getElementById("report").replaceChildren();},{once:true});
  window.print();
}

/* ---------- driver -> did the numbers move? (demo responsiveness) ---------- */
let _lastRenderedStep=null;
function render(){
  const kept=new Map([...document.querySelectorAll('#content details')].map((d,i)=>[d.dataset.keep||String(i),d.open]));
  renderNav();
  $("#content").innerHTML = VIEWS[DATA.steps[state.step-1].key]();
  // Turn contextual explanations into canvas-style progressive disclosure.
  $("#content").querySelectorAll('.info-link[data-modal]').forEach(link=>{
    if(link.dataset.modal==='sourceMixEditor') return;
    link.outerHTML=modalFold(link.dataset.modal,link.textContent.trim());
  });
  $("#content").querySelectorAll('details:not(.more)').forEach(el=>el.classList.add('fold'));
  if(_lastRenderedStep===state.step)
    $("#content").querySelectorAll('details').forEach((d,i)=>{
      const key=d.dataset.keep||String(i); if(kept.has(key)) d.open=kept.get(key);
    });
  const finder=$("#finder");
  if(finder) finder.addEventListener("change",e=>{selectCountry(e.target.value);render();});
  /* Only jump to the top when the STEP changes. Doing it on every render sent the page
     back up on each slider movement, which read as the screen fighting the user. */
  if(_lastRenderedStep!==state.step){ window.scrollTo({top:0,behavior:"smooth"}); }
  _lastRenderedStep=state.step;
}
/* ---- EDIT HERE: the uncertainty cue shown on every results screen ---- */
/* A MODALS entry rendered in place as a fold-out instead of a pop-up: the same
   title-less lede, body and note that renderModal() shows, so the two never drift. */
function modalFold(key,label){
  const m=MODALS[key];
  const body=typeof m.body==="function"?m.body():m.body, note=typeof m.note==="function"?m.note():m.note;
  return `<details class="fold" data-keep="${key}"><summary>${label}</summary>
    <div class="fold-body" style="margin-top:10px"><p class="cap">${T(m.lede)}</p>${T(body)}${note?`<div class="note">${T(note)}</div>`:""}</div></details>`;
}
function uncCue(){
  return modalFold("uncertainty","◈ This is one possible result. See what could make it higher or lower");
}


/* ---- Codex PR #50, finding 1, accepted 2026-08-24. The screen asserted that
   the rainfall model range "spans zero on every pathway", which is false for
   11 of the 60 country-pathway combinations in the data: Chile under SSP2-4.5,
   SSP3-7.0 and SSP5-8.5, Guyana and Suriname under SSP1-1.9, SSP3-7.0 and
   SSP5-8.5, and Venezuela under SSP3-7.0 and SSP5-8.5. In every one of those
   the whole interval is negative — a robust drying signal, which is exactly
   the kind of result a participant most needs, and the blanket sentence was
   presenting it as unresolved. Every rainfall statement is now derived from
   the interval actually selected. ---- */
function rainfallAgreement(){
  const L=COUNTRY.climate();
  if(!L || L.rainP10==null || L.rainP90==null) return null;
  const crosses = L.rainP10 < 0 && L.rainP90 > 0;
  const dir = !crosses ? (L.rainP90 <= 0 ? "drying" : "wetting") : null;
  return {
    crosses, dir, lo:L.rainP10, hi:L.rainP90,
    short: crosses
      ? `the models disagree on the sign — the range runs ${signed(L.rainP10,0)} to ${signed(L.rainP90,0)} mm/yr`
      : `the models agree on the direction — the whole range is ${dir}, ${signed(L.rainP10,0)} to ${signed(L.rainP90,0)} mm/yr`,
    tile: crosses
      ? `10th–90th percentile across climate models: ${signed(L.rainP10,0)} to ${signed(L.rainP90,0)} mm/year. The range spans zero, so the models do not agree on whether it gets wetter or drier.`
      : `10th–90th percentile across climate models: ${signed(L.rainP10,0)} to ${signed(L.rainP90,0)} mm/year. The whole range is on one side of zero, so the models agree this is ${dir} — an unusually robust signal for rainfall.`
  };
}
/* The same question across all five pathways for the selected country, for the
   comparison table's caption. */
function rainfallAgreementAcrossPathways(){
  const c=NATIONAL_CLIMATE[DATA.country.iso]||{};
  const ks=Object.keys(c);
  const crossing=ks.filter(k=>c[k].rainP10<0 && c[k].rainP90>0);
  const drying=ks.filter(k=>c[k].rainP90<=0);
  const wetting=ks.filter(k=>c[k].rainP10>=0);
  const label=k=>NGA_DATA.pathwayLabel[k]||k;
  if(crossing.length===ks.length)
    return "Rainfall does not order itself the same way: its range spans zero on every pathway, so the direction of change is not settled by the scenario.";
  if(crossing.length===0)
    return `Rainfall moves with them here: on every pathway the whole model range falls on one side of zero, so the direction is agreed even where the magnitude is not.`;
  return `Rainfall is mixed: the model range spans zero on ${crossing.map(label).join(", ")}, so the direction is unsettled there — but on ${[...drying,...wetting].map(label).join(", ")} the whole range falls on one side of zero, and the direction is agreed.`;
}
/* How many regions have a rainfall range that stays on one side of zero. */
function regionsWithAgreedRainfall(){
  const R=COUNTRY.regionClimate();
  if(!R || R[0]==null || R[0].rainP10==null) return null;
  const agreed=R.filter(r=>!(r.rainP10<0 && r.rainP90>0));
  return {agreed:agreed.length, total:R.length, names:agreed.map(r=>r.name)};
}

/* ---------- transparency layer: open / close ---------- */
/* Region panels are built on demand rather than registered, because their
   content depends on the pathway currently selected. */
function openRegionModal(name){
  const m=regionalUnitModal(name); if(!m) return;
  let panel=document.getElementById('regionDetail');
  if(!panel){panel=document.createElement('section');panel.id='regionDetail';panel.className='panel';document.querySelector('.maprow').after(panel);}
  panel.innerHTML=`<h3 tabindex="-1">${T(m.title)}</h3><p>${T(m.lede)}</p>${T(m.body)}<div class="note">${T(m.note)}</div>`;
  panel.querySelector('h3').focus({preventScroll:true});
  panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function openModal(key){
  const m=MODALS[key]; if(!m) return;
  renderModal(m);
}
function renderModal(m){
  /* v2: a body may be a function, so a panel can be built from the data object
     it describes instead of restating its figures in prose. */
  const body = typeof m.body==="function" ? m.body() : m.body;
  const note = typeof m.note==="function" ? m.note() : m.note;
  $("#modal").innerHTML =
    `<button class="x" data-close aria-label="Close">&times;</button>
     <h2>${T(m.title)}</h2><p class="lede">${T(m.lede)}</p>${T(body)}
     ${note?`<div class="note">${T(note)}</div>`:""}`;
  $("#ovl").hidden=false;
  $("#modal").querySelector(".x").focus();
}
function closeModal(){ $("#ovl").hidden=true; }

document.addEventListener("click", e=>{
  const save=e.target.closest("[data-save]"); if(save){saveOutcome(save.dataset.save);return;}
  const md=e.target.closest("[data-modal]"); if(md){ openModal(md.dataset.modal); return; }
  if(e.target.closest("[data-close]") || e.target.id==="ovl"){ closeModal(); return; }
  const pk=e.target.closest("[data-pick]");
  if(pk){ selectCountry(pk.dataset.pick); state.q=""; hideTT(); render(); return; }  // clear query -> closes dropdown
  const rs=e.target.closest("[data-srcreset]");
  if(rs){ state.sourceMix={}; renderModal(MODALS.sourceMixEditor); render(); return; }
  const go=e.target.closest("[data-go]"); if(go){ state.step=+go.dataset.go; render(); return; }
  /* v2: selecting a card also opens that pathway's own panel, as in
     africa-prototype. Selection and explanation in one gesture. */
  const rg=e.target.closest("[data-region]");
  if(rg){ openRegionModal(decodeURIComponent(rg.dataset.region)); return; }
  const c=e.target.closest("[data-ssp]"); if(c){ state.ssp=c.dataset.ssp; render(); openModal("scen_"+c.dataset.ssp); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && !$("#ovl").hidden){ closeModal(); return; }
  if(e.key==="Enter"||e.key===" "){
    const md=e.target.closest("[data-modal]"); if(md){ e.preventDefault(); openModal(md.dataset.modal); return; }
    const go=e.target.closest("[data-go]"); if(go){ e.preventDefault(); state.step=+go.dataset.go; render(); return; }
    const rg=e.target.closest("[data-region]");
    if(rg){ e.preventDefault(); openRegionModal(decodeURIComponent(rg.dataset.region)); return; }
    const card=e.target.closest("[data-ssp]"); if(card){e.preventDefault();state.ssp=card.dataset.ssp;render();openModal("scen_"+card.dataset.ssp);}
  }
});

document.addEventListener("pointermove",e=>{
  const label=e.target.closest&&e.target.closest("[data-pollutant]");
  if(label){const key=label.dataset.pollutant;showTT(e,`<b>${key}</b><br>${TERM_TIPS[key]||"Pollutant category"}`);}
});
document.addEventListener("pointerout",e=>{
  if(e.target.closest&&e.target.closest("[data-pollutant]")) hideTT();
});

document.addEventListener("input", e=>{
  if(e.target.id==="cq"){                      // country search — keep focus + caret
    state.q=e.target.value; render();
    const box=document.getElementById("cq");
    if(box){ box.focus({preventScroll:true}); box.setSelectionRange(box.value.length, box.value.length); }
    return;
  }
  /* layer 2: pin toggle and per-source slider. state.sourceMixOpen keeps the
     disclosure open across the full re-render, and focus is restored to the
     control just used, as the driver sliders above already do. */
  const pin=e.target.closest("[data-pin]");
  if(pin){
    const [g,n]=pin.dataset.pin.split("|");
    state.sourceMix=state.sourceMix||{}; state.sourceMix[g]=state.sourceMix[g]||{};
    if(pin.checked) state.sourceMix[g][n]=+COUNTRY.resolveGroup(g)[n].toFixed(1);
    else delete state.sourceMix[g][n];
    renderModal(MODALS.sourceMixEditor); render();
    const a=document.querySelector(`[data-pin="${g}|${n}"]`); if(a) a.focus({preventScroll:true});
    return; }
  /* DRAG-SAFE. `input` fires continuously while the pointer is down, so it must NOT
     rebuild the DOM — replacing the element mid-gesture is what made a slider move one
     step and then stick, and what threw the page back to the top. State is updated and
     only the readouts are patched. The full re-render waits for `change`, which fires
     once on release. */
  const src=e.target.closest("[data-src]");
  if(src){
    const [g,n]=src.dataset.src.split("|");
    state.sourceMix=state.sourceMix||{}; state.sourceMix[g]=state.sourceMix[g]||{};
    state.sourceMix[g][n]=parseFloat(src.value);
    sourceMixLivePatch(g+"|"+n);
    return; }
  const r=e.target.closest("[data-drv]"); if(!r) return;
  state.drivers[r.dataset.drv]=parseFloat(r.value);
  driverLivePatch(r);
});
/* Release ends the gesture: now it is safe to rebuild the panel so every slider settles
   at its resolved share, and to refresh the results behind the overlay. */
document.addEventListener("change", e=>{
  const src=e.target.closest && e.target.closest("[data-src]");
  if(src){
    const key=src.dataset.src;
    renderModal(MODALS.sourceMixEditor); render();
    const again=document.querySelector(`[data-src="${key}"]`); if(again) again.focus({preventScroll:true});
    return;
  }
  const driver=e.target.closest && e.target.closest("[data-drv]");
  if(driver){
    const key=driver.dataset.drv;
    state.drivers[key]=parseFloat(driver.value);
    render();
    const again=document.querySelector(`[data-drv="${key}"]`); if(again) again.focus({preventScroll:true});
  }
});
render();
</script>
