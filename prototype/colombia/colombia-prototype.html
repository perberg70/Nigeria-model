<title>EfD Colombia — South American climate pathway prototype (v2)</title>
<!--
  ==========================================================================
  MSc thesis prototype — Colombian adaptation of the six-screen Climate
  Ambassador stakeholder journey.

  INTERNAL RESEARCH PROTOTYPE. The header label is "EfD Colombia" as requested
  for this design concept; no endorsement or production affiliation is implied.

  SCREEN 1 — SOUTH AMERICAN COUNTRY SELECTOR.
  Coverage is the 12 sovereign South American states. Boundaries are Natural
  Earth 1:110m Admin 0 data (public domain), downloaded 2026-08-10 from
  https://github.com/nvkelso/natural-earth-vector. Contextual population values
  are World Bank indicator SP.POP.TOTL estimates for 2025, retrieved 2026-08-12.
  The map uses a Mercator projection for recognition and selection.
  The Colombian flag is an inline geometric rendering; other selections use
  their two-letter ISO code so no unverified flag artwork is implied.

  COLOMBIA DATA ROUTES — revised 2026-10-16.
  Screen 4 anchors fossil and industrial CO2 to the Global Carbon Budget.
  The mitigation slider's blue reference labels the observed 2024 level
  (92.7 Mt CO2), using the archived annual Global Carbon Budget series in
  02_literature/data/global_carbon_budget_colombia/. The marker sits at 0%:
  the 2050 policy target is a percentage change from this 2024 level.
  It is independent of the selected 2050 SSP baseline. Other country
  references label their rounded illustrative 2024 profile levels.
  Colombia uses its SSP population/GDP paths and the median normalized Latin
  America final-energy-intensity factor across the available IIASA SSP 2018
  models. The SSP baseline adds each paired R5 run's reported biomass CCS to
  its signed fossil/industrial CO2 before indexing carbon per final energy.
  This removes the reported biomass-CCS credit, but is not a full gross-emissions
  reconstruction; residual negative values remain visible. See
  03_models/2026-10-16_colombia-v2-biomass-ccs-exclusion.md. Other country
  cards transfer the five RCMIP global scenario shapes.
  The policy curve uses an exponential 2025-2050 path and continues the same
  proportional rate to 2100, following africa-prototype. The separate screen-4
  Colombian power chart uses Ember's 2024 generation, mix and life-cycle CO2e
  anchor with UPME BECO's 2024 final-energy shares as normalized policy indices.
  Its independent 2024–2100 SSP baseline transfers paired IIASA Latin America
  energy, electricity and group-mix changes; its policy shares continue in
  bounded log odds. See 03_models/2026-10-12_colombia-ssp-power-baseline.md.
  Screen 5 starts from
  UPME's 2023 Colombian energy balance, WHO AIR_41 ambient-air-pollution deaths
  and World Bank PM2.5 exposure. Its energy-to-health response and US$1.668m VSL
  (2025 prices; US$1.21m-7.811m range shown on screen 5) are prototype assumptions,
  not a Colombia IAM run. Screen 6 was rebuilt on
  2026-08-24 onto World Bank CCKP CMIP6 (2080-2099 against 1995-2014) for all
  twelve countries; it no longer uses IDEAM, and no longer scales one country's
  climate onto another's name. See the SOUTH AMERICA block below. The participant-facing
  screens show complete design states; evidence and transformations are kept in
  the comments beside their data objects.

  The scenario selector is aligned with the five climate pathways configured in
  the IAM: SSP1-1.9, SSP1-2.6, SSP2-4.5, SSP3-7.0 and SSP5-8.5.

  IAM SCC implementation: perberg70/TRA420_Modeling_2025 @
  cdd49e25622c08f765cc941eecf25638589727a9, that repository's own config.yaml
  unmodified, fair 2.2.4, on 2026-08-06. The scenario-specific marginal damage
  values are used on screen 4; screens 5 and 6 use the Colombian routes above.

  COLOMBIAN ADAPTATION — added 2026-08-10.
  Screens are reordered to Country → National pathway → Global SSP. The map
  contains the 12 sovereign South American states and defaults to Colombia.
  Boundaries come from Natural Earth 1:110m Admin 0 countries (public domain),
  downloaded 2026-08-10 from https://github.com/nvkelso/natural-earth-vector.
  Population values are World Bank indicator SP.POP.TOTL estimates for 2025,
  retrieved through the World Bank API on 2026-08-12. They label the country
  selector and, outside Colombia, scale Colombia's energy and health anchors as
  an explicit prototype transfer; they are not SSP population trajectories.
  Screens 4–6 render complete design states; their evidence status is recorded
  internally.

  VERSION 2 — added 2026-08-24, from the 2026-08-13 EfD Colombia feedback
  session (07_meetings/2026-08-13_synthesis_efd-colombia-session.md).
  This file is the revised branch of the two versions promised to the
  participants at that session (1:07:00); colombia-prototype.html remains the
  near-unchanged version they already saw.

  CHANGE 1 — NDC CONTEXT PANEL ON SCREEN 2.
  Requested independently by Jorge Hernán García López (54:23 — the NDC is the
  reference point that dominates Ministry of Environment discussions) and by
  Erik Sterner (56:06). Thomas Sterner (58:16) proposed a pre-programmed NDC/IPCC
  scenario option; that is NOT implemented here — see the basis note below.

  Figures are quoted from Colombia's official submission to the UNFCCC NDC
  registry: "NDC 3.0 — Transformaciones para la Vida" (República de Colombia),
  Tabla 1 "Objetivo nacional de mitigación de emisiones de GEI", p. 54,
  retrieved 2026-08-24 from
  https://unfccc.int/sites/default/files/2025-12/NDC%203.0%20Transformaciones%20para%20la%20Vida%20(Colombia).pdf
    - 2030 (ratified from NDC 2.0, 2020): "En 2030 Colombia emitirá como máximo
      169,44 Mt CO2eq."
    - 2035 (new in NDC 3.0): "En 2035 Colombia emitirá como máximo entre 155 y
      161 MtCO2eq."
  Both are "Objetivo de nivel fijo de emisiones absolutas" — absolute fixed-level
  targets, not reductions against a baseline year or a BAU projection. Gases
  covered: CO2, CH4, N2O, HFCs, PFCs, SF6. Sectors: energy, IPPU, AFOLU and
  waste, i.e. land use IS included, and the target is on NET emissions.

  WHY THE NDC IS SHOWN AS CONTEXT AND NOT AS A MARK ON THE MITIGATION SLIDER.
  The slider sets a 2050 target for FOSSIL-FUEL AND INDUSTRIAL CO2 ONLY, as a
  percentage change from Colombia's observed 2024 level (92.66 Mt).
  The NDC targets are all-gas net totals including AFOLU, at 2030 and 2035.
  Three separate mismatches — gas coverage, sector coverage, and target year —
  so the two quantities are not on the same basis and neither can be read off
  the other. Placing 169.44 on that slider's axis would put a number in front of
  a participant that looks comparable and is not. Converting the NDC onto the
  slider's basis would need Colombia's BTR1 inventory to split gases and
  sectors, plus an assumption to extend 2035 to 2050; that is a data-engine task,
  not a mock-up decision, and is deliberately left undone rather than guessed.
  Decided with Per, 2026-08-24.

  CHANGE 2 — PROVENANCE BEHIND EVERY REFERENCE FIGURE ON SCREEN 2.
  Per, 2026-08-24: each blue reference line under a slider should open a further
  depth of information, so a participant can always ask where the number came
  from. Implemented as REFERENCE_SOURCES plus one generated modal per slider.
  Statuses are honest: "sourced" means read off the named source at the named
  date, "derived" means built here from a sourced anchor, "unsourced" means
  untraced and says so in those words rather than being given a plausible
  source. No slider carries "unsourced" after CHANGE 3, but the state is kept —
  the other eleven South American profiles still hold undocumented rounded GDP
  values and would need it if any of them is ever shown.

  CHANGE 3 — THE GDP REFERENCE MARK IS NOW SOURCED. 2.0% -> 2.5% per year.
  The old value had no provenance anywhere in this file and no recorded period.
  Replaced by the mean of Colombia's real GDP growth over 2016-2025 = 2.5119%,
  World Bank WDI series NY.GDP.MKTP.KD.ZG, retrieved 2026-08-24 from a database
  edition dated 2026-07-13. Ten-year window, not five: Colombia recorded -7.19%
  in 2020 and +10.80% in 2021, so a five-year window catches the rebound but not
  the contraction and reads 4.62%.
  Derivation, alternatives and limitations:
    03_models/2026-08-24_colombia-real-gdp-growth-benchmark.md
  Data: 02_literature/data/worldbank_colombia_gdp/
  NOT changed: the slider's default starting position stays at 2.0 (`value:2`).
  The mark records where Colombia has been; the starting position is a separate
  design choice. Whether they should coincide is open.

  GDP REFERENCE — revised 2026-10-16. The blue mark now shows Colombia's latest
  archived annual real GDP growth: 2.6420% in 2025 (World Bank WDI,
  NY.GDP.MKTP.KD.ZG, archived below). It is independent of the selected SSP.
  The ten-year mean above is a historical design record, not the current mark.
  Other country GDP marks remain rounded illustrative profiles without national
  growth observations attached.
  See 03_models/2026-10-16_colombia-v2-current-gdp-reference.md.
  ==========================================================================
-->
<style>
:root{
  /* ---- EDIT HERE: brand tokens ---- */
  --brand-green:#0A7A48;      /* validated series 1 / primary accent */
  --brand-green-dk:#0E5C3F;   /* buttons, active pips */
  --brand-blue:#3B82F6;       /* validated series 2 */
  /* The optional per-source editor's button, 2026-09-02. It was the same dark green as
     the primary "Choose global scenario" button one row below it, so the optional detour
     and the main forward step looked like the same action.
     VIOLET RATHER THAN BLUE, and the choice was computed rather than picked: against the
     green #0E5C3F, blue-700 separates well for protanopia and deuteranopia but collapses
     under TRITANOPIA (deltaE 19, below the ~20 that reads as a different colour). This
     violet holds deltaE 117 normal / 95 protan / 78 deutan / 48 tritan, so it is distinct
     for all three types, and at 8.98:1 on white text it clears WCAG AAA and sits close to
     the green's own 8.01:1 - same visual weight, different hue. */
  --brand-violet:#5B21B6;
  --link:#1D4ED8;             /* outbound citation links: 6.5:1 on --surface,
                                 where --brand-blue reaches only 3.6:1 */
  --ink:#0B3B54;              /* headings */
  --ink-2:#40525E;            /* body */
  --ink-3:#6B7C87;            /* muted */
  --line:#E3E8EB;
  --surface:#FCFCFB;
  --panel:#FFFFFF;
  --tint:#EEF5F0;             /* "About this tool" panel */
  --danger:#D93025;           /* step-6 indicator values */
  --radius:10px;
  --sidebar-w:290px;
}
*{box-sizing:border-box}
body{margin:0;background:#EDEFF1;color:var(--ink-2);
  font:15px/1.55 "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
.app{max-width:1400px;margin:20px auto;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;overflow:hidden}

/* ---------- header ---------- */
.hdr{display:flex;align-items:center;gap:22px;padding:16px 26px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:11px}
.logo-mark{width:42px;height:42px;flex:none}
.logo-txt{font-weight:800;color:var(--ink);line-height:1.05;font-size:16px}
.tagline{font-family:Georgia,"Times New Roman",serif;font-style:italic;
  color:var(--brand-green);font-size:15px;line-height:1.3}
/* The header's right-hand space carried "Stakeholder prototype / EfD Colombia"
   in small grey type, and only on step 3. Replaced 2026-08-28 with a single
   larger "Prototype" shown on every screen, matching africa-prototype.
   Centred in that space and set in the header's own voice (2026-08-28): it
   takes the weight 800 and --ink of .logo-txt beside it rather than the muted
   grey it had, so it reads as part of the masthead instead of a note pinned to
   the corner. flex:1 lets it claim the space left after the logo and tagline,
   and centre within it. */
/* Matches the screen h1 exactly — 31px, bold, line-height 1.15,
   letter-spacing -.4px, --ink — so "Prototype" and the screen title
   below it are visibly the same rank of type. h1 sets no font-weight,
   so it renders at the browser default bold (700); 800 here read as
   heavier than the titles it was meant to match. */
.hdr-right{flex:1;text-align:center;font-size:31px;font-weight:700;
  line-height:1.15;letter-spacing:-.4px;color:var(--ink)}

/* ---------- layout ---------- */
.main{display:flex;min-height:660px}
.side{width:var(--sidebar-w);flex:none;border-right:1px solid var(--line);padding:22px 20px;
  display:flex;flex-direction:column}
.side h4{margin:0 0 16px;font-size:14px;font-weight:500;color:var(--ink-3)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:12px;padding:7px 0;cursor:pointer;
  font-size:14.5px;color:var(--ink-3);border:0;background:none;width:100%;text-align:left;font-family:inherit}
.pip{width:29px;height:29px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:600;background:#F1F4F6;color:var(--ink-3);border:1px solid var(--line)}
.steps li.on{color:var(--brand-green-dk);font-weight:700}
.steps li.on .pip{background:var(--brand-green-dk);color:#fff;border-color:var(--brand-green-dk)}
.steps li:hover:not(.on){color:var(--ink)}
/* Section headers grouping the sidebar steps into "Settings" (1-3) and
   "Results" (4-6), 2026-08-27. Slightly larger/bolder than the 14.5px step
   labels so they read as headers, not steps; not clickable. Both underlined;
   Results also gets a rule above it, since it sits mid-list rather than at
   the top where the "Your journey" heading already separates Settings. */
.steps li.step-group{cursor:default;padding:2px 0 8px;font-size:15.5px;font-weight:700;
  color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.steps li.step-group.results{margin-top:14px;padding-top:16px;
  border-top:1px solid var(--line)}
.about{margin-top:26px;background:var(--tint);border-radius:var(--radius);padding:15px 16px}
/* v2: a sidebar box that is itself a control, from africa-prototype. */
.about-link{cursor:pointer;text-align:left}
.about-link:hover{box-shadow:0 0 0 2px rgba(14,92,63,.10)}
.about-link:focus-visible{outline:3px solid var(--brand-blue);outline-offset:2px}
.about b{display:block;color:var(--brand-green-dk);margin-bottom:6px;font-size:14.5px}
.about p{margin:0;font-size:13.5px;color:var(--ink-2)}
/* Traceability terms in the About card. The sidebar is 290px and the card's
   inner width is ~218px, so a 250px tooltip centred on the term would run off
   the left edge of the window. Anchor it to the term's left instead and let it
   overhang the sidebar to the right — .side sets no overflow, so nothing clips. */
.about .term::after{left:0;transform:translate(0,5px)}
.about .term:hover::after,.about .term:focus::after{transform:translate(0,0)}
.side-foot{margin-top:auto;display:flex;gap:20px;padding-top:22px;font-size:13.5px;color:var(--ink-2)}
.side-foot span{display:flex;align-items:center;gap:7px;cursor:pointer}
.side-foot:first-of-type{flex-direction:column;align-items:flex-start;gap:10px}

/* ---------- content ---------- */
.content{flex:1;padding:26px 34px 30px;min-width:0}
.eyebrow{color:var(--brand-green);font-size:14px;margin:0 0 4px}
.title-row{display:flex;gap:18px;align-items:flex-start}
.title-ico{width:52px;height:52px;flex:none;margin-top:6px}
h1{margin:0;font-size:31px;line-height:1.15;color:var(--ink);letter-spacing:-.4px}
.sub{margin:9px 0 0;color:var(--ink-2);font-size:15.5px}
.body{margin-left:70px}
@media(max-width:900px){.body{margin-left:0}}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0 22px}
.tile{border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;text-align:center;background:var(--surface)}
.tile .lbl{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.3}
.tile .lbl small{display:block;font-weight:400;color:var(--ink-2);font-size:13.5px}
.tile .val{font-size:38px;font-weight:700;color:var(--brand-green-dk);margin:10px 0 4px;letter-spacing:-1px}
.tile.warn .val{color:var(--danger)}
.tile.neutral .val{color:var(--ink)}
@media(max-width:700px){.tiles{grid-template-columns:1fr}}
/* Optional icon badge at the top of a tile (t.ico). Added 2026-10-13 when the
   step 4 callouts and the wide climate-damage banner were replaced by one row of
   three tiles; the badge carries over the illustrations those two had. */
.tile .ico{width:52px;height:52px;border-radius:50%;background:var(--tint);
  font-size:26px;display:grid;place-items:center;margin:0 auto 10px}
/* Two non-standard tile states. Never colour alone: each carries a glyph too,
   because the author uses a daltonized theme and participants may have CVD. */
.tile.caveat{border-color:#C77700;box-shadow:inset 0 -3px 0 #F0B429}
.tile.caveat .lbl::before{content:"⚠ ";color:#8A5300;font-weight:700}
.tile.nodata{border-style:dashed;background:#F6F7F8}
.tile.nodata .val{color:var(--ink-3);font-size:30px}
.tile.nodata .lbl::before{content:"⃠ ";color:var(--ink-3);font-weight:700}
/* A sound figure that comes from a different source than the rest of the
   screen. Distinct from .caveat, which means "this may be wrong". */
.tile.altsource{border-color:#1C6E8C;box-shadow:inset 0 -3px 0 #7FB2C7}
.tile.altsource .lbl::before{content:"◆ ";color:#1C6E8C;font-weight:700}
.tile .unit{font-size:13.5px;color:var(--ink-3)}
.tile.metric-tip{cursor:help}
.tile.metric-tip:focus-visible{outline:3px solid var(--brand-blue);outline-offset:2px}

/* ---------- cards (SSP) ---------- */
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin:22px 0}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:16px 13px;text-align:center;
  cursor:pointer;background:var(--panel);position:relative;transition:border-color .12s,box-shadow .12s}
.card:hover{border-color:#BFCBD2}
.card.on{border:2px solid var(--brand-green-dk);padding:15px 12px}
.card .tick{position:absolute;top:9px;right:9px;width:22px;height:22px;border-radius:50%;
  background:var(--brand-green-dk);color:#fff;display:none;place-items:center;font-size:12px}
.card.on .tick{display:grid}
.card h5{margin:0 0 12px;font-size:17px;color:var(--ink)}
.card .ico{font-size:26px;margin-bottom:10px;display:block}
.card .nm{font-weight:700;color:var(--ink);font-size:14px;margin-bottom:7px}
.card p{margin:0;font-size:12.8px;color:var(--ink-2);line-height:1.45}

/* ---------- sliders ---------- */
.driver{display:grid;grid-template-columns:64px 1fr 320px 118px;gap:18px;align-items:center;
  border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:15px;background:var(--panel)}
.driver .dico{width:52px;height:52px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:23px}
.driver .dname{font-weight:700;color:var(--ink);font-size:16px}
.driver .ddesc{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.ticks{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);margin-bottom:5px}
.ticks .cur{color:var(--brand-green-dk);font-weight:700}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;background:#D9E0E4;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
  background:var(--brand-green-dk);cursor:pointer;border:0}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--brand-green-dk);cursor:pointer;border:0}
.dval{background:var(--tint);border-radius:8px;padding:11px 8px;text-align:center}
.dval b{display:block;font-size:26px;color:var(--brand-green-dk);letter-spacing:-.5px}
.dval span{font-size:12.5px;color:var(--ink-2)}

/* ---------- panels & charts ---------- */
.panel{border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;background:var(--surface);margin-bottom:16px}
.panel h3{margin:0 0 2px;font-size:16px;color:var(--ink)}
.panel .cap{font-size:13px;color:var(--ink-3);margin:0 0 12px}
.legend{display:flex;gap:22px;justify-content:flex-end;font-size:13.5px;color:var(--ink-2);flex-wrap:wrap}
.legend i{width:13px;height:13px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:-1px}
.legend i.dashed{width:22px;height:0;border-radius:0;background:none;border:0;border-top:2px dashed #7C8B94;vertical-align:3px}
.legend i.band{width:22px;height:12px;border-radius:2px;background:#7C8B94;opacity:.26;vertical-align:-1px}
.legend i.solid{width:22px;height:0;border-radius:0;background:none;border:0;border-top:3px solid var(--brand-green);vertical-align:3px}
.legend i.dotted{width:22px;height:0;border-radius:0;background:none;border:0;border-top:3px dotted #253746;vertical-align:3px}
.chart-head{display:flex;align-items:baseline;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.chart-head h3{flex:none}
.chart-head .legend{margin-left:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.section-label{margin:22px 0 8px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink);font-weight:750;font-size:15px}
.section-label span{display:block;font-weight:400;color:var(--ink-3);font-size:13px;margin-top:3px}
.decomp{display:grid;grid-template-columns:180px 1fr 70px;gap:9px 14px;align-items:center;margin-top:18px}
.decomp .lab{font-size:13.5px;color:var(--ink-2)}
.decomp .track{height:20px;background:#EEF1F2;border-radius:4px;position:relative;overflow:hidden}
.decomp .bar{height:100%;border-radius:4px;position:absolute;left:50%}
.decomp .bar.good{background:var(--brand-green)}
.decomp .bar.bad{background:#B55A42;transform:translateX(-100%)}
.decomp .val{text-align:right;font-weight:700;color:var(--ink);font-size:13.5px}
.flow-note{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 2px}
.flow-note span{background:var(--tint);border:1px solid #CFE1D8;border-radius:8px;padding:10px;text-align:center;color:var(--ink);font-size:12.5px}
svg{display:block;max-width:100%;overflow:visible}
.gridline{stroke:#E9EDEF;stroke-width:1}
.axis{stroke:#C9D2D7;stroke-width:1}
.axtx{font-size:12px;fill:var(--ink-3)}
.barlbl{font-size:13px;fill:var(--ink-2);font-weight:600}
.catlbl{font-size:14px;fill:var(--ink);font-weight:600}
.bar{transition:opacity .12s}
.bar:hover{opacity:.78}

/* ---------- buttons / misc ---------- */
.actions{display:flex;justify-content:flex-end;margin-top:20px;gap:12px}
.btn{background:var(--brand-green-dk);color:#fff;border:0;border-radius:9px;padding:14px 26px;
  font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:11px}
.btn:hover{background:#0b4a33}
.btn.wide{width:100%;justify-content:center}
/* Hue is not the only cue: this button is also left-aligned, lighter in weight and
   labelled "optional", so it does not rest on colour alone to read as secondary. */
.srcbtn{background:var(--brand-violet)}
.srcbtn:hover{background:#4C1D95}
.btn.ghost{background:#fff;color:var(--brand-green-dk);border:1px solid var(--line);font-weight:600;padding:10px 16px;font-size:14px}
.note{display:flex;gap:11px;align-items:flex-start;background:var(--tint);border-radius:var(--radius);
  padding:14px 16px;font-size:14px;color:var(--ink-2);margin-top:6px}
.search{width:100%;border:1px solid var(--line);border-radius:9px;padding:13px 15px;font-size:15px;
  color:var(--ink-2);font-family:inherit;margin-bottom:16px}
.countrybar{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-top:16px;background:var(--panel)}
.countrybar .nm{font-size:19px;font-weight:700;color:var(--ink)}
.countrybar .meta{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.flag{width:52px;height:35px;border-radius:4px;border:1px solid var(--line);flex:none}
.searchwrap{position:relative;z-index:20}
.ac{position:absolute;left:0;right:0;top:calc(100% - 10px);margin:0;padding:6px;list-style:none;
  background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 26px rgba(11,59,84,.13);max-height:310px;overflow:auto}
.ac li{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:7px;cursor:pointer;font-size:14.5px}
.ac li:hover{background:var(--tint)}
.ac li b{color:var(--ink);font-weight:600}
.ac li span{margin-left:auto;color:var(--ink-3);font-size:13px}
.ac li.none{color:var(--ink-3);cursor:default}
.ac li.none:hover{background:none}
.ac .flag{width:26px;height:17px;border-radius:3px}
.mapbig{padding:12px;margin-top:4px}
.mapbig svg{width:100%;height:auto}
.pickable{cursor:pointer;transition:fill .1s}
.pickable:hover{fill:#9FC7B1}
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mapbox{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--surface)}
.mapbox h4{margin:0;font-size:15px;color:var(--ink)}
.mapbox .yr{font-size:13px;color:var(--ink-3);margin:2px 0 10px}
.maprow .inner{display:flex;gap:12px;align-items:center}
.climate-region{stroke:#fff;stroke-width:1.35;vector-effect:non-scaling-stroke;transition:filter .12s,opacity .12s}
.climate-region:hover,.climate-region:focus{filter:brightness(.91);opacity:.92;outline:none}
.ph{font-size:11.5px;color:var(--ink-3);text-align:center;margin-top:8px;font-style:italic}
table.dt{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:12px}
table.dt th,table.dt td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left}
table.dt th{color:var(--ink);font-weight:700}
/* Numeric columns are right-aligned; their headers must follow, or a header
   sits at the left edge of a column whose figures sit at the right (2026-08-28).
   Column 0 is the label column and stays left in both rows. */
table.dt th.n,table.dt td.n{text-align:right}
table.dt td.n{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.tt{position:fixed;pointer-events:none;background:#0B3B54;color:#fff;font-size:12.5px;
  padding:7px 10px;border-radius:7px;opacity:0;transition:opacity .1s;z-index:50;white-space:nowrap}

/* ---------- transparency layer: explanatory panels ---------- */
.ovl{position:fixed;inset:0;background:rgba(11,59,84,.42);z-index:60;display:grid;place-items:center;padding:24px}
.modal{background:var(--surface);border-radius:14px;max-width:660px;width:100%;max-height:86vh;overflow:auto;
  box-shadow:0 18px 50px rgba(11,59,84,.28);padding:26px 30px 28px;position:relative}
.modal h2{margin:0 0 4px;font-size:23px;color:var(--ink);letter-spacing:-.3px;padding-right:36px}
.modal .lede{margin:0 0 18px;font-size:15px;color:var(--ink-2)}
.modal h3{margin:20px 0 7px;font-size:15px;color:var(--brand-green-dk)}
.modal p{margin:0 0 10px;font-size:14.5px;color:var(--ink-2);line-height:1.55}
.modal .x{position:absolute;top:16px;right:18px;border:0;background:none;font-size:23px;line-height:1;
  color:var(--ink-3);cursor:pointer;padding:4px 8px;border-radius:7px;font-family:inherit}
.modal .x:hover{background:var(--tint);color:var(--ink)}
.chain{list-style:none;margin:0 0 4px;padding:0}
.chain li{display:flex;gap:13px;padding:12px 0;border-bottom:1px solid var(--line)}
.chain li:last-child{border-bottom:0}
.chain .ico{width:30px;flex:none;text-align:center;font-size:19px;line-height:1.3}
/* v2: the NDC list uses a four-digit year in the icon column, which overruns the
   30px meant for a single glyph. Widened here rather than globally, so the
   existing single-glyph chains keep their tighter measure. */
.chain.ndc-chain .ico{width:56px;font-size:15px;font-weight:700;color:var(--brand-green-dk);text-align:left}
/* v2: the deeper-information link inside a slider box. Sits under the blue
   reference label, in the same column, so the box keeps its own height and the
   sliders below it stay on screen. */
.driver-more{margin-top:5px}
.driver-more .info-link{font-size:12.5px}
.driver-more>div+div{margin-top:3px}
/* An untraced figure is marked by glyph and wording as well as colour — the ⚠
   in the link text carries it for a reader who cannot see the amber. */
.driver-more .info-link.unsourced{color:#8A5300}
.src-status{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
  font-size:13px;font-weight:600;margin-bottom:14px}
.src-status.ok{background:var(--tint);color:var(--brand-green-dk)}
.src-status.warn{background:#FDF3E0;color:#8A5300;border:1px solid #F0B429}
.chain b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}
/* The step TITLE is a block; a <b> inside a step's <span> description must stay
   inline. Without this, every inline bold in every chain panel breaks onto its own
   line and the punctuation after it orphans. Carried over from africa-prototype,
   which fixed the same rule on 2026-08-17; this file never received it, so the
   defect was live in the ambient, household, source-mix, decomposition, emissions
   and health panels too - not only in the energy-demand panel that exposed it. */
.chain span b{display:inline;color:inherit;font-size:inherit;margin:0}
.chain span{font-size:14px;color:var(--ink-2);line-height:1.5}
.note{background:var(--tint);border-radius:var(--radius);padding:13px 15px;margin-top:18px;
  font-size:13.5px;color:var(--ink-2);line-height:1.5}
/* the .note above the results screens is a flex row (icon + text); inside a panel
   the note is running prose, so it must not inherit that flex. */
.modal .note{display:block}
.note b{color:var(--brand-green-dk)}
.unc{display:inline-flex;align-items:center;gap:7px;margin-top:9px;padding:6px 11px;border-radius:999px;
  background:var(--tint);border:1px solid #CFE0D6;font-size:13px;color:var(--ink-2);cursor:pointer}
.unc b{color:var(--brand-green-dk);font-weight:600}
.unc:hover{border-color:var(--brand-green-dk)}

/* ---- EDIT HERE: outbound citation links inside the explanatory panels ----
   Three cues, never colour alone: the 📄 glyph, the role label, and the
   underline. The ↗ inside the link marks that it leaves the prototype. */
.paperrow{margin:9px 0 0;font-size:12.8px;line-height:1.5;color:var(--ink-2)}
.paperrow .lbl2{font-weight:600;color:var(--ink)}
a.paper{color:var(--link);font-weight:600;text-decoration:underline;
  text-decoration-thickness:1px;text-underline-offset:2px;word-break:break-word}
a.paper:hover{color:var(--brand-green-dk);text-decoration-thickness:2px}
a.paper:focus-visible{outline:2px solid var(--brand-blue);outline-offset:3px;border-radius:3px}

/* South American country selector adapted from the African prototype. */
.africa-picker{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-top:20px}.africa-picker .mapbig{margin:0;background:#F4F8FA}.cty{fill:#DCE6E1;stroke:#FCFCFB;stroke-width:.7;cursor:pointer;transition:fill .1s}.cty:hover{fill:#9FC4B2}.cty[aria-current="true"]{fill:var(--brand-green);stroke:#0B3B2C;stroke-width:1.6}.cty:focus-visible{outline:none;stroke:#0B3B2C;stroke-width:2.2}.mk{fill:none;stroke:#5A7A6B;stroke-width:1.2;cursor:pointer}.mk:hover{stroke:var(--brand-green-dk);stroke-width:2}.mk[aria-current="true"]{fill:var(--brand-green);stroke:#0B3B2C;stroke-width:1.8}.aflag{width:52px;height:39px;border:1px solid var(--line);border-radius:4px;overflow:hidden;display:block;flex:none;background:#fff}.aflag svg{width:100%;height:100%;display:block}.picker-side .countrybar{margin-top:0}.picker-label{display:block;margin:18px 0 7px;color:var(--ink);font-weight:700}.picker-side .search{margin:0}.picker-side .ph{text-align:left;line-height:1.45}.picked .nm{font-size:19px;font-weight:700;color:var(--ink)}@media(max-width:900px){.africa-picker{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}

/* Feedback-session adaptations: visible hover/focus help and relocated information. */
.term{position:relative;display:inline-block;border-bottom:2px dotted var(--brand-blue);cursor:help;color:var(--ink);font-weight:600}
.term::after,.help-card::after{content:attr(data-tip);position:absolute;width:250px;background:var(--ink);color:#fff;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.45;font-weight:400;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s,transform .12s;z-index:55;box-shadow:0 9px 24px rgba(11,59,84,.24)}
.term::after{left:50%;bottom:calc(100% + 9px);transform:translate(-50%,5px)}
.help-card::after{left:50%;top:calc(100% + 8px);transform:translate(-50%,-5px);text-align:left}
.term:hover::after,.term:focus::after,.help-card:hover::after,.help-card:focus::after{opacity:1;visibility:visible;transform:translate(-50%,0)}
.hover-instruction{display:inline-flex;align-items:center;gap:6px;color:var(--brand-blue);font-size:13px;font-weight:600;margin:8px 0 0}
.info-actions{display:flex;flex-direction:column;gap:9px;margin:4px 0 20px;padding:16px;background:var(--tint);border-radius:var(--radius)}
.info-action{display:flex;align-items:center;gap:12px;width:100%;padding:13px 15px;border:1.5px solid var(--brand-green-dk);border-radius:8px;background:#fff;color:var(--brand-green-dk);font:700 15px/1.35 inherit;cursor:pointer;text-align:left}
.info-action .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand-green-dk);color:#fff;display:grid;place-items:center;font:700 13.5px/1 inherit}
.info-action .ic{flex:none;font-size:16px}
.info-action:focus-visible{outline:3px solid var(--brand-blue);outline-offset:2px}
.info-action:hover,.info-action:focus{border-color:var(--brand-green-dk);box-shadow:0 0 0 2px rgba(14,92,63,.08);outline:none}
.help-row{display:flex;justify-content:flex-end;gap:14px;align-items:center;margin:8px 0 18px;flex-wrap:wrap}.info-link{color:var(--brand-blue);cursor:pointer;font-size:13.5px;font-weight:600}.outcome-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 22px}.preview-item{padding:13px 14px;border-radius:9px;background:var(--tint);color:var(--ink);font-size:13.5px;font-weight:600}.preview-item span{display:block;color:var(--ink-3);font-size:12.5px;font-weight:400;margin-top:2px}.range-wrap{position:relative}.reference-mark{position:absolute;top:20px;height:26px;width:2px;background:var(--brand-blue);pointer-events:none}.reference-mark::before{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--brand-blue)}.reference-label{font-size:12.5px;color:var(--brand-blue);margin-top:7px}.reference-note{font-size:12px;color:var(--ink-3);margin-top:2px}.unc{margin-top:0}
@media(max-width:700px){.outcome-preview,.info-actions{padding:12px}.term::after,.help-card::after{position:fixed;left:16px;right:16px;bottom:18px;top:auto;width:auto;transform:none}.term:hover::after,.term:focus::after,.help-card:hover::after,.help-card:focus::after{transform:none}}

/* Applied canvas v2 presentation; calculations remain in the source engine. */
/* Colombia prototype v2 — shared styles. Tokens, fonts and component rules follow
   the Nigeria prototype (Nigeria-model/prototype/africa-prototype.html). */
:root{
  --brand-green:#0A7A48;
  --brand-green-dk:#0E5C3F;
  --brand-blue:#3B82F6;
  --link:#1D4ED8;
  --ink:#0B3B54;
  --ink-2:#40525E;
  --ink-3:#6B7C87;
  --line:#E3E8EB;
  --surface:#FCFCFB;
  --panel:#FFFFFF;
  --tint:#EEF5F0;
  --danger:#D93025;
  --radius:10px;
}
*{box-sizing:border-box}
.page{background:#EDEFF1;color:var(--ink-2);min-height:100%;padding:20px 0;
  font:15px/1.55 "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
.app{max-width:1400px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}

/* header + step bar */
.hdr{display:flex;align-items:center;gap:16px;padding:12px 26px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:11px}
.logo-mark{width:38px;height:38px;flex:none}
.logo-txt{font-weight:800;color:var(--ink);line-height:1.05;font-size:16px}
.tagline{font-family:Georgia,"Times New Roman",serif;font-style:italic;color:var(--brand-green);font-size:13px;line-height:1.3;white-space:nowrap}
.proto-badge{font-size:11px;font-weight:600;color:#8A4B12;background:#FFF1DE;padding:2px 6px;border-radius:5px;vertical-align:2px;margin-left:4px}
.pip{width:29px;height:29px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:#F1F4F6;color:var(--ink-3);border:1px solid var(--line)}
.stepbar{flex:1;display:flex;justify-content:center;align-items:center;gap:2px;flex-wrap:wrap;min-width:0}
.stepbar .st{display:flex;align-items:center;gap:7px;height:38px;padding:0 10px;border-radius:19px;color:var(--ink-2);font-size:13.5px;white-space:nowrap;text-decoration:none}
.stepbar .st:hover{background:var(--tint);color:var(--ink)}
.stepbar .st .pip{width:22px;height:22px;font-size:11.5px}
.stepbar .st.done .pip{background:var(--tint);color:var(--brand-green-dk);border-color:#CFE0D6}
.stepbar .st.on{background:var(--brand-green-dk);color:#fff;font-weight:600}
.stepbar .st.on .pip{background:#fff;color:var(--brand-green-dk);border-color:#fff}
.stepbar .st:focus-visible{outline:3px solid var(--brand-blue);outline-offset:2px}
.stepbar .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.hdr-link{flex:none;border:1px solid var(--line);background:#fff;color:var(--link);font-size:13.5px;font-weight:600;padding:8px 13px;border-radius:8px;text-decoration:none}
.hdr-link:hover{border-color:var(--link)}

/* "Your settings" strip */
.strip{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;padding:7px 26px;background:#F7F9F8;border-bottom:1px solid var(--line);font-size:13px}
.strip .k{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
.strip a{color:var(--ink-3);padding:4px 9px;border-radius:6px;text-decoration:none}
.strip a b{font-variant-numeric:tabular-nums}
.strip a.use{background:var(--tint);color:var(--ink)}
.strip a.use.ssp{background:#E6EFF6}
.strip a:hover{text-decoration:underline}
.strip .hint{margin-left:8px;font-size:12px;color:var(--ink-3)}

/* content + title block */
.content{max-width:1180px;margin:0 auto;padding:28px 40px 40px}
.title-row{display:flex;gap:16px;align-items:flex-start}
.title-main{flex:1;min-width:0}
.title-ico{width:40px;height:40px;flex:none;margin-top:4px}
.eyebrow{color:var(--brand-green);font-size:14px;margin:0 0 4px}
h1{margin:0;font-size:31px;line-height:1.15;color:var(--ink);letter-spacing:-.4px}
.sub{margin:9px 0 0;color:var(--ink-2);font-size:15.5px}
.body{margin-left:56px}
.pathway-tag{display:inline-flex;align-items:center;gap:11px;margin:13px 0 0;padding:7px 15px 7px 12px;border:1px solid var(--brand-green);border-radius:999px;background:var(--tint)}
.pathway-tag .k{font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3)}
.pathway-tag b{font-size:16.5px;color:var(--brand-green-dk)}

/* numeric result boxes */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:24px 0 22px}
.tiles.tiles-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;text-align:center;background:var(--surface)}
.tile .lbl{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.3}
.tile .lbl small{display:block;font-weight:400;color:var(--ink-2);font-size:13.5px}
.tile .val{font-size:38px;font-weight:700;color:var(--brand-green-dk);margin:10px 0 4px;letter-spacing:-1px}
.tile .unit{font-size:13.5px;color:var(--ink-3)}
.tile .unit.outcome{font-size:15px;font-weight:700;line-height:1.3}
.tile .unit.outcome.good{color:var(--brand-green-dk)}
.tile.hero{background:var(--brand-green-dk);border-color:var(--brand-green-dk)}
.tile.hero .lbl,.tile.hero .val,.tile.hero .unit,.tile.hero .lbl small{color:#fff}
.tile.word .val{font-size:34px;letter-spacing:-.5px}
.tile.decomp{background:#FFF6E8;border-color:#E9D3AA;text-align:left}
.tile.decomp table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px;color:var(--ink-2)}
.tile.decomp td{padding:5px 0;vertical-align:top}
.tile.decomp td.n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
.tile.decomp tr.tot td{border-top:1px solid #E9D3AA;font-weight:700;color:var(--ink)}
.tile.decomp .foot{margin:8px 0 0;font-size:12.5px;color:var(--ink-2)}
.good-n{color:var(--brand-green-dk)}.bad-n{color:var(--danger)}
.tile.metric-tip{position:relative;cursor:help}
.tile.metric-tip:focus-visible{outline:3px solid var(--brand-blue);outline-offset:2px}
.tip-hint{margin:-10px 0 16px;font-size:13px;color:var(--ink-3)}

/* fold-out information layers */
.fold-list{display:grid;gap:10px}
.fold-list+.maprow,.fold-list+.panel{margin-top:16px}
.fold,.fold-list details{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 15px;font-size:14px;color:var(--ink-2)}
.fold-list details details{margin-top:10px}
.fold>summary,.fold-list details>summary,.more>summary,.mixpanel>summary{cursor:pointer;color:var(--link);font-size:14px;font-weight:700;line-height:1.45;list-style:none;display:flex;align-items:baseline;gap:10px}
.fold>summary::-webkit-details-marker,.fold-list details>summary::-webkit-details-marker,.more>summary::-webkit-details-marker,.mixpanel>summary::-webkit-details-marker{display:none}
.fold>summary::before,.fold-list details>summary::before,.more>summary::before,.mixpanel>summary::before{content:"▸";flex:none;width:14px}
.fold[open]>summary::before,.fold-list details[open]>summary::before,.more[open]>summary::before,.mixpanel[open]>summary::before{content:"▾"}
.fold>summary span{font-weight:400;color:var(--ink-3)}
.fold p,.fold-list p{margin:8px 0 0;line-height:1.55}
.more{font-size:13.5px;color:var(--ink-2)}
.more p{margin:6px 0 0;line-height:1.55}
.about-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 14px}
.src-chip{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--tint);color:var(--brand-green-dk);margin-top:8px}
.src-chip.derived{background:#E6EFF6;color:#123E5C}
.chain{list-style:none;margin:8px 0 0;padding:0}
.chain li{display:flex;gap:13px;padding:9px 0;border-bottom:1px solid var(--line)}
.chain li:last-child{border-bottom:0}
.chain .yr{width:56px;flex:none;font-size:15px;font-weight:700;color:var(--brand-green-dk)}
.chain b{color:var(--ink)}
.cite{margin:9px 0 0;font-size:12.8px;line-height:1.5;color:var(--ink-2)}
.cite b{color:var(--ink)}
a.paper{color:var(--link);font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;word-break:break-word}

/* information entry points */
.info-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 6px}
.info-action{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:10px 14px;border:1.5px solid var(--brand-green-dk);border-radius:10px;background:#fff;color:var(--brand-green-dk);font-weight:700;font-size:14px;line-height:1.3;text-decoration:none}
.info-action .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand-green-dk);color:#fff;display:grid;place-items:center;font-size:13.5px;line-height:1}
.info-action svg{flex:none}
.info-action:hover{box-shadow:0 0 0 2px rgba(14,92,63,.08)}
.info-link{color:var(--link);font-size:13.5px;font-weight:600;text-decoration:none}
.info-link:hover{text-decoration:underline}
.section-label{margin:22px 0 8px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink);font-weight:700;font-size:15px}
.section-label span{display:block;font-weight:400;color:var(--ink-3);font-size:13px;margin-top:3px}

/* country picker */
.picker{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-top:20px}
.mapbox{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--surface)}
.mapbox h4{margin:0;font-size:15px;color:var(--ink)}
.mapbox .yr{font-size:13px;color:var(--ink-3);margin:2px 0 10px}
.mapbig{padding:12px;background:#F4F8FA}
.mapbig svg{width:100%;height:auto;display:block}
.countrybar{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;background:var(--panel)}
.countrybar .nm{font-size:19px;font-weight:700;color:var(--ink)}
.countrybar .meta{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.aflag{width:52px;height:39px;border:1px solid var(--line);border-radius:4px;overflow:hidden;display:grid;place-items:center;flex:none;background:#F1F4F6;color:var(--ink-3);font-size:13px;font-weight:700}
.aflag svg{width:100%;height:100%;display:block}
.picker-label{display:block;margin:18px 0 7px;color:var(--ink);font-weight:700}
.search{width:100%;border:1px solid var(--line);border-radius:9px;padding:13px 15px;font-size:15px;color:var(--ink-2);font-family:inherit;background:#F4F6F7}
.ph{font-size:11.5px;color:var(--ink-3);margin-top:8px;font-style:italic;line-height:1.45}

/* levers */
.driver{display:grid;grid-template-columns:280px minmax(0,1fr) 118px;gap:10px 28px;align-items:center;border:1px solid var(--line);border-radius:var(--radius);padding:16px 22px;margin-bottom:12px;background:var(--panel)}
.driver .dname{font-weight:700;color:var(--ink);font-size:16px;margin:0}
.driver .dshort{font-size:13px;color:var(--ink-3);margin-top:2px}
.driver>details{grid-column:1/-1}
.range-wrap{position:relative}
.ticks{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);margin-bottom:5px}
.ticks .cur{color:var(--brand-green-dk);font-weight:700}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;background:#D9E0E4;outline:none;margin:8px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--brand-green-dk);cursor:pointer;border:0}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--brand-green-dk);cursor:pointer;border:0}
.reference-mark{position:absolute;top:20px;height:26px;width:2px;background:var(--brand-blue);pointer-events:none}
.reference-mark::before{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--brand-blue)}
.dval{background:var(--tint);border-radius:8px;padding:11px 8px;text-align:center}
.dval b{display:block;font-size:26px;color:var(--brand-green-dk);letter-spacing:-.5px}
.dval span{font-size:12.5px;color:var(--ink-2)}
.lead-line{font-size:14px;color:var(--ink-3);margin:9px 0 0}
.mixpanel{grid-column:1/-1;background:#EEF4F9;border:1.5px solid #9DBBD3;border-radius:10px;padding:14px 18px;font-size:13.5px;color:var(--ink-2)}
.mixpanel .badge{font-size:12px;font-weight:600;color:#fff;background:#1F5F8B;padding:2px 8px;border-radius:10px;margin-left:6px;white-space:nowrap}
.mixbar-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin:12px 0 4px}
.mixbar{display:flex;height:30px;border-radius:6px;overflow:hidden}
.mixbar div{display:flex;align-items:center;justify-content:center;font-size:11.5px;white-space:nowrap;overflow:hidden;min-width:0}

/* SSP cards */
.default-line{display:flex;align-items:center;gap:10px;margin:14px 0 0;padding:10px 14px;border-radius:10px;background:#E6EFF6;color:#123E5C;font-size:14px}
.scenario-cue{margin:8px 0 0;font-size:13px;color:var(--ink-3)}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px;margin:22px 0}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:16px 13px;text-align:center;background:var(--panel);position:relative;display:flex;flex-direction:column;width:100%;font:inherit;color:inherit;cursor:pointer}
.card:hover{border-color:#BFCBD2}
.card.on{border:2px solid var(--brand-green-dk);padding:15px 12px}
.card .tick{position:absolute;top:9px;right:9px;width:22px;height:22px;border-radius:50%;background:var(--brand-green-dk);color:#fff;display:grid;place-items:center;font-size:12px}
.card h5{margin:0 0 12px;font-size:17px;color:var(--ink)}
.card .sketch{width:100%;height:40px;margin:2px 0 10px}
.card .nm{font-weight:700;color:var(--ink);font-size:14px;margin-bottom:7px}
.card p{margin:0;font-size:12.8px;color:var(--ink-2);line-height:1.45}
.sketch-note{font-size:12px;color:var(--ink-3);margin:-8px 0 0}

/* panels, legends, charts */
.panel{border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;background:var(--surface);margin-bottom:16px}
.panel h3{margin:0 0 2px;font-size:16px;color:var(--ink)}
.panel .cap{font-size:13px;color:var(--ink-3);margin:0 0 12px}
.chart-head{display:flex;align-items:baseline;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.chart-head .legend{margin-left:auto}
.chart-head.legend-left{flex-direction:column;align-items:flex-start;gap:9px}
.chart-head.legend-left .legend{margin-left:0;justify-content:flex-start}
.legend{display:flex;gap:8px 22px;justify-content:flex-end;font-size:13.5px;color:var(--ink-2);flex-wrap:wrap}
.legend i{width:13px;height:13px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:-1px}
.legend i.dashed{width:22px;height:0;border-radius:0;border-top:2px dashed #7C8B94;vertical-align:3px}
.legend i.solid{width:22px;height:0;border-radius:0;border-top:3px solid var(--brand-green);vertical-align:3px}
.legend i.dotted{width:22px;height:0;border-radius:0;border-top:3px dotted #253746;vertical-align:3px}
.legend i.band{width:22px;height:12px;background:#7C8B94;opacity:.3}
svg{display:block;max-width:100%;overflow:visible}
.gridline{stroke:#E9EDEF;stroke-width:1}
.axis{stroke:#C9D2D7;stroke-width:1}
.axtx{font-size:12px;fill:var(--ink-3)}
.note{display:flex;gap:11px;align-items:flex-start;background:var(--tint);border-radius:var(--radius);padding:13px 15px;font-size:13.5px;color:var(--ink-2);line-height:1.5;margin:0 0 16px}
.note.caveat{background:#FFF6E8;border:1px solid #E9D3AA}
.note b{color:var(--ink)}
.note svg{flex:none;margin-top:2px}
table.dt{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:12px}
table.dt th,table.dt td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left}
table.dt th{color:var(--ink);font-weight:700}
table.dt th.n,table.dt td.n{text-align:right}
table.dt td.n{font-variant-numeric:tabular-nums}
table.dt tr.sel td{background:#F2F7F4;font-weight:600;color:var(--ink)}
.scroll-x{overflow-x:auto}

/* regional maps */
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mapbox .legend{justify-content:flex-start;align-items:flex-start;gap:7px 14px;margin-top:10px}
.map-cap{margin:9px 0 0;font-size:12.5px;color:var(--ink-3);line-height:1.5}
.map-cap span{display:block;margin-top:4px;color:#6B7A72}
.scale{display:flex;align-items:stretch;margin-top:12px;font-size:11.5px;color:var(--ink-3)}
.scale div{flex:1;text-align:center}
.scale div i{display:block;height:10px;margin-bottom:3px}
.scale div.on{color:var(--ink);font-weight:700}
.range-bars{display:grid;grid-template-columns:110px minmax(0,1fr) 150px;gap:10px 16px;align-items:center;margin-top:8px;font-size:13.5px}
.range-bars .pw{color:var(--ink);font-weight:600}
.range-bars .pw.sel{color:var(--brand-green-dk)}
.range-bars .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.range-bars .track{position:relative;height:22px}

/* save + actions */
.save-box{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:22px;padding:16px 18px;border:1.5px solid var(--brand-green-dk);border-radius:var(--radius);background:var(--tint)}
.save-box .txt{flex:1 1 320px;font-size:14px;color:var(--ink-2)}
.save-box .txt b{display:block;color:var(--ink);font-size:16px;margin-bottom:2px}
.save-box .btns{display:flex;gap:10px;flex-wrap:wrap}
.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;margin-top:20px;gap:12px}
.actions .back{margin-right:auto}
.btn{background:var(--brand-green-dk);color:#fff;border:0;border-radius:9px;padding:14px 26px;font-size:16px;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:11px;text-decoration:none;cursor:pointer}
.btn:hover{background:#0b4a33}
.btn.wide{flex:1;justify-content:center}
.btn.ghost{background:#fff;color:var(--brand-green-dk);border:1px solid var(--line);font-weight:600;padding:10px 16px;font-size:14px}

/* info-layer sheet */
.modal{background:var(--surface);border-radius:14px;box-shadow:0 18px 50px rgba(11,59,84,.28);padding:26px 30px 28px;position:relative}
.modal h2{margin:0 0 4px;font-size:23px;color:var(--ink);letter-spacing:-.3px;padding-right:36px}
.modal .lede{margin:0 0 14px;font-size:15px;color:var(--ink-2)}
.modal .x{position:absolute;top:16px;right:18px;border:0;background:none;font-size:23px;line-height:1;color:var(--ink-3);padding:4px 8px;border-radius:7px;font-family:inherit;cursor:pointer}
.tipbox{background:var(--ink);color:#fff;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.45;box-shadow:0 9px 24px rgba(11,59,84,.24)}

@media(max-width:900px){
  .page{padding:0}
  .app{border-radius:0;border:0}
  .hdr{flex-wrap:wrap;padding:10px 16px;gap:10px}
  .hdr-link{margin-left:auto}
  .stepbar{order:3;flex:1 0 100%;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto}
  .stepbar .st:not(.on) .lbl{display:none}
  .stepbar .sep{display:none}
  .strip{justify-content:flex-start;padding:6px 16px}
  .content{padding:20px 16px 28px}
  .title-ico{display:none}
  .body{margin-left:0}
  .tiles,.tiles.tiles-2,.maprow,.about-row,.picker{grid-template-columns:1fr}
  .info-actions{grid-template-columns:1fr 1fr}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .driver{grid-template-columns:1fr}
  .range-bars{grid-template-columns:90px minmax(0,1fr)}
  .range-bars .v{grid-column:1/-1;text-align:left;margin-top:-6px}
}


.main{display:block;min-height:660px}.content{width:100%}.app{margin:20px auto}
button.st,button.hdr-link,.strip button{font-family:inherit;cursor:pointer}
button.st{border:0;background:none}.strip button{border:0;background:none;color:var(--ink-3);padding:4px 9px;border-radius:6px;font-size:13px}
.strip button.use{background:var(--tint);color:var(--ink)}.strip button.ssp.use{background:#E6EFF6}
.strip button:hover{text-decoration:underline}.strip button:focus-visible{outline:2px solid var(--link)}
.driver .range-wrap{min-width:0}.driver .dval{min-width:0}.driver .more{grid-column:1/-1}
.info-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:none;padding:0}
.info-actions details{min-width:0}.fold>summary{font-size:14px!important;color:var(--link)!important;margin:0!important}
.fold{margin:10px 0}.fold .dt{font-size:13px}.fold-body{overflow-x:auto}
.climate-region{cursor:pointer;stroke:#fff;stroke-width:.35}.climate-region:focus{stroke:var(--ink);stroke-width:1;outline:none}
.mapbox{min-width:0}.mapbox svg{height:350px!important}.mapbig svg{height:420px!important}
.modal{max-width:min(900px,94vw)}.dt-wrap{overflow-x:auto}.help-row{display:block}.help-row>.fold{width:100%}
@media(max-width:900px){.app{margin:0}.driver{grid-template-columns:1fr}.driver .dval{text-align:left}.info-actions{grid-template-columns:1fr}.mapbox svg{height:300px!important}}


/* Navigation and outcome export follow africa-prototype.html. */
.actions{flex-wrap:wrap}.actions .back{margin-right:auto}
.btn.back{background:#fff;color:var(--brand-green-dk);border:1px solid var(--line)}
.btn.wide{flex:1;justify-content:center}
.save-box{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:22px;padding:16px 18px;border:1.5px solid var(--brand-green-dk);border-radius:var(--radius);background:var(--tint)}
.save-box .txt{flex:1 1 280px;font-size:14px;color:var(--ink-2)}
.save-box .txt b{display:block;color:var(--ink);font-size:16px;margin-bottom:2px}
.save-box .btns{display:flex;gap:10px;flex-wrap:wrap}
.btn.ghost{background:#fff;color:var(--brand-green-dk);border:1px solid var(--line);font-weight:600;padding:10px 16px;font-size:14px}
#report{display:none}
@media(max-width:600px){.actions .btn,.save-box .btns,.save-box .btn{width:100%}.actions .btn{justify-content:center}}

</style>

/* ===========================================================================
   COLOMBIA — SCREEN 5 ENERGY / AIR-POLLUTION / HEALTH PROTOTYPE.

   Observed anchors:
   - UPME, Balance Energético Colombiano 2023: final energy 1,528,901 TJ;
     grid electricity plus auto/cogeneration 271,541 TJ = 17.76% of final
     energy. Hydro + wind + solar supply 220,470 TJ of 288,418 TJ electricity
     products = 76.44% low-emission generation.
   - WHO GHO AIR_41, Colombia, both sexes, all causes, 2021: 15,741 ambient
     air-pollution-attributable deaths (11,051–20,348).
   - World Bank EN.ATM.PM25.MC.M3, 2023: 18.3566 µg/m³ population-weighted
     annual PM2.5 exposure.

   Prototype transformations (not a Colombia IAM run): GDP affects total final
   energy through Colombia's own sourced income elasticity of 0.64 applied to
   income per head, with the SSP population path carried alongside it (COL_DEMAND,
   2026-09-02; the earlier unsourced 1.3%/yr efficiency offset is gone for Colombia
   and retained for every other country); electrification splits final
   energy between electricity and direct fuels; the clean-generation control
   changes electricity emissions intensity. Corrected 2026-10-17 — this paragraph
   still described the placeholders retired on 2026-09-01. For Colombia the health
   response is a concentration-response on the 33.8% of ambient PM2.5 apportioned to
   the controlled sources (COL_HEALTH.ambient); other profiles keep the index proxy
   applied to an unsourced 35% of the burden. Monetary benefits use a VSL of
   USD 1.668m (2025 prices), range 1.21m-7.811m (COL_HEALTH.valuation).
   =========================================================================== */
/* ===========================================================================
   COLOMBIA POWER SECTOR — observed anchors for the electricity panel on screen 4.
   Added 2026-09-01 at Per's instruction ("using 2024 for now").

   EVERY value here is Colombian. Nothing is transferred from another country, and
   the panel that reads this block is gated on COUNTRY.isColombia() so these values
   can never be applied to one of the other profiles in this file.

   FACTORS AND MIX — Ember, Yearly Electricity Data full release, downloaded
   2026-09-01 and filtered locally to Colombia; extract committed at
   02_literature/data/ember_colombia_power/. Data year 2024, the last complete year.
   Blended from Ember's own per-fuel generation and per-fuel power-sector emissions:
     fossil       coal 875.1, gas 641.7, other fossil 659.0  -> 719.4 gCO2e/kWh
     low-emission hydro 23.7, solar 46.6, bioenergy 216.2    ->  32.9 gCO2e/kWh
   Recombining these at the 2024 share reproduces Ember's published Colombian grid
   intensity of 298.3 gCO2e/kWh exactly, so nothing is fitted or assumed.
   Ember states these are full life-cycle CO2-equivalent despite the gCO2 labelling.

   HYDROLOGY: the two factors are stable year to year, the SHARE is not — 61.3% in
   2024 against 77.0% in 2025, because the grid is hydro-dominated and 2024 was dry.
   A single-year anchor inherits that year's weather. A multi-year average is the
   obvious alternative and has NOT been decided.

   UPME BECO 2024 labels its 299,493.3 TJ electricity column EE SIN (grid)
   and reports AUT COG separately. Ember's 89.14 TWh is national gross
   generation from its EIA/XM source chain. Equal coverage has not been
   established, so the totals are not averaged and the EE SIN ratio is not
   used to gross up Ember's generation. UPME supplies the national total-final-
   energy and delivered-electricity shares used as normalized policy indices;
   Ember supplies the power volume, mix and life-cycle CO2e anchor. See the
   2026-10-12 power method note. The backup and decentralized-generation check
   supplies no matched 2024 GWh series; no separate block is added, and this
   does not establish that uncounted generation is zero.
   =========================================================================== */
const COL_POWER = {
  anchorYear:2024,
  mix2024:0.6134,             /* low-carbon share of generation, Ember 2024 */
  efFossil:0.7194,            /* kg CO2e per kWh, blended fossil, Ember 2024 */
  efLow:0.0329,               /* kg CO2e per kWh, blended low-emission, Ember 2024 */
  finalEnergy2024TJ:1498690.45465,  /* BECO 2024, primary + secondary final energy */
  finalElectricity2024TJ:282639.80019, /* BECO EE SIN + AUT COG final electricity */
  gen2024TWh:89.14, intensity2024:298.3,

  /* --- LAYER 2, added 2026-09-01 --------------------------------------------
     Per-source life-cycle factors, kg CO2e/kWh, and each source's share WITHIN
     its group in the anchor year. Layer 1 sets how big each group is; layer 2
     sets the split inside it, so the two multiply and can never conflict.
     FACTORS: derived from Ember's own Colombian per-fuel generation and per-fuel
     power-sector emissions, 2024, except wind (see below). Ember documents hydro,
     solar, bioenergy and other fossil as global IPCC AR5 midpoint life-cycle
     values (24 / 48 / 230 / 700 g/kWh net, adjusted 1% non-thermal and 6% thermal
     for gross reporting); coal and gas are country-level.
     WIND is the one exception and is NOT derived here: Colombia generated only
     0.15 TWh in 2024, so Ember's emissions for it round to zero and no factor can
     be recovered from Colombian rows. 7.8 g CO2e/kWh is the UNECE Latin America
     regional factor, chosen by Per on 2026-09-01 as the report's recommended
     default. Evidence, sources and the alternative Colombia-specific project value
     of 12.93 g CO2e/kWh (La Guajira, Vélez-Henao and Font Vivanco 2021) are in
     02_literature/data/wind_emission_factors/README.md. The two have different
     system boundaries and that package says to expose them as alternatives rather
     than average them; only the regional default is wired in so far.
     CHECK: these shares and factors recombine to 298.3 g CO2e/kWh, Ember's
     published Colombian grid intensity for 2024. */
  ef:{Hydro:0.0237, Solar:0.0466, Bioenergy:0.2162, Wind:0.0078,
      Gas:0.6417, Coal:0.8751, "Other fossil":0.6590},
  efNote:{Wind:"UNECE Latin America regional factor — not derivable from Colombian data"},
  groups:{low:["Hydro","Solar","Bioenergy","Wind"], fossil:["Gas","Coal","Other fossil"]},
  within:{ low:{Hydro:89.3928, Solar:6.2729, Bioenergy:4.0600, Wind:0.2743},
           fossil:{Gas:57.4289, Coal:32.5305, "Other fossil":10.0406} },

  /* --- AIR POLLUTANTS, added 2026-09-01 -------------------------------------
     Grams per GIGAJOULE OF FUEL BURNED. EMEP/EEA air pollutant emission inventory
     guidebook 2023, chapter 1.A.1 (public electricity and heat production), Tier 1
     default factors. These are combustion emissions, not life-cycle: hydro, solar
     and wind burn nothing and are zero here. That is the right treatment for the
     ambient exposure the health screen models, and the wrong one for a life-cycle
     question — the carbon factors above are life-cycle and these are not.
     WHY THESE ARE NOT THE CARBON FACTORS. The two rank differently, and not by a
     little: biomass is 133 g of fine particulates per GJ against hard coal's 3.4,
     roughly 39 times worse, while for carbon it looks the better of the two. Reusing
     the carbon factors here would have shown burning more biomass as improving
     health. Fuel mapping: Ember's "Other fossil" is matched to the guidebook's heavy
     fuel oil, the closest power-generation entry; that is a judgement, not a lookup.
     CONVERSION. Per kilowatt-hour of electricity = g/GJ x 3.6 / thermal efficiency.
     thermalEfficiency is Colombia's own, from one BECO 2024 row so no boundary is
     crossed: 88,130.8 TJ of electricity out of CT Centrales Térmicas against
     115,585.2 coal + 120,161.7 gas + 5,989.2 diesel + 842.3 fuel oil TJ in.
     LIMIT: it is an AGGREGATE thermal efficiency. BECO pools the output of all
     thermal plants into one line, so coal and gas cannot be separated. Splitting it
     with Ember's per-fuel generation was rejected: Ember and BECO disagree about the
     hydro/thermal split by 10-40%, and that error would land straight in the
     coal-versus-gas ratio this control exists to show. Using one efficiency
     understates gas and overstates coal, compressing the real difference. */
  thermalEfficiency:0.363,
  pollutantGJ:{ Coal:{PM25:3.4, NOx:209}, Gas:{PM25:0.14, NOx:89},
                "Other fossil":{PM25:19.3, NOx:142}, Bioenergy:{PM25:133, NOx:81},
                Hydro:{PM25:0, NOx:0}, Solar:{PM25:0, NOx:0}, Wind:{PM25:0, NOx:0} }
};

/* ===========================================================================
   COLOMBIA ENERGY-INCOME ELASTICITY. Added 2026-09-02.

   SOURCE, AND IT IS COLOMBIAN. Patino, Padilla, Alcantara and Raymond (2020),
   "The Relationship of Energy and CO2 Emissions with GDP per Capita in Colombia",
   Atmosphere 11(8), 778, doi:10.3390/atmos11080778. TABLE 3 (long run), Model 1,
   p. 10: the income elasticity of PRIMARY ENERGY PER CAPITA with respect to gross
   domestic product per capita is 0.64, standard error 0.14, significant at 1%.
   Table 2 gives the short run, 0.22 (standard error 0.06). Partial adjustment
   model estimated by seemingly unrelated regression equations, Colombian data
   1971-2017, International Energy Agency sources, adjusted R-squared 0.82.
   Copy committed at 02_literature/Carbon emissions decoupling growth/. Full
   derivation: 03_models/2026-09-02_colombia-energy-income-elasticity.md.

   Screen 5 uses the long-run figure for its 2050 horizon. That is a modelling
   choice conditional on a stable relationship across the source-method break.

   NOTE THE PAPER'S OWN TEXT SAYS "0.6". Table 3 says 0.64; the running text on
   p. 10 rounds. The table value is used here.

   WHY A SINGLE CONSTANT IS LEGITIMATE HERE. The paper REJECTS the environmental
   Kuznets curve - the squared income term is insignificant (Table 1, p. 9) - so
   the elasticity does not vary with income and a constant-elasticity form is the
   specification the data supports. Had the curve held, B would have been a
   function of income and no single number would exist.

   THE UNCERTAINTY IS REAL AND WIDE: 95% interval 0.37 to 0.91, which is about
   +/-20% on 2050 energy demand - larger than several of the sliders on screen 2.
   Carried here as ciLow/ciHigh so the interface can show it rather than assert a
   point estimate.

   WHAT THIS REPLACED, AND WHY IT IS NOT ADDED TO IT. The previous form was
   (1 + (g - 1.3%))^n: an UNSOURCED 1.3%/yr efficiency offset subtracted from the
   growth slider, an implicit income elasticity of 1.0 on TOTAL gross domestic
   product, and no population term at all. A sourced elasticity below 1 already
   embodies the historical decoupling the 1.3% was standing in for, so applying
   both would double-count it. The offset is therefore GONE for Colombia. It
   remains for every other country, which has no elasticity of its own here.

   BOUNDARY CAVEAT, STATED BECAUSE IT IS THE WEAKEST POINT. Patino et al. model
   PRIMARY energy; this model scales FINAL energy. They differ by the
   transformation sector. Screen 4 now uses Burke and Csereklyei (2016)
   Table 5's ten-year, within-country, total-primary-energy 0.48 coefficient
   at the historical sample mean. This also crosses the primary/final boundary,
   but its horizon and estimation sample differ from Patiño's 0.64 long-run
   Colombian estimate. See 03_models/2026-10-12_colombia-screen4-decadal-income-response.md.
   The screen 5 info panel names this alternative without treating the two
   coefficients as estimates of the same parameter. */

          structure and total deaths cancel in that ratio, which is why an observed burden can be

          to its power term and has no separate generator-exhaust term. The source of new household

          unresolved.</span></div></li>
        <li><div class="ico">6</div><div><b>What this pathway does not carry</b>
          <span>Deaths only. Illness that does not kill — hospital admissions, lost working days —
          is left out entirely rather than estimated from a single ratio. It is not negligible:
          published World Bank estimates put morbidity at roughly a seventh of total health cost.
          The figure here is a floor.</span></div></li>
      </ul>
      <div class="paperrow"><span aria-hidden="true">🗄️</span> <span class="lbl2">Household burden:</span>
        World Health Organization Global Health Observatory, indicator AIR_11, ${name}, ${hh.year}.
        Committed at <code>02_literature/data/colombia_air_pollution/</code>.
        <a class="paper" href="https://www.who.int/data/gho" target="_blank"
           rel="noopener noreferrer" title="Opens the WHO Global Health Observatory in a new tab">who.int/data/gho ↗</a></div>
      <div class="paperrow"><span aria-hidden="true">🗄️</span> <span class="lbl2">Joint effects:</span>
        Same source, indicator AIR_35 — the combined burden with the overlap removed.
        <a class="paper" href="https://www.who.int/data/gho" target="_blank"
           rel="noopener noreferrer" title="Opens the WHO Global Health Observatory in a new tab">who.int/data/gho ↗</a></div>
      <div class="paperrow"><span aria-hidden="true">📄</span> <span class="lbl2">Valuation:</span>
        Viscusi, W.K. and Masterman, C.J. (2017), "Income Elasticities and Global Values of a
        Statistical Life", <i>Journal of Benefit-Cost Analysis</i> 8(2), 226–250. Table 7 gives
        ${name} a benefit-transferred value of US$1.228m at an income elasticity of 1.0.
        <a class="paper" href="https://doi.org/10.1017/bca.2017.12" target="_blank"
           rel="noopener noreferrer" title="Opens the paper in a new tab">doi.org/10.1017/bca.2017.12 ↗</a></div>`;
    },
    note:`<b>A burden that falls, not deaths prevented one by one.</b> These are statistical lives
      across a population, attributed to an exposure — not identifiable people, and not a forecast
      of what {country} will do.`
  },
  /* Transparency panel for the per-source mix control (layer 2), 2026-09-01. */
  sourceMix:{
    title:"Choosing which sources grow, and which are phased out",
    lede:"The slider above sets how much of {country}'s electricity is low-emission in 2050. This "
      +"second layer sets the split inside each group. It is optional: leave it alone and the mix "

    body:()=>sourceMixChain({slider:"The slider above",sliderLc:"the slider above",here:"here"})
      +sourceMixTable()+sourceMixPapers(),
    note:`<b>The split is a choice, not a forecast.</b> Nothing here says {country} will build these
