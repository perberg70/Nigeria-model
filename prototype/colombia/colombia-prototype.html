     Residential energy tracks the demand index because its share of final energy is
     held fixed (Per's specification). Residential electrification then displaces
     residential fuel, and firewood is the polluting part of it.

     THE ONE ASSUMPTION LEFT, AND IT IS NOT SOURCED. How economy-wide electrification
     maps onto the RESIDENTIAL sector. Two unsourced candidates:
       equal percentage points  residential rises by the same points as the economy
       proportional             residential rises by the same RATIO as the economy
     Equal percentage points is used, as the more conservative of the two: proportional
     privileges sectors that are already electrified, and residential at 31% is well
     above the economy's 17.8%, so proportional would saturate it early and overstate
     the health gain. Per flagged proportional as "easy but perhaps not correct", and
     this is the open question a design memo is to settle.
     [GAP: neither mapping is sourced. Closing it needs the BECO sector-by-carrier
     matrix - today's electric share within transport and within industry - which this
     repository does not hold.]

     [GAP: the carrier split is 2015 and the sector share 2023. Natural-gas
     massification has displaced firewood over that period, so the 46% is likely to
     overstate today's firewood share, and with it the household burden.]

     [GAP: residential energy grows here at the economy-wide elasticity of 0.64.
     Burke and Csereklyei (2016) put residential energy at 0.44 and residential solid
     biofuel at MINUS 0.67 - firewood is an inferior good, falling as households get
     richer. Both are cross-sectional transfers, not applied without permission. The
     model therefore overstates firewood growth on the baseline.] */
  residentialFirewoodIndex(year,elecTarget){
    const e0=this.healthData().energy.currentElectrification/100;
    const et=this.energyShareAt(year,elecTarget);
    /* residential electric share, moving point-for-point with the economy's */
    const resElec=Math.min(1,Math.max(0,COL_RESIDENTIAL.electricity+(et-e0)));
    const fuel0=1-COL_RESIDENTIAL.electricity;
    /* Firewood keeps its share of whatever residential fuel remains, so the index is
       just the surviving fuel fraction times the demand index. */
    return this.energyScaleAt(year)*(1-resElec)/fuel0; },
  householdDeathsAt(year){
    if(!this.isColombia()) return null;
    return COL_HEALTH.household.deaths*this.popFactor(COL_DEMAND.baseYear)
         * this.residentialFirewoodIndex(year,state.drivers.elec); },
  householdAvoidedAt(year){
    if(!this.isColombia()) return null;
    const base=COL_HEALTH.household.deaths*this.popFactor(COL_DEMAND.baseYear);
    const ref=this.residentialFirewoodIndex(year,this.healthData().energy.referenceElectrification2050);
    const pol=this.residentialFirewoodIndex(year,state.drivers.elec);
    return base*(ref-pol); },
  /* CONCENTRATION-RESPONSE CHAIN, Colombia. Follows TRA420 docs/air_pollution.md:
       1  emission ratio r        = this year's emissions over the anchor year's
       2  concentration change    dC = C_base x sum over drivers of s_i (r_i - 1)
       3  slope                   beta = ln(RR) / reference delta
       4  mortality response      dm = exp(beta x dC) - 1
       5  deaths                  D = D_baseline x (1 + dm)
     Two drivers, each with its own share of ambient PM2.5 and its own ratio:
     the generation mix moves the energy sector, electrification moves direct fuel
     combustion. `power` and `direct` from energyComponents ARE those ratios --
     power is generation volume times pollutant intensity relative to the anchor,
     direct is fuel burned outside the power sector relative to the anchor.

     THIS RETIRES THE CLAMP. The old index was linear in intensity and calibrated for
     a proxy bounded at 0.08-1; fed a real pollutant ratio it returned more avoided
     deaths than Colombia's entire attributable burden, and a clamp held it in. The
     exponential form needs no clamp: you can only remove the pollution that is there,
     so dC has a natural floor of -C_base x (sEnergy + sDirect) = -7.2 ug/m3, which
     caps the reduction at about 5.4% of the burden. The bound now comes from the
     arithmetic instead of from a guard. */
  /* Attributable fraction at a concentration: the share of deaths caused by exposure.
     AF = (RR-1)/RR, with RR = 1.08^((C - TMREL)/10). */
  attributableFraction(conc,tmrel){
    const A=COL_HEALTH.ambient;
    const excess=Math.max(0,conc-tmrel);
    const rr=Math.pow(A.relativeRisk,excess/A.referenceDelta);
    return (rr-1)/rr; },
  ambientResponse(year,elecTarget,cleanTarget,usePins){
    const A=COL_HEALTH.ambient;
    const c=this.energyComponents(year,elecTarget,cleanTarget,usePins);
    const dC=A.baselineConc*(A.sEnergy*(c.power-1) + A.sDirect*(c.direct-1));
    const beta=Math.log(A.relativeRisk)/A.referenceDelta;
    /* VALIDITY. Concentration is scaled LINEARLY with the emission ratio, which is
       sound for moderate change and fails for large change: real secondary particulate
       formation is non-linear in its precursors. There is a natural floor — you can
       only remove the pollution that is there, so dC >= -C x (sEnergy+sDirect) =
       -7.2 ug/m3, capping any reduction at 5.4% of the burden — but no ceiling.
       An all-bioenergy grid at full electrification produces dC of about +310 ug/m3,
       fifteen times Colombia's entire current concentration, from a sector that is
       4.6% of it. That is not a result, it is the method past its limit.
       The line is drawn where the change exceeds the whole observed concentration:
       |dC| > C_base. Not a tuned constant — beyond that point "scale the observed
       concentration" has certainly failed, and the screen says so instead of printing
       a number. */
    /* CORRECTED 2026-09-01. Deaths were previously burden x (1 + exp(beta x dC) - 1),
       which multiplies WHO's ATTRIBUTABLE burden by a MARGINAL change in risk. Those
       are not compatible quantities: the 15,741 is the output of an exposure-response
       curve integrated from the counterfactual up to today's concentration, and the
       marginal slope cannot stand in for that integral. It understated the ambient
       effect about 7.5-fold — the largest possible energy-related reduction read as
       849 deaths where the correct form gives roughly 6,400.
       The burden is now rescaled by the attributable fraction at each concentration:
       deaths(C) = burden x AF(C_new) / AF(C_base). Population, age structure and total
       deaths cancel in the ratio, which is why an observed burden can be rescaled
       without knowing any of them.
       NATURAL FLOOR: concentration cannot fall below the counterfactual, so C_new is
       held at TMREL. Beyond that point no further deaths can be avoided, which is a
       more principled limit than the guard below and comes from the same source.
       See 03_models/2026-09-01_ambient-response-correction.md. */
    const cNew=Math.max(A.tmrel, A.baselineConc+dC);
    const ratioAt=t=>{ const base=this.attributableFraction(A.baselineConc,t);
      return base>0 ? this.attributableFraction(Math.max(t,A.baselineConc+dC),t)/base : 1; };
    return {rPower:c.power, rDirect:c.direct, dC, beta, cNew,
            dm:Math.exp(beta*dC)-1,            /* kept for the decomposition chart only */
            ratio:ratioAt(A.tmrel), ratioTmrelLow:ratioAt(A.tmrelLow),
            ratioTmrelHigh:ratioAt(A.tmrelHigh),
            valid:Math.abs(dC)<=A.baselineConc}; },
  healthAt(year){
    const h=this.healthData(), e=h.energy, a=h.air;
    const ref=this.energyComponents(year,e.referenceElectrification2050,e.referenceCleanShare2050,false);
    const policy=this.energyComponents(year,state.drivers.elec,state.drivers.mix,true);
    if(this.isColombia()){
      const R=this.ambientResponse(year,e.referenceElectrification2050,e.referenceCleanShare2050,false);
      const P=this.ambientResponse(year,state.drivers.elec,state.drivers.mix,true);
      /* The burden is a count of people, so it scales with the population exposed as
         well as with concentration. Both sides carry the same factor, so the DIFFERENCE
         the screen reports scales with it too. */
      const pf=this.popFactor(year);
      const refDeaths=a.whoDeaths*R.ratio*pf, policyDeaths=a.whoDeaths*P.ratio*pf;
      const avoided=refDeaths-policyDeaths;
      /* The counterfactual is published as a range, so the result is too. A LOWER
         counterfactual means more of the burden is attributed at every concentration,
         which makes a given reduction a SMALLER share of it — so tmrelLow gives the
         smaller effect. Parameter range, not a confidence interval. */
      const avoidedLow=a.whoDeaths*(R.ratioTmrelLow-P.ratioTmrelLow)*pf;
      const avoidedHigh=a.whoDeaths*(R.ratioTmrelHigh-P.ratioTmrelHigh)*pf;
      return {year,ref,policy,avoided,avoidedLow,avoidedHigh,
              refDeaths,policyDeaths,response:{ref:R,policy:P},
              valid:R.valid&&P.valid,
              valueBn:avoided*h.valuation.vsl/1e9};
    }
    /* Every other country keeps the original index proxy: it has no apportionment,
       no baseline concentration and no pollutant factors of its own, and Colombia's
       must not be transferred. */
    const avoided=a.whoDeaths*a.energyResponsiveShare*(ref.index-policy.index);
    const refDeaths=a.whoDeaths*(1+a.energyResponsiveShare*(ref.index-1));
    return {year,ref,policy,avoided,refDeaths,policyDeaths:refDeaths-avoided,
            valueBn:avoided*h.valuation.vsl/1e9};
  },
  /* --- WHAT MOVES THE AMBIENT DEATH FIGURE. Added 2026-09-02 --------------------
     Feeds the "this is one result" panel under the chart on screen 5. Everything is
     computed live from the user's own settings; nothing here is a stored number.

     COLOMBIA ONLY. The drivers it names - the source apportionment, the per-source
     pollutant factors, the published counterfactual - are Colombia's. No other
     country in this file has any of them, so the panel does not render for them. */

  /* Avoided deaths for a HYPOTHETICAL pair of targets, without touching state.
     Reproduces healthAt().avoided exactly: whoDeaths x (R.ratio - P.ratio) x popFactor. */
  ambientAvoidedFor(year,elecTarget,cleanTarget,usePins){
    const h=this.healthData(), e=h.energy, a=h.air;
    const R=this.ambientResponse(year,e.referenceElectrification2050,e.referenceCleanShare2050,false);
    const P=this.ambientResponse(year,elecTarget,cleanTarget,usePins);
    return a.whoDeaths*(R.ratio-P.ratio)*this.popFactor(year); },

  /* Evaluate fn() as if a per-source pin were set, then put the real one back.
     Synchronous, and restored in a finally so a throw cannot strand the pin. */
  probePinned(pins,fn){
    const saved=state.sourceMix;
    try { state.sourceMix=pins; return fn(); }
    finally { state.sourceMix=saved; } },

  /* Each source's share of GENERATION against its share of the power sector's
     emissions of one pollutant, at the observed anchor year. This is the comparison
     that makes bioenergy legible: tiny on the first, dominant on the second. */
  pollutantMixAnchor(pol){
    const P=COL_POWER, sh={}, em={}; let tot=0;
    P.groups.low.forEach(n=> sh[n]=P.mix2024*(P.within.low[n]/100));
    P.groups.fossil.forEach(n=> sh[n]=(1-P.mix2024)*(P.within.fossil[n]/100));
    for(const n in sh){ em[n]=sh[n]*this.pollutantEF(n,pol); tot+=em[n]; }
    return Object.keys(sh).map(n=>({name:n, gen:100*sh[n],
      share:tot>0?100*em[n]/tot:0, ef:this.pollutantEF(n,pol)*1000}))
      .sort((x,y)=>y.share-x.share); },

  /* The ranked drivers themselves. Each entry is a low/high pair around the figure
     actually on screen, so the panel can say which uncertainties dominate rather
     than listing them as though they were comparable. */
  ambientDrivers(year=2050){
    if(!this.isColombia()) return null;
    const h=this.healthData(), a=h.air, A=COL_HEALTH.ambient;
    const now=this.healthAt(year), c=now.avoided;
    const el=state.drivers.elec, mx=state.drivers.mix;
    const bioPin=this.probePinned({low:{Bioenergy:0.5}},
      ()=>this.ambientAvoidedFor(year,el,mx,true));
    return {
      year, central:c,
      /* Which low-emission sources grow. The default within-group split holds
         bioenergy at its observed share of low-emission generation, so raising the
         low-emission target raises bioenergy with it. */
      bioenergy:{ pinnedLow:bioPin, delta:bioPin-c,
        mixAt50:this.ambientAvoidedFor(year,el,50,true),
        mixAt100:this.ambientAvoidedFor(year,el,100,true) },
      /* Which lever. The apportionment weights say direct fuels carry 6.3x the
         power sector, and the sliders show it. */
      levers:{ elecLow:this.ambientAvoidedFor(year,10,mx,true),
               elecHigh:this.ambientAvoidedFor(year,100,mx,true),
               weightPower:A.sEnergy, weightDirect:A.sDirect,
               weightRatio:A.sDirect/A.sEnergy },
      /* The burden being rescaled, and where clean air is defined. */
      burden:{ low:c*a.whoLow/a.whoDeaths, high:c*a.whoHigh/a.whoDeaths },
      counterfactual:{ low:now.avoidedLow, high:now.avoidedHigh },
      valid:now.valid }; },

  healthDecomposition(year=2050){
    const e=this.healthData().energy;
    const ref=this.energyComponents(year,e.referenceElectrification2050,e.referenceCleanShare2050,false);
    const policy=this.energyComponents(year,state.drivers.elec,state.drivers.mix,true);
    /* Weights match the apportionment, as in energyComponents. This decomposes the
       DRIVERS linearly while the response itself is log-linear — an approximation,
       and a close one: beta x dC never exceeds about 0.06 here, where exp(x)-1 and x
       agree to within 2%. */
    const wP=this.isColombia()?0.136:0.35, wD=1-wP;
    const direct=wD*(ref.direct-policy.direct);
    const demand=wP*(policy.electricity-ref.electricity)*ref.intensity;
    const mix=wP*policy.electricity*(ref.intensity-policy.intensity);
    /* wP and wD are returned so the panel that explains these bars states the weights
       actually used rather than a pair written before the apportionment was derived. */
    return {direct,mix,demand,net:direct+mix-demand,wP,wD};
  },
  /* Every country now reads its own CCKP national figures. The previous version
     took Colombia's numbers and multiplied them by a per-country `climate`
     factor with a per-pathway `severity` fudge — an unmarked transfer of one
     country's climate onto another's name, which AGENTS.md forbids and which
     is unnecessary now the real values exist for all twelve. */
  climateFor(path=this.pathway()){
    return (NATIONAL_CLIMATE[DATA.country.iso]||{})[path] || null;
  },
  climate(){ return this.climateFor(); },
  /* Every country now has a region scheme — its own documented one. */
  regionClimate(path=this.pathway()){
    const c=REGION_CLIMATE[DATA.country.iso]; const r=c&&c[path];
    return (r&&r.length)?r:null;
  },
  /* The admin-1 units inside one region, with their own CCKP medians. This is
     the second layer africa-prototype opens when a region is clicked. */
  unitsIn(region, path=this.pathway()){
    const rows=UNIT_CLIMATE.rows[DATA.country.iso]||[];
    const i=2+2*UNIT_CLIMATE.pathways.indexOf(path);
    return rows.filter(r=>r[1]===region).map(r=>({name:r[0], temp:r[i], rain:r[i+1]}));
  },
  observedSeries(){
    if(this.isColombia()){
      const years=Object.keys(COL_DATA.observed).map(Number).sort((a,b)=>a-b);
      return {years,values:years.map(y=>COL_DATA.observed[y]),kind:"observed"};
    }
    const p=this.profile(),years=[2005,2010,2015,2020,2024],f=[0,.35,.65,.75,1];
    return {years,values:f.map(x=>p.em2005+(p.em2024-p.em2005)*x),kind:"illustrative"};
  },
  /* Map cells now carry the region's own CCKP value, not the national figure
     times a hand-set multiplier. Position (x,y) still comes from the profile —
     that is map geometry, not climate. Colour ramps by rank within the pathway
     so the strongest region reads darkest whatever the absolute values are;
     the number is printed on every cell, so colour is never the only cue. */
  /* Regions with their map position attached. Colour and formatting are the
     panel's job, as in africa-prototype, so both metrics share one renderer. */
  regions(){
    const R=this.regionClimate(); if(!R) return [];
    const geom=REGION_GEOM[DATA.country.iso]||{};
    return R.map(r=>({...r, x:(geom[r.name]||[.5,.5])[0], y:(geom[r.name]||[.5,.5])[1]}));
  }
};

/* `tip` support added 2026-08-24, from africa-prototype. Screen 6's tiles were
   already passing a `tip` carrying the 10th-90th model range; this helper
   silently dropped it, so the range was unreachable. Hover AND keyboard focus,
   with the tip repeated into aria-label so it is not mouse-only. */
const tiles = arr => `<div class="tiles">${arr.map(t=>{
  const tip=t.tip?String(t.tip).replace(/"/g,"&quot;"):"";
  return `<div class="tile ${t.cls||(t.warn?'warn':'')} ${t.tip?'metric-tip':''}"${t.tip?` data-tip="${tip}" tabindex="0" aria-label="${T(t.lbl)}. ${tip}"
    onmousemove="showTT(event,this.dataset.tip)" onmouseleave="hideTT()"
    onfocus="showFocusTT(event,this.dataset.tip)" onblur="hideTT()"`:""}>${t.ico?`<div class="ico" aria-hidden="true">${t.ico}</div>`:""}<div class="lbl">${T(t.lbl)}${t.sub?`<small>${t.sub}</small>`:""}</div>
   <div class="val">${t.val}</div><div class="unit">${t.unit||""}</div></div>`;}).join("")}</div>`;

/* ---------- charts ---------- */
function lineChart(c){
  const W=980,L=52,R=18,Tp=14,B=42, iw=W-L-R, ih=264;
  const allYears=c.observed ? [...c.observed.years,...c.years] : c.years;
  const minYear=Math.min(...allYears), maxYear=Math.max(...allYears);
  const yMin=c.yMin||0;
  const xYear=yr=>L+iw*(yr-minYear)/(maxYear-minYear),
        y=v=>Tp+ih-ih*(Math.max(v,yMin)-yMin)/(c.yMax-yMin);
  const pts=(a,years=c.years)=>a.map((v,i)=>`${xYear(years[i])},${y(v)}`).join(" ");
  const rangeBand=c.range?`<polygon points="${pts(c.range.max)} ${pts(c.range.min.slice().reverse(),c.years.slice().reverse())}"
      fill="#7C8B94" opacity=".18"/>`:"";
  /* v2, 2026-08-24: split fill adopted from africa-prototype. The area between
     baseline and pathway is coloured per interval by its LOCAL sign — green
     where the pathway is below the baseline (emissions avoided), red where it
     is above (emissions added) — and an interval where the two lines cross is
     split at the linearly interpolated crossing point. A single net colour
     concealed crossings: a pathway that added emissions early and avoided them
     later rendered entirely green, which is the opposite of what the reader
     needs to see. Colour is not the only cue — the key below names each colour
     in words, and it appears only for the signs actually present. */
  const GREEN="#0A7A48", RED="#D93025", areaParts=[];
  let hasAvoided=false, hasIncreased=false;
  const n=c.years.length;
  const px=i=>xYear(c.years[i]);
  /* Tracks the largest green and largest red patch (by true shoelace area)
     and its centroid, so an "area" mark can point at the visual centre of
     real shaded area rather than a guessed position. Added 2026-08-28 with
     the callout marks below. */
  let bestGreen={area:0,cx:0,cy:0}, bestRed={area:0,cx:0,cy:0};
  const polyMetrics=P=>{
    let a=0,cx=0,cy=0;
    for(let i=0;i<P.length;i++){ const [x0,y0]=P[i],[x1,y1]=P[(i+1)%P.length], cr=x0*y1-x1*y0;
      a+=cr; cx+=(x0+x1)*cr; cy+=(y0+y1)*cr; }
    a/=2;
    if(Math.abs(a)<1e-6){ const m=P.length;
      return {area:0, cx:P.reduce((s,p)=>s+p[0],0)/m, cy:P.reduce((s,p)=>s+p[1],0)/m}; }
    return {area:Math.abs(a), cx:cx/(6*a), cy:cy/(6*a)};
  };
  const areaPoly=(pts,color)=>{
    areaParts.push(`<polygon class="emissions-area" points="${pts.map(p=>p.join(",")).join(" ")}" fill="${color}" opacity=".10"/>`);
    const m=polyMetrics(pts);
    if(color===GREEN && m.area>bestGreen.area) bestGreen=m;
    if(color===RED   && m.area>bestRed.area)   bestRed=m;
  };
  for(let i=0;i<n-1;i++){
    const b0=c.baseline[i], b1=c.baseline[i+1], p0=c.pathway[i], p1=c.pathway[i+1];
    const d0=p0-b0, d1=p1-b1;
    if(d0===0 && d1===0) continue;
    if(d0*d1<0){
      const t=-d0/(d1-d0), xc=px(i)+(px(i+1)-px(i))*t, cross=b0+(b1-b0)*t, yc=y(cross);
      areaPoly([[px(i),y(b0)],[xc,yc],[px(i),y(p0)]], d0<0?GREEN:RED);
      areaPoly([[xc,yc],[px(i+1),y(b1)],[px(i+1),y(p1)]], d1<0?GREEN:RED);
      hasAvoided ||= d0<0 || d1<0; hasIncreased ||= d0>0 || d1>0;
    }else{
      const d=d0!==0?d0:d1;
      areaPoly([[px(i),y(b0)],[px(i+1),y(b1)],[px(i+1),y(p1)],[px(i),y(p0)]], d<0?GREEN:RED);
      hasAvoided ||= d<0; hasIncreased ||= d>0;
    }
  }
  /* The key names whatever the chart is actually measuring. It said "emissions" on
     every chart until 2026-09-01, including the DEATHS chart on the health screen,
     where the shaded area is lives — not tonnes. Callers pass `fillNoun`; it falls
     back to "emissions" so the emissions charts are unchanged. */
  const noun=c.fillNoun||"emissions";
  const areaKey=`${hasAvoided?`<text x="${L+14}" y="${Tp+20}" style="font-size:13px;fill:${GREEN};font-weight:600">Green: ${noun} avoided</text>`:""}
    ${hasIncreased?`<text x="${L+14}" y="${Tp+(hasAvoided?38:20)}" style="font-size:13px;fill:${RED};font-weight:600">Red: ${noun} added</text>`:""}`;
  // Gridline spacing adapts to the range across all SSP pathways.
  const raw=(c.yMax-yMin)/6, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const stepY=Math.max(mag*[1,2,2.5,5,10].find(m=>mag*m>=raw), 1);
  const gridTicks=[];
  if(yMin<0 && Math.ceil(yMin/stepY)*stepY>=0) gridTicks.push(yMin);
  for(let v=Math.ceil(yMin/stepY)*stepY; v<=c.yMax; v+=stepY) gridTicks.push(v);
  let g="";
  for(const v of gridTicks){ g+=`<line class="gridline" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/>
    <text class="axtx" x="${L-10}" y="${y(v)+4}" text-anchor="end">${v}</text>`; }
  const tickYears=c.xTicks||c.years;
  const xt=tickYears.map(yr=>`<text class="axtx" x="${xYear(yr)}" y="${Tp+ih+22}" text-anchor="middle">${yr}</text>`).join("");
  const dots=c.years.map((yr,i)=>
    `<circle cx="${xYear(yr)}" cy="${y(c.pathway[i])}" r="9" fill="transparent"
       onmousemove="showTT(event,'<b>${yr}</b><br>Your pathway: ${c.pathway[i]} Mt<br>SSP baseline: ${c.baseline[i]} Mt${c.range?`<br>Model range: ${fmtN(c.range.min[i],1)}–${fmtN(c.range.max[i],1)} Mt`:""}')"
       onmouseleave="hideTT()"/>`).join("");
  /* Hover targets on the observed history, matched to africa-prototype 2026-09-01.
     Invisible by design: transparent, no visible marker, so the history still reads
     as one bare solid polyline in both files while every observed year can be
     queried for its value. */
  const observedDots=c.observed ? c.observed.years.map((yr,i)=>
    `<circle cx="${xYear(yr)}" cy="${y(c.observed.values[i])}" r="9" fill="transparent"
       onmousemove="showTT(event,'<b>${yr}</b><br>${c.observed.kind==="illustrative"?"Illustrative profile":"Observed"}: ${c.observed.values[i].toFixed(1)} Mt')"
       onmouseleave="hideTT()"/>`).join("") : "";
  /* Optional annotations, each a small callout box living BELOW the x-axis
     (in space the chart grows taller to fit) with a pointer reaching up into
     the plot — ported from africa-prototype 2026-08-28 so the two prototypes
     read as one design. An opaque box placed among the lines and shaded area
     would cover something for SOME combination of slider settings, so the
     box never overlaps the plot at all. Two anchor kinds:
       "year"  points at a specific year, on whichever curve — baseline or
               pathway — is lower there, so it stays correct even if a choice
               pushes the pathway above the baseline.
       "area"  points at the visual centre (shoelace centroid, via
               bestGreen/bestRed above) of the largest shaded patch whose
               colour matches the mark's own cls.
     Field names mirror the tile objects passed to tiles(), so the colour
     rules are the ones tiles() itself applies. NOTE: unlike africa, this
     file's tiles() has no unitCls, so a mark's unit line is always the
     muted grey the tiles use — the tile colouring here is carried by `cls`
     on the value alone, and that is preserved exactly. */
  let markSvg="", extraH=0;
  const marksIn=(c.marks||[]).filter(mk=>mk.kind!=="year" || c.years.indexOf(mk.year)>=0);
  if(marksIn.length){
    const wrap=(s,max)=>{ const words=String(s).split(" "); const lines=[]; let cur="";
      words.forEach(w=>{ const t=cur?cur+" "+w:w;
        if(t.length>max && cur){ lines.push(cur); cur=w; } else cur=t; });
      if(cur) lines.push(cur); return lines; };
    const isBad=s=>/bad|warn/.test(s||"");
    const built=marksIn.map(mk=>{
      const rows=[ [mk.lbl,10.5,600,"var(--ink-2)"],
        ...wrap(mk.sub,30).map(l=>[l,9,400,"var(--ink-3)"]),
        [mk.val,19,700, isBad(mk.cls)?"var(--danger)":"var(--brand-green-dk)"],
        ...wrap(mk.unit,30).map(l=>[l,9,400,"var(--ink-3)"]) ];
      // Text starts below a reserved icon zone at the top of the box.
      let relY=72; const relYs=[72];
      rows.forEach((r,i)=>{ if(i>0){ relY += r[1]>14 ? 24 : r[1]+3.5; relYs.push(relY); } });
      const bw=190, bh=relY+10;
      let ax,ay,dotColor,fullLine=false;
      if(mk.kind==="area"){
        const target=isBad(mk.cls)?bestRed:bestGreen, fallback=isBad(mk.cls)?bestGreen:bestRed;
        const pick = target.area>0 ? target : fallback.area>0 ? fallback : {cx:L+iw/2,cy:Tp+ih/2,area:0};
        ax=pick.cx; ay=pick.cy; dotColor = pick===bestRed ? RED : GREEN;
      }else{
        /* Anchor to the PATHWAY, which is the series whose number the callout
           reports. Until 2026-08-28 this anchored to whichever curve was lower
           — reasoning about where the dot would sit rather than what it
           identifies — so a pathway ABOVE its baseline put the dot on the grey
           baseline while the box quoted the green line's value. Reachable here:
           the mitigation slider's positive range does exactly that. */
        const mi=c.years.indexOf(mk.year);
        ax=xYear(mk.year);
        ay=y(c.pathway[mi]);
        dotColor="var(--brand-green-dk)";
        fullLine=true;
      }
      return {rows,relYs,bw,bh,ax,ay,dotColor,fullLine};
    });
    const gap=16, boxTop=Tp+ih+B+gap, hgap=18;
    let cursor=L+8;
    built.forEach(mkb=>{
      let left=Math.max(mkb.ax-mkb.bw/2, cursor);
      left=Math.min(left, W-R-mkb.bw);
      mkb.bx=left; cursor=left+mkb.bw+hgap;
    });
    extraH = gap + Math.max(...built.map(b=>b.bh)) + 12;
    markSvg = built.map(b=>{
      const cx=b.bx+b.bw/2;
      const rowsSvg=b.rows.map(([text,size,weight,color],i)=>
        `<text x="${b.bx+10}" y="${boxTop+b.relYs[i]}" style="font-size:${size}px;font-weight:${weight};fill:${color}">${text}</text>`).join("");
      return `${b.fullLine?`<line x1="${b.ax}" y1="${Tp}" x2="${b.ax}" y2="${b.ay}" stroke="var(--ink-3)" stroke-width="1.3" stroke-dasharray="3 4"/>`:""}
        <circle cx="${b.ax}" cy="${b.ay}" r="5" fill="${b.dotColor}" stroke="#fff" stroke-width="2"/>
        <line x1="${b.ax}" y1="${b.ay}" x2="${cx}" y2="${boxTop}" stroke="var(--ink-3)" stroke-width="1.2"/>
        <circle cx="${cx}" cy="${boxTop}" r="3" fill="var(--ink-3)"/>
        <rect x="${b.bx}" y="${boxTop}" width="${b.bw}" height="${b.bh}" rx="8" fill="var(--panel)" stroke="var(--line)"/>
        <circle cx="${b.bx+b.bw-30}" cy="${boxTop+30}" r="28" fill="var(--tint)"/>
        <text x="${b.bx+b.bw-30}" y="${boxTop+40}" text-anchor="middle" style="font-size:30px">🏭</text>
        ${rowsSvg}`;
    }).join("");
  }
  /* role="img" makes this SVG a leaf in the accessibility tree, so the
     callout <text> inside it is NOT announced — the figures that used to be
     readable HTML tiles would simply vanish for screen-reader users. Fold
     them into the accessible name instead, matching africa-prototype and the
     regional map below, which already puts its value in aria-label. Added
     2026-08-28 after a review finding. Quotes are stripped so a value
     containing one cannot break the attribute. */
  const a11y=[c.title, ...(c.range?[`SSP baseline median across ${c.range.models} model runs, with full model range shown; it may fall below zero`]:[]),
    ...(c.marks||[]).map(mk=>
      /* val before unit, because a mark's `val` may carry no unit of its own
         ("5.20" + "billion tonnes of carbon dioxide"); read in visual order
         they would be split by `sub` and announced apart. */
      [mk.lbl, mk.val, mk.unit, mk.sub].filter(Boolean).join(", "))]
    .join(". ")
    .replace(/[▲▼] ?/g,"")
    .replace(/\s+/g," ")
    .replace(/"/g,"&quot;")
    .trim();
  const H=Tp+ih+B+extraH;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${a11y}">
    ${g}<line class="axis" x1="${L}" y1="${Tp}" x2="${L}" y2="${Tp+ih}"/>
    <line class="axis" x1="${L}" y1="${Tp+ih}" x2="${W-R}" y2="${Tp+ih}"/>
    ${rangeBand}${areaParts.join("")}
    ${/* dotted, not solid: "Your pathway" is a solid 2.6 px stroke, and the
          prototypes rule forbids telling two series apart by colour alone;
          matches africa-prototype (Codex finding on PR #58, closed 2026-09-20) */""}
    ${c.observed?`<polyline points="${pts(c.observed.values,c.observed.years)}" fill="none" stroke="#253746" stroke-width="2.6" stroke-dasharray="0 5" stroke-linejoin="round" stroke-linecap="round"/>`:""}
    <polyline points="${pts(c.baseline)}" fill="none" stroke="#7C8B94" stroke-width="2" stroke-dasharray="8 6"/>
    <polyline points="${pts(c.pathway)}"  fill="none" stroke="var(--brand-green)" stroke-width="2.6"
       stroke-linejoin="round" stroke-linecap="round"/>
    ${c.hideSeriesLabel?"":`<text class="axtx" x="${W-R-8}" y="${Tp+8}" text-anchor="end" style="font-size:13px">${c.s1}</text>`}
    ${areaKey}
    ${xt}${observedDots}${dots}${markSvg}</svg>`;
}

const TERM_TIPS={"PM2.5":"Fine particulate matter no wider than 2.5 micrometres; it can travel deep into the lungs.","NO₂":"Nitrogen dioxide, mainly produced by fuel combustion.","O₃":"Ground-level ozone, formed when other pollutants react in sunlight.","SO₂":"Sulfur dioxide, produced when sulfur-containing fuels are burned."};
function barPanel(cats, vals, max, color, unit, series){
  const W=520,rowH=52,L=74,R=64, H=cats.length*rowH+52, iw=W-L-R;
  const x=v=>(iw*v)/max;
  const step=max/4; let ax="";
  for(let i=0;i<=4;i++){ const v=i*step;
    ax+=`<text class="axtx" x="${L+x(v)}" y="${H-16}" text-anchor="middle">${v.toLocaleString()}</text>`; }
  const bars=cats.map((c,i)=>{
    const w=Math.max(x(vals[i]),3), yy=18+i*rowH;
    return `<text class="catlbl" x="${L-14}" y="${yy+21}" text-anchor="end" data-pollutant="${c}" style="cursor:help">${c}</text>
      <rect class="bar" x="${L}" y="${yy+4}" width="${w}" height="26" rx="4" fill="${color}"
        onmousemove="showTT(event,'<b>${c}</b><br>${series}: ${vals[i].toLocaleString()}')" onmouseleave="hideTT()"/>
      <text class="barlbl" x="${L+w+10}" y="${yy+23}">${vals[i].toLocaleString()}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${series}">
    ${bars}<line class="axis" x1="${L}" y1="${H-34}" x2="${W-R}" y2="${H-34}"/>
    <line class="axis" x1="${L}" y1="18" x2="${L}" y2="${H-34}"/>${ax}
    <text class="axtx" x="${L+iw/2}" y="${H-1}" text-anchor="middle">${unit}</text></svg>`;
}

/* Country outlines are stored in the CONTINENTAL 760x709 coordinate space of the
   step-2 map, so a fixed 0 0 320 280 viewBox drew them off-panel. Fit the box to
   the selected country's own extent instead. */
function pathBBox(d){
  const n=(d.match(/-?\d+(?:\.\d+)?/g)||[]).map(Number);
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(let i=0;i+1<n.length;i+=2){
    x0=Math.min(x0,n[i]); x1=Math.max(x1,n[i]);
    y0=Math.min(y0,n[i+1]); y1=Math.max(y1,n[i+1]);
  }
  if(!isFinite(x0)) return [0,0,320,280];
  const pad=Math.max(x1-x0,y1-y0)*0.08;
  return [x0-pad, y0-pad, (x1-x0)+2*pad, (y1-y0)+2*pad];
}
/* The model produces ONE national mean per indicator, not a grid. The country is
   therefore filled with a single flat colour read off the legend, and the caption
   says so. A gradient fill here would imply spatial detail that does not exist. */
function mapPanel(m,mi){
  const stops=m.stops.map((s,i)=>
    `<rect x="0" y="${16+i*22}" width="17" height="22" fill="${s[1]}"
       stroke="${s[0]===m.band?'#0B3B54':'none'}" stroke-width="2"/>
     <text class="axtx" x="24" y="${16+i*22+15}"
       style="${s[0]===m.band?'font-weight:700;fill:#0B3B54':''}">${s[0]}</text>`).join("");
  const d = SOUTH_AMERICA[DATA.country.iso]?.d;
  const vb = d ? pathBBox(d).map(v=>v.toFixed(1)).join(" ") : "0 0 320 280";
  return `<div class="mapbox"><h4>${m.title}</h4><p class="yr">${m.yr}</p>
    <div class="inner">
      <svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet" style="flex:1;max-height:230px"
           role="img" aria-label="${DATA.country.name}, ${m.title}: ${m.valueLabel}, one national mean">
        ${([d].filter(Boolean)).map(p=>
          `<path d="${p}" fill="${m.fill}" stroke="#fff" stroke-width=".7"/>`).join("")}
      </svg>
      <svg viewBox="0 0 70 ${m.stops.length*22+20}" width="70" height="${m.stops.length*22+20}" aria-hidden="true">
        <text class="axtx" x="0" y="10">${m.unit}</text>${stops}</svg>
    </div>
    <p class="cap" style="margin:6px 0 0;font-size:12.5px">
      <b>${m.valueLabel}</b> — a single national average.</p></div>`;
}

/* v2: `open` renders the table expanded. On a results screen the table is
   supplementary and stays folded; inside a scenario panel it IS the content the
   heading promises, and a collapsed <details> there leaves "What it means for
   Colombia" followed by nothing. */
/* Third argument accepts a boolean (open/closed, the original behaviour) OR a
   string used as the summary label, so a screen carrying two tables can name
   them apart. Matched to africa-prototype 2026-09-01; every existing caller
   passes a boolean or nothing and is unaffected. */
function dataTable(headers, rows, open){
  const asLabel = typeof open === "string";
  const isOpen = asLabel ? false : !!open;
  const label = asLabel ? open : (isOpen ? "Data table" : "Show data table");
  return `<details${isOpen?" open":""}><summary style="cursor:pointer;font-size:13.5px;color:var(--ink-3);margin-top:10px">${label}</summary>
    <table class="dt"><thead><tr>${headers.map((h,i)=>`<th class="${i?'n':''}">${h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i?'n':''}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></details>`;
}

/* ---- v2 EDIT HERE: Colombia's official NDC targets, quoted from the UNFCCC
   registry submission. Figures and their basis are transcribed in the file
   header; do not edit one without the other. NDC_TARGETS is keyed by ISO code
   so a second country can be added once its submission has been read at
   source — an absent key renders no panel, which is the correct behaviour for
   a country whose NDC nobody has verified yet. ---- */
const NDC_TARGETS = {
  COL:{
    year2030:"169.44", year2035:"155–161",
    basis:"absolute fixed-level limits on net national emissions of all six greenhouse gases (CO₂, CH₄, N₂O, HFCs, PFCs, SF₆), including agriculture, forestry and other land use",
    src:"NDC 3.0 — Transformaciones para la Vida (República de Colombia), Table 1, p. 54",
    href:"https://unfccc.int/sites/default/files/2025-12/NDC%203.0%20Transformaciones%20para%20la%20Vida%20(Colombia).pdf"
  }
};

/* One line inside the mitigation slider's own box, opening the NDC material as a
   further depth of information rather than as a panel in the scroll flow.
   Revised from a full-width panel on Per's judgement, 2026-08-24: the panel
   filled roughly a third of the screen and pushed the remaining three sliders
   far enough down that they were easy to miss — the step's own task lost to its
   context. A country with no verified NDC figures gets no link, for the same
   reason it got no panel. */
/* ---- v2 EDIT HERE: provenance for the blue reference figure under each slider.
   Per, 2026-08-24: every one of those lines should open a further depth of
   information, so a participant can always ask where the number came from.

   `status` is the honest part of this object. "sourced" means the figure was
   read off the named source at the named date; "unsourced" means it is a
   rounded design input nobody has traced yet, and the panel says so in those
   words. An unsourced figure is NOT given a plausible-sounding source to fill
   the slot — that is the failure this whole layer exists to prevent. ---- */
const REFERENCE_SOURCES = {
  mitigation:{
    status:"derived",
    what:()=>`${COUNTRY.isColombia()?"Observed":"Illustrative profile"} fossil-fuel and industrial carbon dioxide level in 2024, shown in million tonnes of CO₂.`,
    how:()=>COUNTRY.isColombia()
      ? "The archived 2024 observation is 92.6594 Mt, rounded to 92.7 Mt in the label. It marks 0% on the slider; the 2050 target is a percentage change from this level. The marker is historical context, not a 2050 SSP baseline or a recommended target."
      : "The rounded illustrative 2024 country-profile level is shown in Mt and marks 0% on the slider. This is profile context, not an observed national series or a 2050 recommendation.",
    period:"2024 observation/profile level; slider target year 2050",
    src:()=>COUNTRY.isColombia()
      ? "Global Carbon Budget via Our World in Data, archived annual Colombia fossil-fuel and industrial CO₂ series, 2024."
      : "Rounded illustrative 2024 country-profile endpoint in this prototype.",
    caveat:()=>COUNTRY.isColombia()
      ? "The marker is a past observation. The grey 2050 SSP baseline on the next screen is a separate, uncertain prototype calculation."
      : "The marker is an illustrative profile value, not a measured 2024 emission level for this country."
  },
  gdp:{
    status:()=>COUNTRY.isColombia()?"sourced":"unsourced",
    what:()=>COUNTRY.isColombia()
      ? "Colombia's latest archived annual real GDP growth rate, shown as a reference for the 2025–2050 average you are asked to set. This is a growth rate, not a GDP level."
      : `A rounded illustrative annual real GDP growth profile for ${DATA.country.name}, not a measured current growth rate.`,
    how:()=>COUNTRY.isColombia()
      ? "World Bank WDI reports 2.6420% real GDP growth in 2025; the blue label rounds it to 2.6%. It does not use the selected SSP."
      : `The prototype country profile supplies ${COUNTRY.profile().gdp.toFixed(1)}% per year as a design input; no national GDP-growth observation is attached.`,
    period:()=>COUNTRY.isColombia()?"2025 annual observation":"Illustrative profile; no observation year",
    src:()=>COUNTRY.isColombia()
      ? "World Bank, World Development Indicators, NY.GDP.MKTP.KD.ZG (GDP growth, annual %); 2025 value from the edition dated 13 July 2026, retrieved 24 August 2026."
      : "Rounded country-profile design input in this prototype; no external GDP-growth series attached.",
    caveat:()=>COUNTRY.isColombia()
      ? "The 2025 observation may be revised. One annual rate can differ from a sustained 2025–2050 average, so this marker is context rather than a forecast or recommended slider setting."
      : "This is not an observed growth rate or a country forecast. The other country cards need verified national data before their blue marks can be treated as observations."
  },
  /* ---- Codex PR #50, finding 2, accepted 2026-08-24. Every field here was
     written for Colombia and then shown for all twelve countries: it promised
     five regions, called every unit a department, said "whether Colombia gets
     wetter or drier", and attached the IDEAM caveat. For Bolivia's three zones
     or Guyana's ten identity-mapped regions the traceability panel contradicted
     the map beside it — the precise failure this panel exists to prevent. Every
     field is now a function of the selected country and pathway. ---- */
  regional:{
    status:"sourced",
    title:"Where these figures come from",
    lede:()=>{
      const R=COUNTRY.regionClimate();
      return R ? `The national tiles and the ${R.length} shaded ${R.length===1?"region":"regions"} — the climate product behind them, and what its ranges mean.`
               : "The national tiles — the climate product behind them, and what its ranges mean.";
    },
    what:()=>{
      const R=COUNTRY.regionClimate();
      return `How much warmer and how much wetter or drier {country} becomes by the end of the century, nationally${R?` and by ${REGION_SCHEME_NAME[DATA.country.iso]||"region"}`:""}.`;
    },
    how:()=>{
      const R=COUNTRY.regionClimate();
      const unit=(UNIT_LABEL[DATA.country.iso]||"unit").toLowerCase();
      if(!R) return "Straight from the World Bank's CCKP CMIP6 ensemble at 0.25°. The figure shown is the ensemble median for the country.";
      if(REGION_IDENTITY.has(DATA.country.iso))
        return `Straight from the World Bank's CCKP CMIP6 ensemble at 0.25°. The national figure is the ensemble median for the country. ${DATA.country.name}'s official regions <b>are</b> its ${unit}s, so each region here is one CCKP unit — no grouping is applied, and the median and 10th–90th percentiles are taken across climate models for that unit directly.${COUNTRY.pathway()==="ssp119"?" SSP1-1.9 has no individual model runs, so there each region shows CCKP's own ensemble median for the unit, without a range.":" That median is computed here from the individual runs CCKP publishes, so it can differ slightly from CCKP's own published median for the unit, which appears when you select it."}`;
      return `Straight from the World Bank's CCKP CMIP6 ensemble at 0.25°. The national figure is the ensemble median for the country. A region is the <b>median of its ${unit}s</b>: each climate model is first summarised across the ${unit}s in a region, and the median and 10th–90th percentiles are then taken across those model results.${COUNTRY.pathway()==="ssp119"?` SSP1-1.9 has no individual model runs, so there a region's value is instead the median of its ${unit}s' CCKP ensemble medians, without a range.`:""}`;
    },
    period:"2080–2099 against a 1995–2014 baseline",
    src:"World Bank Climate Change Knowledge Portal, CMIP6 collection at 0.25°, retrieved 24 August 2026 (scripts/fetch_south_america_regional_climate.py)",
    caveat:()=>{
      const iso=DATA.country.iso, R=COUNTRY.regionClimate();
      const unit=(UNIT_LABEL[iso]||"unit").toLowerCase();
      const rain=rainfallAgreement();
      const parts=[];
      /* The rainfall sentence is derived, not asserted — see rainfallAgreement. */
      if(rain) parts.push(rain.crosses
        ? `<b>The rainfall range spans zero for ${DATA.country.name} on this pathway.</b> The models disagree on whether it gets wetter or drier, so the median is the middle of a disagreement rather than a consensus, and a rainfall figure quoted without its range overstates what is known.`
        : `<b>The rainfall range does not span zero for ${DATA.country.name} on this pathway.</b> The whole 10th–90th interval is ${rain.dir} (${signed(rain.lo,0)} to ${signed(rain.hi,0)} mm/yr), so the models agree on the direction even though they disagree on the size — an unusually robust rainfall signal, and one worth reading as such. On other pathways the range may well span zero; the statement is derived from the one you have selected.`);
      if(R && !REGION_IDENTITY.has(iso))
        parts.push(`A region is an unweighted median of its ${unit}s, so a large empty ${unit} counts as much as a small dense one; it is not a zonal climate product.`);
      if(R && REGION_IDENTITY.has(iso))
        parts.push(`${DATA.country.name}'s regions are its own administrative ${unit}s, so no grouping decision was made here.`);
      if(iso==="URY")
        parts.push(`<b>Uruguay has no official regionalisation.</b> The six regions shown are the grouping conventional in regional-development work, not a published standard — weaker evidence than the schemes used for the other eleven countries.`);
      parts.push(`<b>SSP1-1.9 has no model range at region level</b>, because CCKP publishes no individual model runs for that pathway.`);
      if(R) parts.push(iso==="COL"?"The map uses simplified department boundaries grouped into natural regions; colour represents regional estimates. San Andrés is an inset, not at its true position.":"The territories drawn on the map are schematic shapes, not administrative boundaries.");
      if(iso==="COL")
        parts.push(`This is also <b>not on IDEAM's basis</b> — IDEAM's Fourth National Communication reports <i>maximum</i> temperature for 2081–2100 against 1981–2010, a different variable, window and baseline, so the two sets of numbers will not match and neither is wrong.`);
      return parts.join(" ");
    }
  },
  elec:{
    status:"sourced",
    what:"The share of {country}'s final energy that is currently supplied as electricity — everything households, transport, services and industry use.",
    how:"Revised BECO 2024: 282,640 TJ of final electricity divided by 1,498,690 TJ total final energy, giving 18.9%. This is a context marker. The inherited health calculation still uses its earlier 2023 energy basis (17.8%); the electricity-emissions calculation uses BECO 2024.",
    period:"2024",
    src:"UPME BECO_VER_01_1975_2024.xlsx, BECO_Datos 2006-2024; canvas v2 source calculation",
    caveat:"This is electricity as a share of <i>all</i> final energy, which is lower than the figures usually quoted for electricity access or for electricity's share of household energy. A higher number heard elsewhere is most likely one of those other measures rather than a disagreement about this one."
  },
  mix:{
    status:"sourced",
    what:"The share of {country}'s electricity that currently comes from renewable and other low-emission sources.",
    how:"Revised BECO 2024 grid plants: hydro, wind and solar 208,355 / 296,486 TJ, giving 70.3%. This is a context marker; the inherited health counterfactual still holds its earlier 2023 share (76.4%) fixed. Electricity emissions use the separate Ember 2024 generation mix.",
    period:"2024",
    src:"UPME BECO_VER_01_1975_2024.xlsx, BECO_Datos 2006-2024; canvas v2 source calculation",
    caveat:"Hydro dominates this share, so it moves with rainfall from year to year. A dry year lowers it without any change in installed capacity."
  }
};

/* One further-information line per slider, in the slider's own box: the NDC
   material where it applies, and the provenance of the blue reference figure
   for every slider that has one. Rendered inline so a second link costs a row
   of text rather than a row of layout. */
/* LAYER 2 control: per-source generation mix, under the mix slider, Colombia only.
   Optional by design — with nothing pinned the model behaves exactly as before.
   Pins are shares WITHIN a group, so this can never contradict the slider above:
   wind pinned at 40% of a 30% clean share is 12% of total electricity. */
/* The sourceMix modal's content, split into three pieces on 2026-10-13 so step 4
   can show the explanation and the table as two fold-outs in the list under the
   electricity chart (Per), while the modal opened from the source editor keeps all
   three. `w` words the chain for where it is read: in the modal the slider is
   "above"; on step 4 it is the step 2 slider and the shares are set in the editor. */
function sourceMixChain(w){
  const P=COL_POWER;
  return `
      <ul class="chain">
        <li><div class="ico">1</div><div><b>The two layers multiply, so they cannot disagree</b>
          <span>${w.slider} fixes the size of each group. A share you set ${w.here} is a share
          <i>within</i> that group. Wind set to 40% of a 30% low-emission share is 40% &times; 30% =
          <b>12% of all electricity</b>. Nothing you do ${w.here} can override the slider.</span></div></li>
        <li><div class="ico">2</div><div><b>Sources you do not set keep their relative standing</b>
          <span>Whatever is left in a group is divided among the untouched sources in the proportions
          they hold today. Leaving a source alone means keeping its <i>relative</i> position, not
          freezing its absolute share. Set shares above 100% in one group and they are scaled back
          proportionally &mdash; ${w.sliderLc} is never adjusted to accommodate them.</span></div></li>
        <li><div class="ico">3</div><div><b>Every source carries its own emission factor</b>
          <span>These are life-cycle greenhouse-gas intensities, in grams of carbon dioxide
          equivalent per kilowatt-hour, so they include fuel supply and construction, not just what
          comes out of a chimney. This is why the choice matters: bioenergy at
          <b>${(P.ef.Bioenergy*1000).toFixed(0)}</b> is not the same "clean" as hydro at
          <b>${(P.ef.Hydro*1000).toFixed(0)}</b>, and coal at <b>${(P.ef.Coal*1000).toFixed(0)}</b>
          is worth more to remove than gas at <b>${(P.ef.Gas*1000).toFixed(0)}</b>.</span></div></li>
        <li><div class="ico">4</div><div><b>Where the factors come from</b>
          <span>All but wind are derived from Ember's own Colombian generation and power-sector
          emissions for ${P.anchorYear}. Recombined at that year's mix they reproduce Ember's
          published Colombian grid intensity of <b>${P.intensity2024} g</b> exactly, so nothing here
          is fitted or assumed.</span></div></li>
        <li><div class="ico">5</div><div><b>Wind is the exception, and is not Colombian</b>
          <span>Colombia generated only 0.15 TWh of wind in ${P.anchorYear} &mdash; too little for its
          emissions to be measurable, so no Colombian factor can be recovered. The
          <b>${(P.ef.Wind*1000).toFixed(1)} g</b> used here is the UNECE regional factor for Latin
          America. A Colombia-specific alternative exists &mdash; 12.93 g for an operating wind farm
          in La Guajira &mdash; measured on a different system boundary; the two should be compared,
          not averaged. Only the regional default is wired in.</span></div></li>
        <li><div class="ico">6</div><div><b>Air pollution uses a different set of factors</b>
          <span>Step 5 now responds to these choices too, but <i>not</i> through the carbon factors
          above &mdash; greenhouse gases and local pollutants rank differently. Burning biomass emits
          <b>${COL_POWER.pollutantGJ.Bioenergy.PM25}</b> grams of fine particulates per gigajoule
          against hard coal's <b>${COL_POWER.pollutantGJ.Coal.PM25}</b>, roughly 39 times worse, while
          for carbon it looks the cleaner of the two. Step 5 runs on combustion factors from the
          EMEP/EEA guidebook, converted to a per-kilowatt-hour basis with Colombia's own aggregate
          thermal efficiency of <b>${(COL_POWER.thermalEfficiency*100).toFixed(1)}%</b>. Hydro, solar
          and wind burn nothing and are zero there.</span></div></li>
      </ul>
`;
}
function sourceMixTable(label){
  const P=COL_POWER, L=100*COUNTRY.powerSharePath(2050,P.mix2024,state.drivers.mix);
  const rows=[];
  ["low","fossil"].forEach(g=>P.groups[g].forEach(n=>{
    const share=COUNTRY.resolveGroup(g)[n], ofTotal=share*(g==="low"?L:100-L)/100;
    rows.push([n, (P.ef[n]*1000).toFixed(1), P.within[g][n].toFixed(2)+"%",
               share.toFixed(1)+"%", ofTotal.toFixed(1)+"%",
               P.efNote[n]?"UNECE region":"Ember "+P.anchorYear]);
  }));
  return dataTable(["Source","g CO₂e/kWh","Share today, within group","Your 2050 share, within group","Of all electricity","Factor source"], rows, label);
}
function sourceMixPapers(){
  const P=COL_POWER;
  return `
      <div class="paperrow"><span aria-hidden="true">🗄️</span> <span class="lbl2">Generation and emissions:</span>
        Ember, Yearly Electricity Data, Colombia, ${P.anchorYear}. Extract committed at
        <code>02_literature/data/ember_colombia_power/</code>.
        <a class="paper" href="https://ember-energy.org/" target="_blank"
           rel="noopener noreferrer" title="Opens Ember in a new tab">ember-energy.org ↗</a></div>
      <div class="paperrow"><span aria-hidden="true">🗄️</span> <span class="lbl2">Wind factor:</span>
        UNECE regional life-cycle assessment, Latin America. Evidence package at
        <code>02_literature/data/wind_emission_factors/</code>.
        <a class="paper" href="https://digitallibrary.un.org/record/4020227" target="_blank"

/* LAYER 2 entry point. Was a <details> disclosure until 2026-09-01: too easy to miss,
   and cramped inside the driver row. It is now a labelled button opening a full-size
   panel, so the per-source sliders get the same room as the drivers themselves. */
function sourceMixPanel(){
  if(!COUNTRY.isColombia()) return "";
  const n=["low","fossil"].reduce((a,g)=>a+Object.keys((state.sourceMix||{})[g]||{}).length,0);
  return `<button type="button" class="btn srcbtn" data-modal="sourceMixEditor"
    style="margin-top:10px;width:100%;text-align:left;font-size:13.5px;padding:10px 12px">
    ⚙ &nbsp;Choose which sources grow and which are phased out
    <span style="opacity:.75">${n?` — ${n} set`:" — optional"}</span></button>`;
}

/* One row per generation source. `live` patches the readouts during a drag without
   rebuilding the element being dragged — rebuilding it was the bug: render() replaced
   the slider mid-gesture, so it moved one step and stopped. */
function sourceMixRow(g,n){
  const P=COL_POWER, pins=(state.sourceMix||{})[g]||{};
  const pinned=pins[n]!=null, resolved=COUNTRY.resolveGroup(g)[n];
  const L=100*COUNTRY.powerSharePath(2050,P.mix2024,state.drivers.mix);
  const ofTotal=resolved*(g==="low"?L:100-L)/100;
  const pct=Math.round(resolved);
  return `<div style="margin:16px 0">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:5px">
      <input type="checkbox" data-pin="${g}|${n}" ${pinned?"checked":""}
        aria-label="Set ${n} explicitly" style="flex:none">
      <b style="flex:1;font-size:14px">${n}${P.efNote[n]?" *":""}</b>
      <span data-srcval="${g}|${n}" style="font-size:13px;white-space:nowrap">
        <b>${resolved.toFixed(1)}%</b> of group · <b>${ofTotal.toFixed(1)}%</b> of electricity</span>
      <span style="font-size:12px;color:var(--ink-3);white-space:nowrap">${(P.ef[n]*1000).toFixed(1)} gCO₂e/kWh</span>
    </div>
    <input type="range" min="0" max="100" step="1" value="${pct}" data-src="${g}|${n}"
      style="width:100%;background:linear-gradient(90deg,var(--brand-green-dk) ${pct}%,#D9E0E4 ${pct}%)">
  </div>`;
}
function sourceMixGroup(g,label){
  const L=100*COUNTRY.powerSharePath(2050,COL_POWER.mix2024,state.drivers.mix);
  const share=g==="low"?L:100-L;
  return `<div style="margin-top:18px">
    <div style="font-size:14px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:5px">
      ${label} <span style="font-weight:400;color:var(--ink-3)">— ${share.toFixed(1)}% of electricity in 2050</span></div>
    ${COL_POWER.groups[g].map(n=>sourceMixRow(g,n)).join("")}</div>`;
}
/* Live patch during a drag: update every readout and every slider EXCEPT the one under
   the pointer, so the residual redistribution is visible without breaking the gesture. */
function sourceMixLivePatch(activeKey){
  const L=100*COUNTRY.powerSharePath(2050,COL_POWER.mix2024,state.drivers.mix);
  ["low","fossil"].forEach(g=>{
    const res=COUNTRY.resolveGroup(g), share=g==="low"?L:100-L;
    COL_POWER.groups[g].forEach(n=>{
      const key=g+"|"+n, v=res[n];
      const lbl=document.querySelector(`[data-srcval="${key}"]`);
      if(lbl) lbl.innerHTML=`<b>${v.toFixed(1)}%</b> of group · <b>${(v*share/100).toFixed(1)}%</b> of electricity`;
      const sl=document.querySelector(`[data-src="${key}"]`);
      if(sl && key!==activeKey){ sl.value=Math.round(v);
        sl.style.background=`linear-gradient(90deg,var(--brand-green-dk) ${Math.round(v)}%,#D9E0E4 ${Math.round(v)}%)`; }
      if(sl && key===activeKey)
        sl.style.background=`linear-gradient(90deg,var(--brand-green-dk) ${sl.value}%,#D9E0E4 ${sl.value}%)`;
    });
  });
}

/* Keep the native driver range input in the DOM until the pointer is released.
   Replacing it on every input event ends a drag after its first value change. */
function driverLivePatch(slider){
  renderSettings();
  const item=DATA.drivers.items.find(d=>d.id===slider.dataset.drv);
  if(!item) return;
  const value=state.drivers[item.id], box=slider.closest(".driver");
  const pct=100*(value-item.min)/(item.max-item.min);
  slider.style.background=`linear-gradient(90deg,var(--brand-green-dk) ${pct}%,#D9E0E4 ${pct}%)`;
  const readout=box.querySelector(".dval b");
  if(readout) readout.textContent=item.fmt(value);
  const nearest=Math.round((value-item.min)/((item.max-item.min)/(item.ticks.length-1)));
  box.querySelectorAll(".ticks span").forEach((tick,index)=>
    tick.classList.toggle("cur",index===nearest));
}

function referenceStatus(id){
  const status=REFERENCE_SOURCES[id].status;
  return typeof status==="function"?status():status;
}

function driverMore(id){
  const bits=[];
  if(id==="mix" && COUNTRY.isColombia()) bits.push(sourceMixPanel());
  if(id==="gdp" && COUNTRY.isColombia())
    bits.push(`<span class="info-link" data-modal="energyDemand" role="button" tabindex="0"
      >ⓘ How growth becomes energy demand, and how much that is uncertain</span>`);
  if(id==="mitigation" && NDC_TARGETS[DATA.country.iso])
    bits.push(`<span class="info-link" data-modal="ndc" role="button" tabindex="0">ⓘ What has ${DATA.country.name} already committed to?</span>`);
  if(REFERENCE_SOURCES[id]){
    const unsourced = referenceStatus(id)==="unsourced";
    bits.push(`<span class="info-link${unsourced?" unsourced":""}" data-modal="ref_${id}" role="button" tabindex="0"
      >${unsourced?"⚠ This reference is not yet sourced":"ⓘ Where this figure comes from"}</span>`);
  }
  /* One per line rather than separated inline: at this column width two links
     wrap, and an inline separator then orphans onto the second row. */
  return bits.length?`<div class="driver-more">${bits.map(b=>`<div>${b}</div>`).join("")}</div>`:"";
}

/* PER-SCENARIO PANELS — v2, 2026-08-24, adopted from africa-prototype, where
   they were added 2026-08-21 because screen 3 had one shared explanation for all
   five pathways and the scenario the user was actually choosing had no panel of
   its own. Generated from DATA.ssp.options in card order, so a pathway added
   later gets a panel automatically and its numbers cannot fall out of step with
   the model.

   This file shows: the 2050 baseline emissions, the end-of-century temperature
   and rainfall ranges, and the social cost of carbon — all of which exist for
   Colombia. Not shown: the days-above-35°C row and the population row. Colombia
   has neither, and a per-SSP national population path is not something this file
   can derive. */
(function buildScenarioPanels(){
  const FORCING={ssp119:"1.9", ssp126:"2.6", ssp245:"4.5", ssp370:"7.0", ssp585:"8.5"};
  const STORY={
    ssp119:"Sustainability — a shift toward wellbeing over growth, falling inequality and very rapid decarbonisation.",
    ssp126:"Sustainability — the same storyline, with strong and sustained reductions rather than very rapid ones.",
    ssp245:"Middle of the road — trends broadly continue as they have. Progress, but uneven and slower than pledged.",
    ssp370:"Regional rivalry — countries turn inward toward security and self-sufficiency, and co-operation breaks down.",
    ssp585:"Fossil-fuelled development — rapid growth powered by abundant fossil energy, with the highest emissions."
  };
  DATA.ssp.options.forEach(o=>{
    MODALS["scen_"+o.id]={
      title:o.label+" · "+o.name,
      lede:o.desc+".",
      body:()=>{
        /* Use the same country anchor and normalization as screen 4. */
        const series=COUNTRY.baselineFor(NGA_DATA.sspPathway[o.id]);

/* One modal per reference figure, built from REFERENCE_SOURCES rather than
   written out four times, so the panel and the slider label can never drift
   apart. Registered onto MODALS after it is defined; the bodies are functions,
   so they read the object at open time. */
Object.keys(REFERENCE_SOURCES).forEach(id=>{
  MODALS["ref_"+id] = {
    title:(typeof REFERENCE_SOURCES[id].title==="function"?REFERENCE_SOURCES[id].title():REFERENCE_SOURCES[id].title) || "Where this figure comes from",
    lede:(typeof REFERENCE_SOURCES[id].lede==="function"?REFERENCE_SOURCES[id].lede():REFERENCE_SOURCES[id].lede) || "The blue reference figure beside the slider — what it is, and what stands behind it.",
    body:()=>{
      const r=REFERENCE_SOURCES[id], val=v=>typeof v==="function"?v():v;
      const status=referenceStatus(id);
      const badge = status==="unsourced"
        ? `<div class="src-status warn"><span aria-hidden="true">⚠</span> Not yet sourced</div>`
        : status==="derived"
          ? `<div class="src-status ok"><span aria-hidden="true">◈</span> Derived here from a sourced anchor</div>`
        /* "mixed" is its own state on purpose. A published national range with a
           prototype pattern laid over it is neither sourced nor unsourced, and
           calling it either would misdescribe it in one direction or the other. */
        : status==="mixed"
          ? `<div class="src-status warn"><span aria-hidden="true">◐</span> Part published source, part prototype pattern</div>`
          : `<div class="src-status ok"><span aria-hidden="true">✓</span> Taken from a published source</div>`;
      return `${badge}
        <h3>What the figure is</h3><p>${val(r.what)}</p>
        <h3>How it is arrived at</h3><p>${val(r.how)}</p>
        <h3>Period it refers to</h3><p>${val(r.period)}</p>
        ${r.src?`<h3>Source</h3>
          <div class="paperrow"><span aria-hidden="true">📄</span> <span class="lbl2">From:</span> ${val(r.src)}</div>`:""}
        <h3>What to watch</h3><p>${val(r.caveat)}</p>`;
    },
    note:()=>{
      const s=referenceStatus(id);
      if(s==="unsourced") return `<b>This is shown to you because it is missing, not because it is settled.</b> A starting position with no
         source behind it is still a number on a screen, and it would be easy to mistake for a finding.`;
      if(s==="mixed") return `<b>Read the map for its pattern, not for a value at any one place.</b> Which regions are hit hardest,
         and roughly by how much relative to each other, is what this layer is built to convey. A figure for a particular region is
         a prototype's rendering of a published national projection, and IDEAM's own 10 × 10 km grid is the thing to consult
         before any regional number is quoted.`;
      return `<b>The figure describes where {country} is now, not where it should go.</b> It marks the slider so you can
         see how far your own choice moves from today; it does not recommend a value.`;
    }
  };
});

/* Build area cells around the five regional anchors for countries that do not yet
   have named regional geometry. The cells are clipped to the country outline, so
   every map uses territories rather than point markers. */
function regionalAreaCell(regions,index,box){
  const p=regions[index], px=box[0]+box[2]*p.x, py=box[1]+box[3]*p.y;
  let poly=[[box[0],box[1]],[box[0]+box[2],box[1]],
            [box[0]+box[2],box[1]+box[3]],[box[0],box[1]+box[3]]];
  regions.forEach((q,qi)=>{
    if(qi===index) return;
    const qx=box[0]+box[2]*q.x, qy=box[1]+box[3]*q.y;
    const A=2*(qx-px), B=2*(qy-py), C=qx*qx+qy*qy-px*px-py*py;
    const clipped=[];
    poly.forEach((end,i)=>{
      const start=poly[(i+poly.length-1)%poly.length];
      const fs=A*start[0]+B*start[1]-C, fe=A*end[0]+B*end[1]-C;
      const startIn=fs<=0, endIn=fe<=0;
      if(startIn!==endIn){
        const t=fs/(fs-fe);
        clipped.push([start[0]+t*(end[0]-start[0]),start[1]+t*(end[1]-start[1])]);
      }
      if(endIn) clipped.push(end);
    });
    poly=clipped;
  });
  return poly.length ? "M"+poly.map(v=>v.map(n=>n.toFixed(2)).join(" ")).join("L")+"Z" : "";
}

function regionalClimatePanel(metric, regions){
  const iso=DATA.country.iso;
  const d=SOUTH_AMERICA[iso].d, box=pathBBox(d), vb=iso==="COL"?DEPARTMENT_MAP.viewBox:box.map(v=>v.toFixed(1)).join(" ");
  const isTemp=metric==="temp";
  const values=regions.map(r=>r[metric]), lo=Math.min(...values), hi=Math.max(...values);
  const colors=isTemp
    ? ["#F7D08A","#F1AE58","#E77A2B","#D54D22","#B83B20","#8C1F13"]
    : ["#E8E6E1","#C6DCE5","#9FC5D4","#6AA5BB","#3F89A2","#1C6E8C"];
  const color=v=>colors[Math.min(colors.length-1,Math.round(((v-lo)/(hi-lo||1))*(colors.length-1)))];
  const title=isTemp?"Regional temperature change":"Regional yearly rainfall change";
  const fmt=v=>isTemp?signed(v,2)+"°C":signed(v,0)+" mm/yr";
  const clipId=`regional-${iso}-${metric}`;
  const rangeAvailable=regions[0]&&regions[0][metric+"P10"]!=null;
  const areas=regions.map((r,i)=>{
    const hasRange=r[metric+"P10"]!=null;
    const rangeLabel=hasRange
      ? `${r.name}: median ${fmt(r[metric])}; 10th–90th percentile across ${r[metric+"Models"]} climate models ${fmt(r[metric+"P10"])} to ${fmt(r[metric+"P90"])}`
      : `${r.name}: ${r.units>1?"median of its units' ensemble medians":"its unit's CCKP ensemble median"} ${fmt(r[metric])}; regional model range unavailable for SSP1-1.9`;
    const label=`${rangeLabel}. Click to see its ${r.units>1?"units":"unit"} and their CCKP estimates.`;
    const enc=label.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    /* Colombia has real region polygons; every other country gets a schematic
       cell built around its region's map position. */
    const paths=iso==="COL"?DEPARTMENT_MAP.regions[r.name]:[{d:regionalAreaCell(regions,i,box),name:r.name}];
    return paths.map(part=>`<path class="climate-region" d="${part.d}" fill="${color(r[metric])}"
      ${iso==="COL"?"":`clip-path="url(#${clipId})"`} tabindex="0" role="button" aria-label="${part.name}: ${enc}" data-tooltip="${part.name}: ${enc}"
      data-region="${encodeURIComponent(r.name)}"
      onmousemove="showTT(event,this.dataset.tooltip)" onmouseleave="hideTT()"
      onfocus="showFocusTT(event,this.dataset.tooltip)" onblur="hideTT()"><title>${part.name}: ${enc}</title></path>`).join("");
  }).join("");
  const legend=regions.map(r=>`<span><i style="background:${color(r[metric])}"></i>${r.name}: <b>${fmt(r[metric])}</b></span>`).join("");
  return `<div class="mapbox"><h4>${title}</h4><p class="yr">${rangeAvailable?"Median across CCKP model runs":REGION_IDENTITY.has(iso)?"CCKP ensemble median":"Median of units' CCKP medians"}, 2080–2099 against 1995–2014</p>
    <svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:230px"
      role="img" aria-label="${title} across ${DATA.country.name}">
      <defs><clipPath id="${clipId}"><path d="${d}"/></clipPath></defs>
      ${iso==="COL"?`<rect x=".5" y=".5" width="30" height="11" rx="1.5" fill="none" stroke="#9AA8A1" stroke-width=".3" stroke-dasharray="1 .8"/><circle class="climate-region" cx="5.2" cy="6" r="2.3" fill="${color(regions.find(r=>r.name==='Caribbean')[metric])}" data-region="Caribbean" role="button" tabindex="0" aria-label="San Andrés, Providencia y Santa Catalina — Caribbean region, inset; select for estimates"/><text x="9.5" y="7.4" style="font-size:3.9px;fill:#40525E">San Andrés</text>`:`<path d="${d}" fill="#EDF2EF"/>`}${areas}
      ${iso==="COL"?"":`<path d="${d}" fill="none" stroke="#708078" stroke-width=".9" vector-effect="non-scaling-stroke"/>`}</svg>
    ${iso==="COL"?'<p class="cap">Simplified department boundaries; San Andrés inset is not to scale. © <a class="paper" href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> via geoBoundaries. Adapted boundary data: <a class="paper" href="https://opendatacommons.org/licenses/odbl/1-0/">ODbL 1.0</a>. <a class="paper" href="department-boundaries.json" download>Download complete boundary data (JSON)</a> · <a class="paper" href="MAP-LICENSE.txt">Map licence and source details</a>. Frozen canvas geometry; original simplification inputs are not archived.</p>':''}
    <div class="legend" style="justify-content:flex-start;align-items:flex-start;gap:7px 14px">${legend}</div>
    <p class="cap" style="margin:9px 0 0;font-size:12.5px">${rangeAvailable
      ? "Central values are medians across model-specific region results. Colours rank regions within this pathway; hover or focus for the model range, then click or press Enter for unit-level estimates."
      : "CCKP publishes an SSP1-1.9 ensemble median but no individual-model projections, so a regional model range cannot be derived. Each central value here is instead the median of the units' CCKP ensemble medians. Click or press Enter for unit-level estimates."}</p></div>`;
}

/* The second layer behind a region: its admin-1 units with their own CCKP
   medians. Built on demand from UNIT_CLIMATE so it always matches the pathway
   currently selected. */
function regionalUnitModal(regionName){
  const R=COUNTRY.regionClimate(); if(!R) return null;
  const r=R.find(x=>x.name===regionName); if(!r) return null;
  const units=COUNTRY.unitsIn(regionName);
  if(!units.length) return null;
  const label=UNIT_LABEL[DATA.country.iso]||"Administrative unit";
  const rows=units.map(u=>`<tr><td>${u.name}</td><td class="n">${signed(u.temp,2)}&deg;C</td><td class="n">${signed(u.rain,0)} mm/yr</td></tr>`).join("");
  const identity=REGION_IDENTITY.has(DATA.country.iso);
  return {
    title:`${regionName}: ${identity?"CCKP estimates":`${label.toLowerCase()}s and CCKP estimates`}`,
    lede:`${label}-level CCKP CMIP6 ensemble medians under <b>${COUNTRY.label()}</b>, for 2080–2099 against 1995–2014.`,
    body:`${identity?"":`<p><b>In this region:</b> ${units.map(u=>u.name).join(", ")}.</p>`}
      <div style="overflow-x:auto"><table class="dt"><thead><tr><th>${label}</th><th>Temperature change</th><th>Yearly rainfall change</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      ${r.tempP10!=null?`<p class="cap" style="margin-top:10px;font-size:13px">Across the whole region the models span
        ${signed(r.tempP10,2)}°C to ${signed(r.tempP90,2)}°C in temperature and ${signed(r.rainP10,0)} to ${signed(r.rainP90,0)} mm/yr
        in rainfall — wider than the differences between the units above.</p>`:""}`,
    note:`These are Admin-1 ensemble medians, not the 10th–90th percentile ranges shown on hover.
      ${identity?"This country's official regions ARE its administrative units, so the region and the unit cover the same area."
               :"The region is a grouping of these units, and its map shape is schematic."}
      ${r.tempP10!=null?`The region's figure on the map is the median across the ${r.tempModels} individual model runs CCKP publishes; the figures above are CCKP's own ensemble medians, whose ensemble composition has not been read at source. The two can differ slightly, even where a region is a single unit.`:""}`
  };
}

       return ""; })()}

  },

  air(){ const d=DATA.air;
    const health=COUNTRY.healthData(), rows=health.years.map(y=>COUNTRY.healthAt(y)), y2050=rows[rows.length-1];
    const avoidedPct=100*(y2050.ref.index-y2050.policy.index)/y2050.ref.index;
    const improves=y2050.avoided>=0;
    const dec=COUNTRY.healthDecomposition(2050), demandContribution=-dec.demand;
    const maxDec=Math.max(.01,Math.abs(dec.direct),Math.abs(dec.mix),Math.abs(demandContribution));
    const c={title:"Premature deaths attributable to ambient air pollution",
      unit:"Deaths per year under the reference and selected energy pathways",
      years:health.years, baseline:rows.map(r=>r.refDeaths), pathway:rows.map(r=>r.policyDeaths),
      yMax:Math.max(1,Math.ceil(Math.max(...rows.map(r=>r.refDeaths))/(health.air.whoDeaths>10000?5000:health.air.whoDeaths>1000?500:100))*(health.air.whoDeaths>10000?5000:health.air.whoDeaths>1000?500:100)),
      s1:"Reference energy pathway",s2:"Your energy pathway",
      fill:improves?"Premature deaths avoided":"Additional premature deaths",
      fillNoun:"premature deaths"};
    /* v2: each bar carries its own points-to-lives conversion on hover and
       keyboard focus, so the figure can be read without opening the panel. */
    /* POINTS BECOME LIVES THROUGH THE RESPONSE FUNCTION, not a fixed rate. Corrected
       2026-09-02. Each bar used to be multiplied by whoDeaths x responsiveShare x 0.01,
       a linear rate that was right when the ambient side was a linear index proxy and
       wrong once it became a concentration-response chain: at default settings the bars
       summed to about 67 deaths while the tile above them said 86, and the panel claimed
       the two matched exactly. The conversion is now applied ONCE to the net change -
       which is the tile's own figure, from the tile's own call - and the three bars share
       it in proportion, so they still sum to the total and the total is now correct.
       perPoint is gone with it - nothing in air() converts linearly any more. */
    const tileDeaths=y2050.avoided;
    const livesOf=v=> dec.net!==0 ? v/dec.net*tileDeaths : 0;
    const decRow=(label,value)=>{
      const pts=value*100, lv=livesOf(value), lives=Math.abs(lv);
      const tip=`${label}: ${signed(pts,1)} index points, about ${fmtN(lives,0)} deaths a year ${lv>=0?"avoided":"added"} against the reference pathway.`;
      return `<div class="lab">${label}</div><div class="track" tabindex="0" role="img" aria-label="${tip}"
        onmousemove="showTT(event,'${tip.replace(/'/g,"&#39;")}')" onmouseleave="hideTT()"
        onfocus="showFocusTT(event,'${tip.replace(/'/g,"&#39;")}')" onblur="hideTT()">
        <div class="bar ${value<0?'bad':'good'}" style="width:${Math.min(50,Math.abs(value)/maxDec*48)}%"></div></div>
      <div class="val">${value<0?'−':'+'}${fmtN(Math.abs(value)*100,1)} pts</div>`;
    };

    return head(5,d.title,`<p class="sub">Your electrification and electricity-generation choices shape ${DATA.country.name}'s ambient air pollution and health burden.</p>`)+
    `<div class="body">
     ${COUNTRY.isColombia()&&COUNTRY.layer2Active()?`<div class="note"><span>ℹ️</span><span>
       <b>Your per-source choices reach this screen.</b> The generation mix you set on step 2 is
       carried here through <i>air-pollutant</i> emission factors, not the carbon ones — the two
       rank fuels differently. Burning biomass emits about <b>39 times</b> more fine particulates
       than hard coal per unit of fuel, while looking the cleaner of the two for carbon.
       </span></div>`:""}
     ${COUNTRY.isColombia()&&y2050.valid===false?`<div class="note"><span>⚠️</span><span>
       <b>These settings are outside what this method can answer.</b> The concentration change
       they imply is larger than ${DATA.country.name}'s entire measured PM₂.₅ concentration.
       The model scales concentration in proportion to emissions, which holds for moderate
       change and breaks for large change — real particulate formation is not linear in its
       precursors. The figures below are still computed, but should be read as showing a
       direction, not a magnitude.</span></div>`:""}
     ${tiles([
       {lbl:"Energy-related air pollution in 2050",sub:"against the reference energy pathway",
        val:signed(Math.round(-avoidedPct))+"%",unit:avoidedPct>=0?"lower under your pathway":"higher under your pathway"},

        sub:COUNTRY.isColombia()&&y2050.avoidedLow!=null
          ? `ambient PM₂.₅ — ${fmtN(Math.abs(Math.round(Math.min(y2050.avoidedLow,y2050.avoidedHigh))))}–${fmtN(Math.abs(Math.round(Math.max(y2050.avoidedLow,y2050.avoidedHigh))))} across the published counterfactual range`
          : "ambient PM₂.₅ and nitrogen oxides",
        val:fmtN(Math.abs(Math.round(y2050.avoided))),unit:"lives per year"},
       {lbl:improves?"Estimated annual health benefit":"Estimated annual health loss",
        /* The two OECD group values, rendered since 2026-10-17: COL_HEALTH.valuation
           says the OECD-membership ambiguity is disclosed on screen, and until then
           vslLow/vslHigh were never read. Shown as two alternatives, not as bounds:

        sub:COUNTRY.isColombia()
          ? `valued in ${health.valuation.priceYear} USD at US$${fmtN(health.valuation.vsl/1e6,2)}m per life; US$${fmtN(Math.abs(y2050.avoided)*COL_HEALTH.valuation.vslLow/1e9,2)} billion at OECD's low- and middle-income group value, US$${fmtN(Math.abs(y2050.avoided)*COL_HEALTH.valuation.vslHigh/1e9,2)} billion at its OECD-member value`
          : `valued in ${health.valuation.priceYear} USD`,
        val:"US$"+fmtN(Math.abs(y2050.valueBn),2),unit:"billion per year"}
     ])}
     <div class="help-row">${COUNTRY.isColombia()?`<span class="info-link" data-modal="ambientChain" role="button" tabindex="0">ⓘ How these figures are worked out, step by step</span>`:""}
       <span class="info-link" data-modal="health" role="button" tabindex="0">ⓘ See how the energy and health chain works</span>${uncCue()}</div>
     ${(()=>{
       /* HOUSEHOLD PATHWAY, added 2026-09-01. A SECOND and separate WHO burden, driven by

           {lbl:"Household deaths in 2050", sub:`at ${state.drivers.elec}% electrification of final energy`,

         <div class="note"><span>⚠️</span><span><b>Do not add this to the ambient figure above.</b>

       </div>`; })()}
     <div class="panel"><div class="chart-head"><div><h3>What drives the 2050 air-pollution result?</h3>
       <!-- CAPTION CORRECTED 2026-08-24. It read "Green bars reduce pollution; the

            The colour is #B55A42, which reads as red, not brown. And it named ONE bar

       <p class="cap">Green bars reduce pollution, red bars add it — which is which depends on the
       choices you made, so read the label on each bar rather than its colour</p></div>
       <div class="legend"><span class="info-link" data-modal="decomp" role="button" tabindex="0"
         >ⓘ What these bars mean, and what a point is</span></div></div>
       <div class="flow-note"><span>Final energy demand</span><span>Electrification</span><span>Electricity mix</span><span>PM₂.₅ and NOₓ health effects</span></div>
       <div class="decomp">
         ${decRow(dec.direct>=0?"Direct fuels displaced":"Additional direct fuel use",dec.direct)}

       </div>
       <p class="cap" style="margin-top:14px">Together these effects produce a net change of
       <b>${signed(dec.net*100,1)} index points</b> — <b>${fmtN(Math.abs(tileDeaths),0)} deaths a year
       ${tileDeaths>=0?"avoided":"added"}</b>, which is the figure in the tile above. A high-electrification pathway
       delivers the strongest health gains when the additional electricity is also low-emission.</p></div>
     <div class="panel"><div class="chart-head"><div><h3>${c.title}</h3><p class="cap">${c.unit}</p></div>
       <div class="legend"><span><i class="dashed"></i>${c.s1}</span><span><i class="solid"></i>${c.s2}</span></div></div>
       ${lineChart(c)}
       ${COUNTRY.isColombia()?(()=>{
         /* "This is one result", added 2026-09-02. The chart stated a single figure with
