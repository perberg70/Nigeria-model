# Nigeria Admin-1 units as returned by the World Bank CCKP API (36 states plus
# Abuja/FCT), with the six geopolitical zones the prototype aggregates to.
# Codes and names are returned together by the same endpoint with _format=xlsx;
# keeping the mapping explicit makes code/name changes visible in review.
# Order is the row order of the fetched admin1 CSVs. Used by
# src/regional_climate (config key regional_climate.admin_units).
